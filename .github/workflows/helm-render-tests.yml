name: Helm render tests

on:
  pull_request:
    branches: [main]
    paths:
      - "Chart.yaml"
      - "values*.yaml"
      - "templates/**"
      - "charts/**"
      - "scripts/test-helm-render.sh"
      - ".github/workflows/helm-render-tests.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    name: helm template scenarios (${{ matrix.helm_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm_version:
          - v3.21.3
          - v4.2.3
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: ${{ matrix.helm_version }}
      - name: Run scenarios
        run: |
          helm version
          ./scripts/test-helm-render.sh
