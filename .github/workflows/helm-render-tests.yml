name: Helm render tests

on:
  pull_request:
    branches: [main]
    paths:
      - "Chart.yaml"
      - "values*.yaml"
      - "templates/**"
      - "charts/**"
      - "scripts/test-helm-render.sh"
      - "scripts/helm-render-tests/**"
      - "scripts/test-sizing-doc.sh"
      - "docs/sizing.md"
      - ".github/workflows/helm-render-tests.yml"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned so a runner image update cannot change the strict-YAML check
  # (scenario 41) under an unchanged chart. Bump both values together; the
  # checksum is the yq_linux_amd64 SHA-256 from the release's checksums file.
  YQ_VERSION: v4.54.3
  YQ_SHA256: 129534601871538efe0ba4c5e62a34fb1d5f469bcb975c4fddeb467d82974973

jobs:
  render:
    name: helm template (${{ matrix.helm_version }}, ${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full chart-contract suite — not Helm-version related; run once.
          - helm_version: v4.2.3
            suite: full
          # Smoke + OpenShift Routes + fail-closed guards on the older engine.
          - helm_version: v3.21.3
            suite: compat
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: ${{ matrix.helm_version }}
      - name: Install yq
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/yq" \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  $RUNNER_TEMP/yq" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/yq" /usr/local/bin/yq
          yq --version
      - name: Run scenarios
        run: |
          helm version
          /usr/bin/time -p env HELM_SUITE=${{ matrix.suite }} ./scripts/test-helm-render.sh
      - name: docs/sizing.md matches the rendered requests
        if: matrix.suite == 'full'
        run: bash scripts/test-sizing-doc.sh
