name: Render diff

# What an existing install would see change on upgrade. See scripts/render-diff.rb.
# A required check, so it runs on every PR: a path filter would leave PRs that
# skip it waiting forever.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: render-diff-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diff:
    name: Render diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v4
        with:
          version: v3.21.3
      - name: Diff against the merge base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          ruby scripts/render-diff.rb "$(git merge-base "$BASE_SHA" HEAD)" \
            --labels "$LABELS" --summary summary.md || status=$?
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "${status:-0}"
