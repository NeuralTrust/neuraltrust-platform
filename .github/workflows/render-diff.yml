name: Render diff

# What an existing install would see change on upgrade. See scripts/render-diff.rb.
# A required check, so it runs on every PR: a path filter would leave PRs that
# skip it waiting forever.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: render-diff-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  diff:
    name: Render diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v4
        with:
          version: v3.21.3
      - name: Diff against the merge base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        # Labels are read live, not from the event: a re-run replays the original
        # event, so a label added after the failure would otherwise never count.
        run: |
          LABELS="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(",")')"
          ruby scripts/render-diff.rb "$(git merge-base "$BASE_SHA" HEAD)" \
            --labels "$LABELS" --summary summary.md || status=$?
          tee -a "$GITHUB_STEP_SUMMARY" < summary.md
          if [ "${status:-0}" -ne 0 ]; then
            echo "::error title=Render diff::$(head -n1 summary.md | sed 's/^## //'). The job summary lists what changed."
          fi
          exit "${status:-0}"
