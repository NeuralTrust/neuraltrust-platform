apiVersion: v2
name: neuraltrust-platform
description: NeuralTrust platform Helm chart (v2 hybrid + external)
type: application
version: 2.7.1
appVersion: "2.0.0"
icon: https://neuraltrust.ai/favicon.ico
# For v1 clusters pin --version ~1.14.0.
dependencies:
  # In-cluster analytics store (external mode).
  - name: clickhouse
    version: 1.0.5
    repository: file://./charts/clickhouse
    condition: infrastructure.clickhouse.deploy
    tags:
      - infrastructure
  # Analytics / evaluation API. Gated by global.products.dataPlane in hybrid.
  - name: data-plane-api
    version: 1.6.0
    repository: file://./charts/data-plane-api
    tags:
      - neuraltrust
      - v2
  # Control-plane API — external only (templates gated by isExternal).
  - name: control-plane-api
    version: 0.1.2
    repository: file://./charts/control-plane-api
    tags:
      - neuraltrust
      - v2
  # Control-plane App/UI — external only.
  - name: control-plane-app
    version: 0.1.22
    repository: file://./charts/control-plane-app
    tags:
      - neuraltrust
      - v2
  # TrustGate (values: agentgateway; K8s: agentgateway-*). Hybrid gated by
  # global.products.trustgate.
  - name: agentgateway
    version: 0.1.36
    repository: file://./charts/agentgateway
    tags:
      - neuraltrust
      - v2
  # TrustGuard. Hybrid gated by global.products.trustguard.
  - name: trustguard
    version: 0.1.33
    repository: file://./charts/trustguard
    tags:
      - neuraltrust
      - v2
  # TrustLens (opt-in).
  - name: trustlens
    version: 0.1.2
    repository: file://./charts/trustlens
    tags:
      - neuraltrust
      - v2
  # DataAgent (hybrid; agentgateway.dataagent / trustguard.dataagent).
  - name: dataagent
    version: 0.1.13
    repository: file://./charts/dataagent
    tags:
      - neuraltrust
      - v2
  # DataCore — v2 external only.
  - name: datacore
    version: 0.1.16
    repository: file://./charts/datacore
    tags:
      - neuraltrust
      - v2
  # ClickStack OTel collector — v2 external only.
  - name: clickstack-otel-collector
    version: 0.1.5
    repository: file://./charts/clickstack-otel-collector
    tags:
      - neuraltrust
      - v2
  # AlertEngine — v2 external only.
  - name: alertengine
    version: 0.1.7
    repository: file://./charts/alertengine
    tags:
      - neuraltrust
      - v2
  # Firewall is part of TrustGuard. Templates follow the TrustGuard product
  # gate in hybrid; always on in external.
  - name: firewall
    version: 2.1.6
    repository: file://./charts/firewall
    tags:
      - neuraltrust
  # Watchdog — optional self-monitoring/self-healing.
  - name: watchdog
    version: 0.3.3
    repository: file://./charts/watchdog
    condition: watchdog.enabled
    tags:
      - neuraltrust
      - optional
