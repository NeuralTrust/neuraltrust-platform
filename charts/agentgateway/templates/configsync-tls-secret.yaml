{{- if eq (include "agentgateway.enabled" .) "true" }}
{{- /*
Config-sync gRPC listener TLS for the AgentGateway control plane (external/full,
deployed APP_ENV). Auto-generates a self-signed CA + server certificate whose
SANs cover the control-plane Service DNS names, so the in-cluster data planes can
dial the listener with real TLS verification. Preserved across upgrades via
lookup (never rotated) and carries resource-policy: keep.

Skipped when:
  - config-sync TLS is not required (see agentgateway.configSyncTls.active), OR
  - an operator supplies configSync.grpcTls.existingSecret, OR
  - global.preserveExistingSecrets=true (secrets are pre-provisioned).
*/ -}}
{{- if eq (include "agentgateway.configSyncTls.active" .) "true" }}
{{- $tls := (default dict .Values.configSync).grpcTls | default dict }}
{{- $preserve := and .Values.global .Values.global.preserveExistingSecrets }}
{{- if and (not ($tls.existingSecret | default "")) (eq (include "agentgateway.configSyncTls.autoGenerate" .) "true") (not $preserve) }}
{{- $name := include "agentgateway.configSyncTls.secretName" . }}
{{- $days := int ($tls.durationDays | default 3650) }}
{{- $cn := include "agentgateway.configSyncTls.serverName" . }}
{{- $svc := .Values.controlPlane.name }}
{{- $ns := .Release.Namespace }}
{{- $altNames := list $svc (printf "%s.%s" $svc $ns) (printf "%s.%s.svc" $svc $ns) $cn }}
{{- /* A published listener is also dialled from outside the cluster, under its
       public name. Remote planes still have to trust this CA out of band — the
       SAN alone only stops the handshake failing on the name. */ -}}
{{- $published := eq (include "neuraltrust-platform.configSync.expose" (dict "ctx" .)) "true" }}
{{- if $published }}
{{- $altNames = append $altNames (include "neuraltrust-platform.configSync.publicHost" (dict "ctx" . "product" "agentgateway")) }}
{{- end }}
{{- $sans := $altNames | join "," | sha256sum | trunc 16 }}
{{- $crt := "" }}
{{- $key := "" }}
{{- $ca := "" }}
{{- $existing := lookup "v1" "Secret" $ns $name }}
{{- if $existing }}
{{- $annotations := default dict (default dict $existing.metadata).annotations }}
{{- /* A keypair minted before this annotation existed cannot say which names it
       covers. In-cluster clients dial names that have never changed, so keep
       reusing it there rather than rotate every existing install; a listener
       published to other clusters has to be provably right, so reissue. */}}
{{- if or (eq (default "" (index $annotations "neuraltrust.ai/tls-sans")) $sans) (not $published) }}
{{- $data := default dict $existing.data }}
{{- if hasKey $data "tls.crt" }}{{- $crt = index $data "tls.crt" }}{{- end }}
{{- if hasKey $data "tls.key" }}{{- $key = index $data "tls.key" }}{{- end }}
{{- if hasKey $data "ca.crt" }}{{- $ca = index $data "ca.crt" }}{{- end }}
{{- end }}
{{- end }}
{{- if not (and $crt $key $ca) }}
  {{- $caCert := genCA "agentgateway-configsync-ca" $days }}
  {{- $cert := genSignedCert $cn nil $altNames $days $caCert }}
  {{- $crt = $cert.Cert | b64enc }}
  {{- $key = $cert.Key | b64enc }}
  {{- $ca = $caCert.Cert | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "agentgateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: configsync-tls
  annotations:
    helm.sh/resource-policy: keep
    {{- /* Reissue trigger: what makes publishing the listener, or retargeting
           global.controlPlane.domain, actually reach the certificate. */}}
    neuraltrust.ai/tls-sans: {{ $sans | quote }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $crt | quote }}
  tls.key: {{ $key | quote }}
  ca.crt: {{ $ca | quote }}
{{- end }}
{{- end }}
{{- end }}
