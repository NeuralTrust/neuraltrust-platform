{{- if and (eq (include "agentgateway.enabled" .) "true") (eq (include "neuraltrust-platform.isExternal" .) "true") }}
{{- $img := include "agentgateway.image" (dict "repository" .Values.image.repository "tag" .Values.image.tag "global" .Values.global) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.controlPlane.name }}
  labels:
    {{- include "agentgateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  {{- if not (default dict .Values.controlPlane.autoscaling).enabled }}
  replicas: {{ .Values.controlPlane.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "agentgateway.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: control-plane
  template:
    metadata:
      labels:
        {{- include "agentgateway.labels" . | nindent 8 }}
        app.kubernetes.io/component: control-plane
      annotations:
        {{- /* AUT-403: roll when env ConfigMap / chart-managed Secret changes. */}}
        {{- include "neuraltrust-platform.checksumAnnotations" (dict "context" . "files" (list "/env-configmap.yaml" "/secrets.yaml")) | nindent 8 }}
        {{- if eq (include "neuraltrust-platform.configSync.publicSelfSigned" (dict "ctx" .)) "true" }}
        {{- /* This process reads the keypair off disk once, at startup. The
               certificate is reissued when the names it covers change — which is
               what retargeting the control-plane domain does — so without this
               the Secret updates and the listener keeps serving the old cert to
               remote data planes that no longer accept it. Scoped to the
               chart-generated path: an operator-supplied or cert-manager Secret
               rotates outside the chart, where a template checksum cannot see
               it, and in-cluster-only installs never reissue at all. */}}
        checksum/configsync-tls: {{ include (print $.Template.BasePath "/configsync-tls-secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "agentgateway.serviceAccountName" . }}
      {{- include "agentgateway.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.securityHardening }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      volumes:
      - name: tmp
        emptyDir: {}
      {{- if eq (include "agentgateway.configSyncTls.active" .) "true" }}
      - name: configsync-tls
        secret:
          secretName: {{ include "agentgateway.configSyncTls.secretName" . }}
      {{- end }}
      {{- include "neuraltrust-platform.customCaCert.volume" . | nindent 6 }}
      containers:
      - name: admin
        image: {{ $img | quote }}
        args: ["admin"]
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        envFrom:
        - configMapRef:
            name: agentgateway-env-vars
        - secretRef:
            name: agentgateway-secrets
        env:
        {{- /* Shared credentials come from platform-secrets; an explicit env
               entry outranks the legacy copy still arriving via envFrom. */}}
        {{- /* SERVER_SECRET_KEY always. In saas the same CONFIG_SYNC_SIGNING_SECRET
               DataCore mints with is verified here as CONFIG_SYNC_JWT_SECRET so
               private/hybrid data planes can dial with a per-tenant JWT. */}}
        {{- $agShared := dict "SERVER_SECRET_KEY" "SERVER_SECRET_KEY" }}
        {{- if eq (include "neuraltrust-platform.isSaas" .) "true" }}
        {{- $_ := set $agShared "CONFIG_SYNC_JWT_SECRET" "CONFIG_SYNC_SIGNING_SECRET" }}
        {{- end }}
        {{- include "neuraltrust-platform.platformSecretEnv" (dict "ctx" . "keys" $agShared "skip" .Values.controlPlane.extraEnv) | nindent 8 }}
        {{- with include "agentgateway.datastoreCredentialEnv" . }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- include "neuraltrust-platform.agentgatewayM2m.adminEnv" (dict "ctx" . "skip" .Values.controlPlane.extraEnv) | nindent 8 }}
        {{- with .Values.controlPlane.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- /* Auth mode only on admin (the gRPC server). Proxy/MCP share the
               env ConfigMap and would crash if they saw signed/composite without
               their own JWT secret and shared token. "signed" — not composite —
               because this chart does not mint CONFIG_SYNC_TOKEN for an
               in-cluster fleet pull. */}}
        {{- if eq (include "neuraltrust-platform.isSaas" .) "true" }}
        - name: CONFIG_SYNC_AUTH_MODE
          value: "signed"
        - name: CONFIG_SYNC_JWT_ISSUER
          value: "datacore"
        - name: CONFIG_SYNC_JWT_AUDIENCE
          value: "config-sync"
        {{- end }}
        {{- if eq (include "agentgateway.configSyncTls.active" .) "true" }}
        - name: CONFIG_SYNC_GRPC_TLS_CERT
          value: {{ printf "%s/tls.crt" (include "agentgateway.configSyncTls.mountPath" .) | quote }}
        - name: CONFIG_SYNC_GRPC_TLS_KEY
          value: {{ printf "%s/tls.key" (include "agentgateway.configSyncTls.mountPath" .) | quote }}
        {{- end }}
        {{- include "neuraltrust-platform.trustguardClientEnv" (dict "ctx" . "idVar" "TRUSTGUARD_CLIENT_ID" "secretVar" "TRUSTGUARD_CLIENT_SECRET") | nindent 8 }}
        {{- include "neuraltrust-platform.proxy-env" . | nindent 8 }}
        {{- include "neuraltrust-platform.customCaCert.env" (dict "runtime" "go" "ctx" .) | nindent 8 }}
        {{- include "neuraltrust-platform.configSyncTokenEnv" . | nindent 8 }}
        {{- include "neuraltrust-platform.appVersionEnv" (dict "tag" .Values.image.tag) | nindent 8 }}
        {{- if eq (include "neuraltrust-platform.isExternal" .) "true" }}
        {{- include "neuraltrust-platform.clickstack.externalOtlpHeadersEnv" . | nindent 8 }}
        {{- end }}
        {{- if .Values.securityHardening }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        {{- end }}
        ports:
        - containerPort: {{ .Values.controlPlane.ports.http }}
          name: http
        {{- with .Values.controlPlane.ports.grpc }}
        - containerPort: {{ . }}
          name: grpc
        {{- end }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        {{- if eq (include "agentgateway.configSyncTls.active" .) "true" }}
        - name: configsync-tls
          mountPath: {{ include "agentgateway.configSyncTls.mountPath" . | quote }}
          readOnly: true
        {{- end }}
        {{- include "neuraltrust-platform.customCaCert.volumeMount" . | nindent 8 }}
        resources:
          {{- toYaml .Values.controlPlane.resources | nindent 10 }}
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
      {{- include "neuraltrust-platform.nodeSelector" (dict "ctx" . "local" .Values.controlPlane.nodeSelector) | nindent 6 }}
      {{- include "neuraltrust-platform.tolerations" (dict "ctx" . "local" .Values.controlPlane.tolerations) | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.controlPlane.name }}
  labels:
    {{- include "agentgateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
  {{- $negAnnotations := include "neuraltrust-platform.service.negAnnotations" (dict "global" .Values.global "pscServiceKey" "agentgateway-admin") }}
  {{- with $negAnnotations }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.controlPlane.service.type | default "ClusterIP" }}
  ports:
    - port: 80
      targetPort: {{ .Values.controlPlane.ports.http }}
      protocol: TCP
      name: http
    {{- with .Values.controlPlane.ports.grpc }}
    - port: {{ . }}
      targetPort: {{ . }}
      protocol: TCP
      name: grpc
    {{- end }}
  selector:
    {{- include "agentgateway.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
{{- end }}
