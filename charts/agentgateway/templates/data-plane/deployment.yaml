{{- if eq (include "agentgateway.enabled" .) "true" }}
{{- $img := include "agentgateway.image" (dict "repository" .Values.image.repository "tag" .Values.image.tag "global" .Values.global) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.dataPlane.name }}
  labels:
    {{- include "agentgateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-plane
spec:
  {{- if not (default dict .Values.dataPlane.autoscaling).enabled }}
  replicas: {{ .Values.dataPlane.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "agentgateway.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: data-plane
  template:
    metadata:
      labels:
        {{- include "agentgateway.labels" . | nindent 8 }}
        app.kubernetes.io/component: data-plane
      annotations:
        {{- /* AUT-403: roll when env ConfigMap / chart-managed Secret changes. */}}
        {{- include "neuraltrust-platform.checksumAnnotations" (dict "context" . "files" (list "/env-configmap.yaml" "/secrets.yaml")) | nindent 8 }}
        {{- /* Hybrid redis-secrets is umbrella-owned; BasePath cannot reach it.
               Operator existingSecret is intentionally omitted (no chart content). */}}
        {{- if and (eq (include "neuraltrust-platform.isHybrid" .) "true") (eq (include "neuraltrust-platform.v2.hybridRedis.chartManagedSecret" .) "true") }}
        checksum/redis-secrets: {{ include "neuraltrust-platform.v2.hybridRedis.secretChecksum" . | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "agentgateway.serviceAccountName" . }}
      {{- include "agentgateway.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.securityHardening }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      volumes:
      - name: tmp
        emptyDir: {}
      {{- if (eq (include "neuraltrust-platform.configSync.enabled" .) "true") }}
      - name: config-sync-lkg
        emptyDir: {}
      {{- end }}
      {{- if and (eq (include "neuraltrust-platform.configSync.enabled" .) "true") (eq (include "agentgateway.configSyncTls.active" .) "true") }}
      - name: configsync-tls
        secret:
          secretName: {{ include "agentgateway.configSyncTls.secretName" . }}
      {{- end }}
      {{- include "neuraltrust-platform.customCaCert.volume" . | nindent 6 }}
      containers:
      - name: proxy
        image: {{ $img | quote }}
        args: ["proxy"]
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        envFrom:
        - configMapRef:
            name: agentgateway-env-vars
        - secretRef:
            name: agentgateway-secrets
        {{- if eq (include "neuraltrust-platform.isHybrid" .) "true" }}
        {{- /* REDIS_HOST/REDIS_PORT/REDIS_PASSWORD come from `redis-secrets`.
               Listed last so the shared credentials win over any legacy
               per-service overrides. Postgres is no longer injected wholesale —
               see the explicit DB_* env below. */}}
        - secretRef:
            name: {{ include "neuraltrust-platform.v2.hybridRedis.secretName" . | quote }}
            optional: true
        {{- if ne (include "neuraltrust-platform.v2.hybridPg.chartManagedSecret" .) "true" }}
        {{- /* An operator-supplied Secret keeps the passthrough: its key names are
               theirs, so the chart cannot rename them. Deliberately not checksummed
               (AUT-403): the chart has no template content to hash. */}}
        - secretRef:
            name: {{ include "neuraltrust-platform.v2.hybridPg.secretName" . | quote }}
            optional: true
        {{- end }}
        {{- end }}
        env:
        {{- /* Shared credentials come from platform-secrets; an explicit env
               entry outranks the legacy copy still arriving via envFrom. */}}
        {{- include "neuraltrust-platform.platformSecretEnv" (dict "ctx" . "keys" (dict "SERVER_SECRET_KEY" "SERVER_SECRET_KEY") "skip" .Values.dataPlane.extraEnv) | nindent 8 }}
        {{- with include "agentgateway.datastoreCredentialEnv" . }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- if and (eq (include "neuraltrust-platform.isHybrid" .) "true") (eq (include "neuraltrust-platform.v2.hybridPg.chartManagedSecret" .) "true") }}
        {{- include "neuraltrust-platform.postgresEnv" (dict "ctx" . "skip" .Values.dataPlane.extraEnv) | nindent 8 }}
        {{- end }}
        {{- include "neuraltrust-platform.hybridRedisTlsEnv" . | nindent 8 }}
        {{- with .Values.dataPlane.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "neuraltrust-platform.trustguardClientEnv" (dict "ctx" . "idVar" "TRUSTGUARD_CLIENT_ID" "secretVar" "TRUSTGUARD_CLIENT_SECRET") | nindent 8 }}
        {{- include "neuraltrust-platform.proxy-env" . | nindent 8 }}
        {{- include "neuraltrust-platform.customCaCert.env" (dict "runtime" "go" "ctx" .) | nindent 8 }}
        {{- if eq (include "agentgateway.configSyncTls.active" .) "true" }}
        {{- include "neuraltrust-platform.configSyncEnv" (dict "ctx" . "product" "agentgateway" "tlsCaPath" (printf "%s/ca.crt" (include "agentgateway.configSyncTls.mountPath" .))) | nindent 8 }}
        {{- else }}
        {{- include "neuraltrust-platform.configSyncEnv" (dict "ctx" . "product" "agentgateway") | nindent 8 }}
        {{- end }}
        {{- include "neuraltrust-platform.configSyncTokenEnv" . | nindent 8 }}
        {{- include "neuraltrust-platform.appVersionEnv" (dict "tag" .Values.image.tag) | nindent 8 }}
        {{- if eq (include "neuraltrust-platform.isExternal" .) "true" }}
        {{- include "neuraltrust-platform.clickstack.externalOtlpHeadersEnv" . | nindent 8 }}
        {{- end }}
        {{- if .Values.securityHardening }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        {{- end }}
        ports:
        - containerPort: {{ .Values.dataPlane.ports.http }}
          name: http
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        {{- if (eq (include "neuraltrust-platform.configSync.enabled" .) "true") }}
        - name: config-sync-lkg
          mountPath: /var/lib/trustgate
        {{- end }}
        {{- if and (eq (include "neuraltrust-platform.configSync.enabled" .) "true") (eq (include "agentgateway.configSyncTls.active" .) "true") }}
        - name: configsync-tls
          mountPath: {{ include "agentgateway.configSyncTls.mountPath" . | quote }}
          readOnly: true
        {{- end }}
        {{- include "neuraltrust-platform.customCaCert.volumeMount" . | nindent 8 }}
        resources:
          {{- toYaml .Values.dataPlane.resources | nindent 10 }}
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
      {{- include "neuraltrust-platform.nodeSelector" (dict "ctx" . "local" .Values.dataPlane.nodeSelector) | nindent 6 }}
      {{- include "neuraltrust-platform.tolerations" (dict "ctx" . "local" .Values.dataPlane.tolerations) | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.dataPlane.name }}
  labels:
    {{- include "agentgateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-plane
  {{- $negAnnotations := include "neuraltrust-platform.service.negAnnotations" (dict "global" .Values.global "pscServiceKey" "agentgateway-proxy") }}
  {{- with $negAnnotations }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.dataPlane.service.type | default "ClusterIP" }}
  ports:
    - port: 80
      targetPort: {{ .Values.dataPlane.ports.http }}
      protocol: TCP
      name: http
  selector:
    {{- include "agentgateway.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: data-plane
{{- end }}
