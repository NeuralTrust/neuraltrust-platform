{{- if eq (include "agentgateway.enabled" .) "true" }}
{{- $isHybrid := eq (include "neuraltrust-platform.isHybrid" .) "true" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentgateway-env-vars
  labels:
    {{- include "agentgateway.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  APP_ENV: {{ .Values.config.appEnv | quote }}
  SERVER_ADMIN_PORT: {{ .Values.controlPlane.ports.http | quote }}
  SERVER_PROXY_PORT: {{ .Values.dataPlane.ports.http | quote }}
  SERVER_MCP_PORT: {{ .Values.mcp.ports.http | quote }}
  # App reads GATEWAY_BASE_DOMAIN / MCP_BASE_DOMAIN (see AgentGateway config.go).
  # Empty → llm.<global.domain> / mcp.<global.domain> for dual header+subdomain
  # discovery (exact primary host needs a header; wildcard slug hosts do not).
  GATEWAY_BASE_DOMAIN: {{ include "agentgateway.config.effectiveGatewayBaseDomain" . | quote }}
  MCP_BASE_DOMAIN: {{ include "agentgateway.config.effectiveMcpBaseDomain" . | quote }}
  {{- /* Always emitted: the binary defaults RATE_LIMIT_ENABLED to true, so an
         unset key would turn plan metering on in a customer cluster that has no
         entitlements to meter against. hasKey keeps an explicit false from a
         minimal override from being read as absent. */}}
  {{- $rateLimit := false }}
  {{- if hasKey .Values.config "rateLimitEnabled" }}{{- $rateLimit = .Values.config.rateLimitEnabled }}{{- end }}
  RATE_LIMIT_ENABLED: {{ $rateLimit | quote }}
  {{- if $isHybrid }}
  # v2 hybrid: DB_HOST/DB_PORT/DB_USER/DB_NAME/DB_PASSWORD/DB_SSL_MODE are supplied
  # through the shared `postgresql-secrets` Secret (via envFrom on the Deployment).
  # A single `neuraltrust` role owns the shared `neuraltrust` database, so no
  # per-service overrides are needed here.
  REDIS_DB: {{ .Values.redis.db | default "0" | quote }}
  {{- else }}
  # v2 external: each service points at its own PostgreSQL role/database, but
  # shares the endpoint. Host/port/sslMode fall back to `global.postgresql`, then
  # to the in-cluster `control-plane-postgresql` Service; set
  # `.Values.database.*` to override just this service.
  DB_HOST: {{ include "neuraltrust-platform.postgres.host" (dict "ctx" . "host" .Values.database.host) | quote }}
  DB_PORT: {{ include "neuraltrust-platform.postgres.port" (dict "ctx" . "port" .Values.database.port) | quote }}
  DB_NAME: {{ include "neuraltrust-platform.v2.dbName" (dict "ctx" . "explicit" .Values.database.name "external" "agentgateway") | quote }}
  DB_USER: {{ include "neuraltrust-platform.v2.writerUser" (dict "ctx" . "explicit" .Values.database.user "default" "agentgateway") | quote }}
  DB_SSL_MODE: {{ include "neuraltrust-platform.postgres.sslMode" (dict "ctx" . "sslMode" .Values.database.sslMode) | quote }}
  {{- if eq (include "neuraltrust-platform.postgres.iamAuth" (dict "ctx" . "database" .Values.database)) "true" }}
  {{- /* IAM (RDS) DB auth: no static DB_PASSWORD is shipped; the service mints a
         token. POSTGRES_LOGIN is the only switch TrustGate reads for this
         (pkg/config/config.go). Defaults from global.postgresql.authMode when
         database.iamAuth is unset (AUT-392). */}}
  POSTGRES_LOGIN: "aws"
  {{- /* The binary does not read AWS_REGION itself, but the AWS SDK it hands the
         token request to fails with "aws region is required" when the default
         chain resolves nothing — and IRSA supplies a role and token file, not a
         region. Emitted when known so IAM does not depend on node-level config. */}}
  {{- with (include "agentgateway.awsRegion" .) }}
  AWS_REGION: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- /* Host/port/username/tls fall back to `global.redis` so a managed cache is
         declared once rather than per service. */}}
  {{- $redisUser := include "neuraltrust-platform.redis.username" (dict "ctx" . "username" .Values.redis.username) }}
  {{- $redisTls := include "neuraltrust-platform.redis.tls" (dict "ctx" . "tls" .Values.redis.tls) }}
  REDIS_HOST: {{ include "neuraltrust-platform.redis.host" (dict "ctx" . "host" .Values.redis.host) | quote }}
  REDIS_PORT: {{ include "neuraltrust-platform.redis.port" (dict "ctx" . "port" .Values.redis.port) | quote }}
  REDIS_DB: {{ .Values.redis.db | default "0" | quote }}
  {{- if $redisUser }}
  REDIS_USERNAME: {{ $redisUser | quote }}
  {{- end }}
  {{- if $redisTls }}
  # TLS-only managed Redis (e.g. ElastiCache Serverless enforces in-transit encryption).
  # TrustGate reads REDIS_TLS_ENABLED / REDIS_TLS_INSECURE_VERIFY (not REDIS_TLS).
  REDIS_TLS_ENABLED: {{ $redisTls | quote }}
  {{- end }}
  {{- if and .Values.redis.tlsInsecureVerify (ne (.Values.redis.tlsInsecureVerify | toString) "") }}
  REDIS_TLS_INSECURE_VERIFY: {{ .Values.redis.tlsInsecureVerify | quote }}
  {{- end }}
  {{- if .Values.redis.iamAuth }}
  # IAM (ElastiCache) Redis auth: TrustGate mints a SigV4 token at connect time
  # (REDIS_LOGIN=aws). No static REDIS_PASSWORD is shipped.
  REDIS_IAM_AUTH: "true"
  REDIS_LOGIN: "aws"
  {{- if and .Values.redis.cacheName (ne (.Values.redis.cacheName | toString) "") }}
  REDIS_CACHE_NAME: {{ .Values.redis.cacheName | quote }}
  {{- end }}
  {{- if .Values.redis.awsServerless }}
  REDIS_AWS_SERVERLESS: "true"
  {{- end }}
  {{- end }}
  {{- end }}
  # Exporters come from env vars; no telemetry.yaml is mounted. FILE is pinned
  # empty because the binary default is "config/telemetry.yaml" — leaving it
  # unset would probe that path. Requires TrustGate v0.37.0+.
  # Names differ per class: the merged default list is keyed by name, so a bare
  # "otlp" token on both sides would drop the raw exporter.
  TELEMETRY_ENABLED: {{ .Values.config.telemetryEnabled | quote }}
  TELEMETRY_EXPORTERS_FILE: ""
  TELEMETRY_EXPORTERS_METADATA: {{ include "neuraltrust-platform.telemetry.metadataExporters" . | quote }}
  TELEMETRY_EXPORTERS_RAW: {{ include "neuraltrust-platform.telemetry.rawExporters" . | quote }}
  {{- if eq (include "neuraltrust-platform.isExternal" .) "true" }}
  # OTLP logs via WithEndpointURL — path must include /v1/logs.
  # Auth from clickstack-collector-secrets on the Deployments.
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ printf "http://clickstack-collector.%s.svc.cluster.local:4318/v1/logs" .Release.Namespace | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  {{- else if eq (include "neuraltrust-platform.clickstackHybridEnabled" .) "true" }}
  # Hybrid: plain OTLP to local clickstack-egress-collector (enrolment auth).
  {{- include "neuraltrust-platform.clickstack.otlpEnv" . | nindent 2 }}
  {{- end }}
  {{- /* TrustGuard URL when Guard is on (hybrid positive select / external full). */ -}}
  {{- $tg := default dict .Values.trustguard -}}
  {{- if eq (include "neuraltrust-platform.product.enabled" (dict "ctx" . "product" "trustguard")) "true" -}}
  # In-cluster TrustGuard data-plane URL. Derived from the stable Service name +
  # release namespace (Service listens on port 80), so it never needs setting in
  # a single-umbrella deploy. Override .Values.trustguard.baseURL only when
  # TrustGuard runs outside this release. TRUSTGUARD_CLIENT_ID/_SECRET are wired
  # from the shared trustguard-client-credentials Secret in the Deployment env.
  TRUSTGUARD_BASE_URL: {{ $tg.baseURL | default (printf "http://trustguard-data-plane.%s.svc.cluster.local" .Release.Namespace) | quote }}
  {{- end -}}
{{- end }}
