{{- if and (eq (include "agentgateway.enabled" .) "true") (eq (include "agentgateway.secretStores.enabled" .) "true") }}
{{- $c := include "agentgateway.secretStores.compiled" . | fromYaml }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentgateway.secretStores.configMapName" . }}
  labels:
    {{- include "agentgateway.labels" . | nindent 4 }}
data:
  stores.yaml: |
    {{- toYaml $c.file | nindent 4 }}
{{- end }}
