{{- /* What the in-cluster secrets generator creates for agentgateway
       (templates/_secrets_generator.tpl in the umbrella chart). */ -}}
{{- if eq (include "agentgateway.enabled" .) "true" }}
{{- $db := include "neuraltrust-platform.secretsGenerator.dbEntry" (dict "ctx" . "db" .Values.database "key" "AGENTGATEWAY_DB_PASSWORD" "adopt" (list (list "agentgateway-secrets" "DB_PASSWORD"))) | fromYaml }}
{{- $entries := list }}
{{- $pins := dict }}
{{- if $db.entry }}
  {{- $entries = append $entries $db.entry }}
  {{- if $db.pin }}{{- $_ := set $pins "AGENTGATEWAY_DB_PASSWORD" $db.pin }}{{- end }}
{{- end }}
{{- /* MCP session signer: the shape genPrivateKey "rsa" produced (PKCS#1 PEM). */}}
{{- if eq (include "agentgateway.stsSigningKey.generated" .) "true" }}
  {{- $entries = append $entries (dict "key" "STS_SIGNING_KEY" "type" "rsa-pkcs1" "adopt" (list (list "agentgateway-secrets" "STS_SIGNING_KEY"))) }}
{{- end }}
{{- /* Config-sync listener keypair: the SANs of configsync-tls-secret.yaml, in
       its order, so the digest matches and an upgrade adopts the certificate
       the chart rendered. A published listener also carries its public name,
       and is reissued when that name changes. */}}
{{- if eq (include "agentgateway.configSyncTls.generated" .) "true" }}
  {{- $tls := (default dict .Values.configSync).grpcTls | default dict }}
  {{- $svc := .Values.controlPlane.name }}
  {{- $cn := include "agentgateway.configSyncTls.serverName" . }}
  {{- $sans := list $svc (printf "%s.%s" $svc .Release.Namespace) (printf "%s.%s.svc" $svc .Release.Namespace) $cn }}
  {{- $published := eq (include "neuraltrust-platform.configSync.expose" (dict "ctx" .)) "true" }}
  {{- if $published }}
    {{- $sans = append $sans (include "neuraltrust-platform.configSync.publicHost" (dict "ctx" . "product" "agentgateway")) }}
  {{- end }}
  {{- $entries = append $entries (dict "type" "tls" "secret" (include "agentgateway.configSyncTls.secretName" .) "cn" $cn "caCn" "agentgateway-configsync-ca" "sans" $sans "days" (int ($tls.durationDays | default 3650)) "reissue" $published "adopt" (list (list "agentgateway-configsync-tls"))) }}
{{- end }}
{{- include "neuraltrust-platform.secretsGenerator.specObjects" (dict "ctx" . "component" "agentgateway" "entries" $entries "pins" $pins) }}
{{- end }}
