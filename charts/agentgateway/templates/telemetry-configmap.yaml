{{- if eq (include "agentgateway.enabled" .) "true" }}
{{- /*
Mode-specific default telemetry exporters. Hybrid keeps raw payloads in the
customer-boundary Postgres for DataAgent. External sends metadata and raw events
over OTLP/HTTP to the in-cluster ClickStack collector.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentgateway-telemetry
  labels:
    {{- include "agentgateway.labels" . | nindent 4 }}
data:
  telemetry.yaml: |
    exporters:
      {{- if eq (include "neuraltrust-platform.isHybrid" .) "true" }}
      {{- if eq (include "neuraltrust-platform.clickstackHybridEnabled" .) "true" }}
      metadata:
        - name: metadata-otlp
          type: otlp
      {{- end }}
      raw:
        {{- /* No dsn_env: the exporter falls back to the service DB_* config
               (RUN-1086). Requires a TrustGate image that supports that path. */}}
        - name: sensible-pg
          type: postgres
        {{- if eq (include "neuraltrust-platform.clickstackHybridEnabled" .) "true" }}
        - name: raw-otlp
          type: otlp
        {{- end }}
      {{- else }}
      metadata:
        - name: metadata-otlp
          type: otlp
      raw:
        - name: raw-otlp
          type: otlp
      {{- end }}
{{- end }}
