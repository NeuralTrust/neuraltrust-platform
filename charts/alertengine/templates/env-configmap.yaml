{{- if eq (include "alertengine.deploy" .) "true" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertengine-env-vars
  labels:
    {{- include "alertengine.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  SERVER_PORT: {{ .Values.config.serverPort | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  LOG_FORMAT: {{ .Values.config.logFormat | quote }}
  # ---- Postgres (CRUD + alert state) ----
  DB_HOST: {{ include "neuraltrust-platform.postgres.host" (dict "ctx" . "host" .Values.database.host) | quote }}
  DB_PORT: {{ include "neuraltrust-platform.postgres.port" (dict "ctx" . "port" .Values.database.port) | quote }}
  DB_NAME: {{ .Values.database.name | quote }}
  DB_USER: {{ .Values.database.user | quote }}
  DB_SSL_MODE: {{ include "neuraltrust-platform.postgres.sslMode" (dict "ctx" . "sslMode" .Values.database.sslMode) | quote }}
  {{- if eq (include "neuraltrust-platform.postgres.iamAuth" (dict "ctx" . "database" .Values.database)) "true" }}
  # IAM (RDS) DB auth: AlertEngine mints a SigV4 token per connection (DB_AUTH_MODE=iam).
  # No static DB_PASSWORD is shipped. Defaults from global.postgresql.authMode when
  # database.iamAuth is unset (AUT-392). AWS_REGION is required by the binary.
  DB_IAM_AUTH: "true"
  DB_AUTH_MODE: "iam"
  {{- $aeRegion := .Values.database.awsRegion | default (default dict (default dict .Values.global).postgresql).awsRegion | default "" }}
  {{- if and $aeRegion (ne ($aeRegion | toString) "") }}
  AWS_REGION: {{ $aeRegion | quote }}
  {{- end }}
  {{- end }}
  # ---- ClickHouse (event source, native protocol) ----
  {{- /* AUT-636: resolves through global.clickhouse. `secure` is this binary's
         name for the same flag DataCore calls `tls`. */}}
  {{- $ch := include "neuraltrust-platform.clickhouse.resolve" (dict "local" .Values.clickhouse "global" .Values.global) | fromYaml }}
  CLICKHOUSE_ADDR: {{ printf "%s:%v" $ch.host $ch.nativePort | quote }}
  CLICKHOUSE_DATABASE: {{ .Values.clickhouse.database | quote }}
  CLICKHOUSE_USERNAME: {{ $ch.user | quote }}
  CLICKHOUSE_SECURE: {{ $ch.tls | quote }}
  # ---- Auth (JWT teamId, mirrors app BFF) ----
  AUTH_ENABLED: {{ .Values.config.authEnabled | quote }}
  # ---- Worker (evaluation + SIEM forwarding) ----
  WORKER_ENABLED: {{ .Values.config.workerEnabled | quote }}
  WORKER_HEALTH_PORT: {{ .Values.config.workerHealthPort | quote }}
  WORKER_EVAL_INTERVAL: {{ .Values.config.workerEvalInterval | quote }}
  WORKER_FORWARD_INTERVAL: {{ .Values.config.workerForwardInterval | quote }}
{{- end }}
