{{- /* What the in-cluster secrets generator creates for AlertEngine
       (templates/_secrets_generator.tpl in the umbrella chart). */ -}}
{{- if eq (include "alertengine.deploy" .) "true" }}
{{- $db := include "neuraltrust-platform.secretsGenerator.dbEntry" (dict "ctx" . "db" .Values.database "key" "ALERTENGINE_DB_PASSWORD" "adopt" (list (list "alertengine-secrets" "DB_PASSWORD"))) | fromYaml }}
{{- $entries := list }}
{{- $pins := dict }}
{{- if $db.entry }}
  {{- $entries = append $entries $db.entry }}
  {{- if $db.pin }}{{- $_ := set $pins "ALERTENGINE_DB_PASSWORD" $db.pin }}{{- end }}
{{- end }}
{{- include "neuraltrust-platform.secretsGenerator.specObjects" (dict "ctx" . "component" "alertengine" "entries" $entries "pins" $pins) }}
{{- end }}
