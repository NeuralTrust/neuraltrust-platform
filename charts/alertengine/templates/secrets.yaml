{{- if eq (include "alertengine.deploy" .) "true" }}
{{- if and (include "neuraltrust-platform.autoGenerateSecrets" .) (not .Values.global.preserveExistingSecrets) }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace "alertengine-secrets") }}
{{- $hasExplicit := or .Values.database.password .Values.authJwtSecret .Values.appEncryptionKey }}
{{- if or .Release.IsInstall $existing $hasExplicit }}
{{- $data := dict }}
{{- /* IAM DB auth ships no static password (service mints a token), and an
       operator Secret named under `database.existingSecret` owns it instead —
       then the key is left out here and injected at the Deployment. */}}
{{- if and (ne (include "neuraltrust-platform.postgres.iamAuth" (dict "ctx" . "database" .Values.database)) "true") (not (include "neuraltrust-platform.datastore.credentialIsExternal" (dict "ref" (include "neuraltrust-platform.dbPasswordRef" (dict "ctx" . "db" .Values.database "key" "ALERTENGINE_DB_PASSWORD") | fromYaml)))) }}
  {{- $_ := set $data "DB_PASSWORD" (include "neuraltrust-platform.resolveSecret" (dict "value" .Values.database.password "existingSecret" $existing "secretKey" "DB_PASSWORD" "length" 32)) }}
{{- end }}
{{- if ne (include "neuraltrust-platform.secretsGenerator.active" .) "true" }}
  {{- $_ := set $data "AUTH_JWT_SECRET" (include "neuraltrust-platform.resolveSecret" (dict "value" .Values.authJwtSecret "existingSecret" $existing "secretKey" "AUTH_JWT_SECRET" "length" 64)) }}
  {{- $_ := set $data "APP_ENCRYPTION_KEY" (include "neuraltrust-platform.resolveSecret" (dict "value" .Values.appEncryptionKey "existingSecret" $existing "secretKey" "APP_ENCRYPTION_KEY" "length" 32)) }}
{{- end }}
{{- /* CLICKHOUSE_PASSWORD is sourced from the shared ClickHouse secret
       (.Values.clickhouse.existingSecret) via the Deployment env, so AlertEngine
       and DataCore authenticate with the same credential. Not stored here. With
       nothing left to hold, the Secret is not rendered. */}}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: alertengine-secrets
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "alertengine.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k := keys $data | sortAlpha }}
  {{ $k }}: {{ index $data $k | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
