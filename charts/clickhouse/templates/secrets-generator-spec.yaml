{{- /* What the in-cluster secrets generator creates for the in-cluster ClickHouse
       (templates/_secrets_generator.tpl in the umbrella chart). */ -}}
{{- if and (eq (include "neuraltrust-platform.clickhouseAllowed" .) "true") (eq (include "clickhouse.password.generated" .) "true") }}
{{- $entries := list (dict "key" "CLICKHOUSE_PASSWORD" "type" "alnum" "length" 32 "adopt" (list (list (include "clickhouse.fullname" .) "admin-password"))) }}
{{- $pins := dict }}
{{- if .Values.auth.password }}{{- $_ := set $pins "CLICKHOUSE_PASSWORD" .Values.auth.password }}{{- end }}
{{- include "neuraltrust-platform.secretsGenerator.specObjects" (dict "ctx" . "component" "clickhouse" "entries" $entries "pins" $pins) }}
{{- end }}
