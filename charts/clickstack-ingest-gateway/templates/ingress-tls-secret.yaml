{{- if and (eq (include "clickstack-ingest-gateway.deploy" .) "true") .Values.ingress.enabled (eq (include "clickstack-ingest-gateway.tlsAutoGenerate" .) "true") }}
{{- /*
Self-signed CA + leaf for the telemetry endpoint.

The shared neuraltrust-ingress-tls certificate cannot serve this host: it is a
self-signed leaf with no CA, and its SANs only cover the control-plane and
data-plane API hosts. Remote data planes need a CA they can pin, so this mints
its own.

Preserved through lookup rather than reissued every upgrade, because reissuing
would break every egress collector until its trust bundle was refreshed.
Reissued only when the host changes, which is what makes retargeting
global.controlPlane.domain reach the certificate.
*/ -}}
{{- $ns := .Release.Namespace }}
{{- $name := include "clickstack-ingest-gateway.tlsSecretName" . }}
{{- $host := include "clickstack-ingest-gateway.host" . }}
{{- $days := int (default 3650 .Values.ingress.tls.durationDays) }}
{{- $altNames := list $host }}
{{- $sans := $altNames | join "," | sha256sum | trunc 16 }}
{{- $crt := "" }}
{{- $key := "" }}
{{- $ca := "" }}
{{- $existing := lookup "v1" "Secret" $ns $name }}
{{- if $existing }}
{{- $annotations := default dict (default dict $existing.metadata).annotations }}
{{- if eq (default "" (index $annotations "neuraltrust.ai/tls-sans")) $sans }}
{{- $data := default dict $existing.data }}
{{- if hasKey $data "tls.crt" }}{{- $crt = index $data "tls.crt" }}{{- end }}
{{- if hasKey $data "tls.key" }}{{- $key = index $data "tls.key" }}{{- end }}
{{- if hasKey $data "ca.crt" }}{{- $ca = index $data "ca.crt" }}{{- end }}
{{- end }}
{{- end }}
{{- if not (and $crt $key $ca) }}
{{- $caCert := genCA (printf "%s-ca" (include "clickstack-ingest-gateway.fullname" .)) $days }}
{{- $cert := genSignedCert $host nil $altNames $days $caCert }}
{{- $crt = $cert.Cert | b64enc }}
{{- $key = $cert.Key | b64enc }}
{{- $ca = $caCert.Cert | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "clickstack-ingest-gateway.labels" . | nindent 4 }}
    {{- /* Collected by scripts/export-controlplane-ca.sh. */}}
    app.kubernetes.io/component: telemetry-ingress-tls
  annotations:
    helm.sh/resource-policy: keep
    neuraltrust.ai/tls-sans: {{ $sans | quote }}
    neuraltrust.ai/telemetry-host: {{ $host | quote }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $crt | quote }}
  tls.key: {{ $key | quote }}
  ca.crt: {{ $ca | quote }}
{{- end }}
