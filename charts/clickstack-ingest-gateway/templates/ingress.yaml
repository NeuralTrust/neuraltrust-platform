{{- if and (eq (include "clickstack-ingest-gateway.deploy" .) "true") .Values.ingress.enabled }}
{{- $host := include "clickstack-ingest-gateway.host" . }}
{{- /* A plain L7 Ingress rather than a Gateway API HTTPRoute: data planes send
       OTLP/HTTP, which any ingress controller can terminate and forward, and
       every cloud ships one. The gRPC receiver stays cluster-internal — routing
       it would need per-controller backend-protocol annotations. */}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "clickstack-ingest-gateway.fullname" . }}
  labels:
    {{- include "clickstack-ingest-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingest-gateway
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      {{- with include "clickstack-ingest-gateway.tlsSecretName" . }}
      secretName: {{ . | quote }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "clickstack-ingest-gateway.fullname" . }}
                port:
                  name: otlp-http
{{- end }}
