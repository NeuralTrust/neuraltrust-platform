{{- /* What the in-cluster secrets generator creates for the ClickStack ingest
       gateway (templates/_secrets_generator.tpl in the umbrella chart): the
       telemetry certificate, with the name and issuer ingress-tls-secret.yaml
       gives it. Remote egress collectors trust its CA out of band, so it is
       reissued only when the host changes. */ -}}
{{- if and (eq (include "clickstack-ingest-gateway.deploy" .) "true") .Values.ingress.enabled (eq (include "clickstack-ingest-gateway.tlsGenerated" .) "true") }}
{{- $host := include "clickstack-ingest-gateway.host" . }}
{{- $entry := dict "type" "tls" "secret" (include "clickstack-ingest-gateway.tlsSecretName" .) "cn" $host
      "caCn" (printf "%s-ca" (include "clickstack-ingest-gateway.fullname" .))
      "sans" (list $host) "days" (int (default 3650 .Values.ingress.tls.durationDays)) "reissue" true
      "adopt" (list (list (include "clickstack-ingest-gateway.tlsSecretName" .))) }}
{{- include "neuraltrust-platform.secretsGenerator.specObjects" (dict "ctx" . "component" "clickstack-ingest-gateway" "entries" (list $entry) "pins" dict) }}
{{- end }}
