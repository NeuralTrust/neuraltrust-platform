{{- if eq (include "clickstack-ingest-gateway.deploy" .) "true" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clickstack-ingest-gateway.fullname" . }}
  labels:
    {{- include "clickstack-ingest-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingest-gateway
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - name: otlp-grpc
      port: {{ .Values.ports.otlpGrpc }}
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: {{ .Values.ports.otlpHttp }}
      targetPort: otlp-http
      protocol: TCP
  selector:
    {{- include "clickstack-ingest-gateway.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ingest-gateway
{{- end }}
