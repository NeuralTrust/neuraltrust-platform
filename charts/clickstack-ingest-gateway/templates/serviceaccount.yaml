{{- if and (eq (include "clickstack-ingest-gateway.deploy" .) "true") .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "clickstack-ingest-gateway.serviceAccountName" . }}
  labels:
    {{- include "clickstack-ingest-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingest-gateway
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
