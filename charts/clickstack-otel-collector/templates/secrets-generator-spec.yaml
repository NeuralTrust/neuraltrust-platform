{{- /* What the in-cluster secrets generator creates for the ClickStack collector
       (templates/_secrets_generator.tpl in the umbrella chart). The header is
       derived from the token on every run, so the two never disagree. */ -}}
{{- if eq (include "neuraltrust-platform.isExternal" .) "true" }}
{{- $entries := list
  (dict "key" "OTLP_AUTH_TOKEN" "type" "alnum" "length" 48 "adopt" (list (list (printf "%s-secrets" (include "clickstack-otel-collector.fullname" .)) "OTLP_AUTH_TOKEN")))
  (dict "key" "OTEL_EXPORTER_OTLP_HEADERS" "type" "derived" "source" "OTLP_AUTH_TOKEN" "format" "authorization=%s") }}
{{- $pins := dict }}
{{- if .Values.otlpAuthToken }}{{- $_ := set $pins "OTLP_AUTH_TOKEN" .Values.otlpAuthToken }}{{- end }}
{{- include "neuraltrust-platform.secretsGenerator.specObjects" (dict "ctx" . "component" "clickstack-collector" "entries" $entries "pins" $pins) }}
{{- end }}
