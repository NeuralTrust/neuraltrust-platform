{{- if eq (include "neuraltrust-platform.isExternal" .) "true" }}
{{- if and (include "neuraltrust-platform.autoGenerateSecrets" .) (not .Values.global.preserveExistingSecrets) }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" (include "clickstack-otel-collector.fullname" .))) }}
{{- if and (or .Release.IsInstall $existing .Values.otlpAuthToken) (ne (include "neuraltrust-platform.secretsGenerator.active" .) "true") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clickstack-otel-collector.fullname" . }}-secrets
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "clickstack-otel-collector.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /* CLICKHOUSE_ENDPOINT and CLICKHOUSE_USER are configuration, set on the
         Deployment; CLICKHOUSE_PASSWORD comes from the shared ClickHouse Secret.
         Only the receiver token lives here, and under the in-cluster generator
         not even that, so the Secret is not rendered there. */}}
  {{- /* OTLP_AUTH_TOKEN authenticates the collector's receivers. The same value
         is also emitted as OTEL_EXPORTER_OTLP_HEADERS so in-cluster senders
         (TrustGuard / AgentGateway) can secretKeyRef a ready-to-use header
         without duplicating the token into per-service Secrets. */}}
  {{- if ne (include "neuraltrust-platform.secretsGenerator.active" .) "true" }}
  {{- $otlpToken := include "neuraltrust-platform.resolveSecret" (dict "value" .Values.otlpAuthToken "existingSecret" $existing "secretKey" "OTLP_AUTH_TOKEN" "length" 48) }}
  OTLP_AUTH_TOKEN: {{ $otlpToken | quote }}
  OTEL_EXPORTER_OTLP_HEADERS: {{ printf "authorization=%s" $otlpToken | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
