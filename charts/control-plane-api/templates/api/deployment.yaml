{{- /* platform-v2: legacy component disabled in v2 hybrid; re-enabled in v2 external */ -}}
{{- if eq (include "control-plane-api.enabled" .) "true" }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane-api
  labels:
    app: control-plane-api
    plane: control
{{- $controlPlane := default dict .Values.controlPlane }}
{{- $components := default dict $controlPlane.components }}
{{- $api := default dict $components.api }}
{{- $autoscaling := default dict $api.autoscaling }}
spec:
  {{- if not $autoscaling.enabled }}
  replicas: {{ default 2 $api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: control-plane-api
  template:
    metadata:
      labels:
        app: control-plane-api
        plane: control
      {{- /* AUT-403: otel ConfigMap is the only chart-owned envFrom source.
             extraEnvFrom may point at operator Secrets — those are not checksummed. */}}
      {{- if include "control-plane.otelEndpoint" (dict "component" "api" "context" .) }}
      annotations:
        {{- include "neuraltrust-platform.checksumAnnotations" (dict "context" . "files" (list "/api/otel-configmap.yaml")) | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "control-plane.serviceAccountName" . }}
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: control-plane-api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: control-plane-api
      {{- $imagePullSecret := "gcr-secret" }}
      {{- if .Values.imagePullSecrets }}
        {{- $imagePullSecret = .Values.imagePullSecrets }}
      {{- else if and .Values.controlPlane (hasKey .Values.controlPlane "imagePullSecrets") }}
        {{- /* Assign unconditionally so "none"/"" opt out (the guard below suppresses them). */}}
        {{- $imagePullSecret = .Values.controlPlane.imagePullSecrets }}
      {{- end }}
      {{- if and $imagePullSecret (ne $imagePullSecret "none") (ne $imagePullSecret "") }}
      imagePullSecrets:
        - name: {{ $imagePullSecret }}
      {{- end }}
      {{- $pgSecretName := "postgresql-secrets" }}
      {{- if .Values.controlPlane }}
        {{- if .Values.controlPlane.components }}
          {{- if .Values.controlPlane.components.postgresql }}
            {{- if .Values.controlPlane.components.postgresql.secrets }}
              {{- if .Values.controlPlane.components.postgresql.secrets.name }}
                {{- $pgSecretName = .Values.controlPlane.components.postgresql.secrets.name }}
              {{- end }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- if or (include "neuraltrust-platform.customCaCert.enabled" .) (and .Values.controlPlane .Values.controlPlane.components .Values.controlPlane.components.api .Values.controlPlane.components.api.extraVolumes) }}
      volumes:
      {{- include "neuraltrust-platform.customCaCert.volume" . | nindent 6 }}
      {{- with .Values.controlPlane.components.api.extraVolumes }}
      {{- include "neuraltrust-platform.extraVolumes" (dict "items" .) | nindent 6 }}
      {{- end }}
      {{- end }}
      {{- if include "control-plane.postgresql.deploy" . }}
      initContainers:
      - name: wait-for-postgresql
        {{- $pgWaitImageRepo := "europe-west1-docker.pkg.dev/neuraltrust-app-prod/nt-docker/postgres" }}
        {{- $pgWaitImageTag := "17-alpine" }}
        {{- $pgWaitPullPolicy := "IfNotPresent" }}
        {{- if and .Values.controlPlane .Values.controlPlane.components .Values.controlPlane.components.postgresql .Values.controlPlane.components.postgresql.image }}
          {{- if .Values.controlPlane.components.postgresql.image.repository }}{{- $pgWaitImageRepo = .Values.controlPlane.components.postgresql.image.repository }}{{- end }}
          {{- if .Values.controlPlane.components.postgresql.image.tag }}{{- $pgWaitImageTag = .Values.controlPlane.components.postgresql.image.tag }}{{- end }}
          {{- if .Values.controlPlane.components.postgresql.image.pullPolicy }}{{- $pgWaitPullPolicy = .Values.controlPlane.components.postgresql.image.pullPolicy }}{{- end }}
        {{- end }}
        image: {{ include "control-plane.image" (dict "repository" $pgWaitImageRepo "tag" $pgWaitImageTag "global" .Values.global) | quote }}
        imagePullPolicy: {{ $pgWaitPullPolicy }}
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Waiting for PostgreSQL to be ready..."
          echo "POSTGRES_HOST: $POSTGRES_HOST"
          echo "POSTGRES_PORT: $POSTGRES_PORT"
          
          # Wait for PostgreSQL to be accessible and ready
          MAX_ATTEMPTS=120
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            if nc -z -w 2 "$POSTGRES_HOST" "$POSTGRES_PORT" 2>/dev/null; then
              # Check if PostgreSQL is ready to accept connections
              if pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -t 2 >/dev/null 2>&1; then
                echo "✓ PostgreSQL is ready and accepting connections!"
                exit 0
              fi
            fi
            ATTEMPT=$((ATTEMPT + 1))
            if [ $((ATTEMPT % 10)) -eq 0 ]; then
              echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Waiting for PostgreSQL..."
            fi
            sleep 2
          done
          
          echo "ERROR: PostgreSQL did not become ready within $((MAX_ATTEMPTS * 2)) seconds."
          exit 1
        env:
        - name: POSTGRES_HOST
          valueFrom:
            secretKeyRef:
              name: {{ $pgSecretName }}
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            secretKeyRef:
              name: {{ $pgSecretName }}
              key: POSTGRES_PORT
        {{- include "neuraltrust-platform.customCaCert.env" (dict "runtime" "go" "ctx" .) | nindent 8 }}
        {{- if include "neuraltrust-platform.customCaCert.enabled" . }}
        volumeMounts:
        {{- include "neuraltrust-platform.customCaCert.volumeMount" . | nindent 8 }}
        {{- end }}
        resources:
          {{- if and .Values.controlPlane .Values.controlPlane.components .Values.controlPlane.components.api .Values.controlPlane.components.api.initContainerResources }}
          {{- toYaml .Values.controlPlane.components.api.initContainerResources | nindent 10 }}
          {{- else }}
          requests:
            cpu: 250m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
          {{- end }}
      {{- end }}
      containers:
      - name: control-plane-api
        {{- $apiImageRepo := "europe-west1-docker.pkg.dev/neuraltrust-app-prod/nt-docker/control-plane-api" }}
        {{- $apiImageTag := "v1.23.2" }}
        {{- $apiPullPolicy := "IfNotPresent" }}
        {{- if and .Values.controlPlane .Values.controlPlane.components .Values.controlPlane.components.api .Values.controlPlane.components.api.image }}
          {{- if .Values.controlPlane.components.api.image.repository }}{{- $apiImageRepo = .Values.controlPlane.components.api.image.repository }}{{- end }}
          {{- if .Values.controlPlane.components.api.image.tag }}{{- $apiImageTag = .Values.controlPlane.components.api.image.tag }}{{- end }}
          {{- if .Values.controlPlane.components.api.image.pullPolicy }}{{- $apiPullPolicy = .Values.controlPlane.components.api.image.pullPolicy }}{{- end }}
        {{- end }}
        image: {{ include "control-plane.image" (dict "repository" $apiImageRepo "tag" $apiImageTag "global" .Values.global) | quote }}
        imagePullPolicy: {{ $apiPullPolicy }}
        resources:
          {{- if and .Values.controlPlane .Values.controlPlane.components .Values.controlPlane.components.api .Values.controlPlane.components.api.resources }}
          {{- toYaml .Values.controlPlane.components.api.resources | nindent 10 }}
          {{- else }}
          requests:
            memory: 512Mi
            cpu: 250m
          limits:
            memory: 1Gi
            cpu: 500m
          {{- end }}
        ports:
        - containerPort: 8000
        {{- $apiExtraEnvFrom := list }}
        {{- if and .Values.controlPlane .Values.controlPlane.components .Values.controlPlane.components.api .Values.controlPlane.components.api.extraEnvFrom }}
          {{- $apiExtraEnvFrom = .Values.controlPlane.components.api.extraEnvFrom }}
        {{- end }}
        {{- include "control-plane.envFrom" (dict "component" "api" "extraEnvFrom" $apiExtraEnvFrom "context" .) | nindent 8 }}
        env:
        {{- /* Use internal Kubernetes service URLs for inter-service communication */}}
        {{- $defaultDataPlaneUrl := "" }}
        {{- $controlPlaneApiUrl := "" }}
        {{- $dataPlaneApiUrl := "" }}
        {{- if and .Values.controlPlane .Values.controlPlane.components .Values.controlPlane.components.api .Values.controlPlane.components.api.config }}
          {{- if .Values.controlPlane.components.api.config.dataPlaneApiUrl }}
            {{- $defaultDataPlaneUrl = .Values.controlPlane.components.api.config.dataPlaneApiUrl }}
            {{- $dataPlaneApiUrl = .Values.controlPlane.components.api.config.dataPlaneApiUrl }}
          {{- end }}
          {{- if .Values.controlPlane.components.api.config.controlPlaneApiUrl }}
            {{- $controlPlaneApiUrl = .Values.controlPlane.components.api.config.controlPlaneApiUrl }}
          {{- end }}
        {{- end }}
        {{- /* Default to internal service URLs if not explicitly set */}}
        {{- if not $defaultDataPlaneUrl }}
          {{- $defaultDataPlaneUrl = "http://data-plane-api-service:80" }}
        {{- end }}
        {{- if not $controlPlaneApiUrl }}
          {{- $controlPlaneApiUrl = "http://control-plane-api-service:80" }}
        {{- end }}
        {{- if not $dataPlaneApiUrl }}
          {{- $dataPlaneApiUrl = "http://data-plane-api-service:80" }}
        {{- end }}
        - name: DEFAULT_DATA_PLANE_URL
          value: {{ $defaultDataPlaneUrl | quote }}
        - name: CONTROL_PLANE_API_URL
          value: {{ $controlPlaneApiUrl | quote }}
        - name: DATA_PLANE_API_URL
          value: {{ $dataPlaneApiUrl | quote }}
        - name: POSTGRES_HOST
          valueFrom:
            secretKeyRef:
              name: {{ $pgSecretName }}
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            secretKeyRef:
              name: {{ $pgSecretName }}
              key: POSTGRES_PORT
        - name: POSTGRES_DATABASE
          valueFrom:
            secretKeyRef:
              name: {{ $pgSecretName }}
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: {{ $pgSecretName }}
              key: POSTGRES_USER
        {{- include "neuraltrust-platform.postgresql.passwordEnv" (dict "ctx" . "secret" $pgSecretName) | nindent 8 }}
        {{- /* Python API mints RDS IAM tokens when POSTGRES_CONNECTION_TYPE=aurora
               (see control-plane-api/src/database.py). Optional secret keys so
               pre-provisioned secrets without them keep working. */}}
        - name: POSTGRES_CONNECTION_TYPE
          valueFrom:
            secretKeyRef:
              name: {{ $pgSecretName }}
              key: POSTGRES_CONNECTION_TYPE
              optional: true
        {{- if eq (include "control-plane.postgresql.iam" .) "true" }}
        {{- $awsRegion := include "control-plane.postgresql.awsRegion" . }}
        {{- if $awsRegion }}
        - name: AWS_REGION
          value: {{ $awsRegion | quote }}
        {{- end }}
        {{- end }}
        {{- $postgresSslMode := "require" }}
        {{- if include "control-plane.postgresql.deploy" . }}
          {{- $postgresSslMode = "disable" }}
        {{- end }}
        - name: POSTGRES_SSL
          value: {{ $postgresSslMode | quote }}
        - name: CONTROL_PLANE_JWT_SECRET
          valueFrom:
            secretKeyRef:
              {{- include "neuraltrust-platform.secretRef" (dict "ctx" . "logical" "CONTROL_PLANE_JWT_SECRET") | nindent 14 }}
        - name: DEFAULT_DATA_PLANE_JWT_SECRET
          valueFrom:
            secretKeyRef:
              {{- include "neuraltrust-platform.secretRef" (dict "ctx" . "logical" "DATA_PLANE_JWT_SECRET") | nindent 14 }}
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              {{- $openaiSecret := (lookup "v1" "Secret" .Release.Namespace "openai-secrets") }}
              {{- if and .Values.controlPlane .Values.controlPlane.secrets .Values.controlPlane.secrets.openaiApiKey (kindIs "map" .Values.controlPlane.secrets.openaiApiKey) }}
              name: {{ .Values.controlPlane.secrets.openaiApiKey.secretName }}
              key: {{ .Values.controlPlane.secrets.openaiApiKey.secretKey }}
              {{- else if $openaiSecret }}
              name: openai-secrets
              key: OPENAI_API_KEY
              {{- else }}
              name: control-plane-secrets
              key: OPENAI_API_KEY
              optional: true
              {{- end }}
        {{- if and .Values.controlPlane .Values.controlPlane.components .Values.controlPlane.components.api .Values.controlPlane.components.api.extraEnv }}
        {{- toYaml .Values.controlPlane.components.api.extraEnv | nindent 8 }}
        {{- end }}
        {{- include "neuraltrust-platform.proxy-env" . | nindent 8 }}
        {{- include "neuraltrust-platform.customCaCert.env" (dict "runtime" "node" "ctx" .) | nindent 8 }}
        {{- include "neuraltrust-platform.appVersionEnv" (dict "tag" $apiImageTag) | nindent 8 }}
        {{- if or (include "neuraltrust-platform.customCaCert.enabled" .) (and .Values.controlPlane .Values.controlPlane.components .Values.controlPlane.components.api .Values.controlPlane.components.api.extraVolumeMounts) }}
        volumeMounts:
        {{- include "neuraltrust-platform.customCaCert.volumeMount" . | nindent 8 }}
        {{- with .Values.controlPlane.components.api.extraVolumeMounts }}
        {{- include "neuraltrust-platform.extraVolumeMounts" (dict "items" .) | nindent 8 }}
        {{- end }}
        {{- end }}
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
            httpHeaders:
            - name: Accept
              value: application/json
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            httpHeaders:
            - name: Accept
              value: application/json
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8000
            httpHeaders:
            - name: Accept
              value: application/json
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 30
      {{- include "neuraltrust-platform.nodeSelector" (dict "ctx" .) | nindent 6 }}
      {{- include "neuraltrust-platform.tolerations" (dict "ctx" .) | nindent 6 }}
{{- end }}
