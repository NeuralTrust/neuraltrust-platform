{{- /* platform-v2: legacy component disabled in v2 hybrid; re-enabled in v2 external */ -}}
{{- if eq (include "control-plane-api.enabled" .) "true" }}

{{- $gkeBackendConfigName := include "neuraltrust-platform.service.gkeBackendConfigName" (dict "global" .Values.global "localName" "control-plane-api-backendconfig") }}
{{- $gcp := default dict (default dict .Values.global.ingress).gcp }}
{{- if and .Values.controlPlane.components .Values.controlPlane.components.api .Values.controlPlane.components.api.ingress .Values.controlPlane.components.api.ingress.enabled $gkeBackendConfigName (not $gcp.backendConfig) }}
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ $gkeBackendConfigName }}
spec:
  healthCheck:
    type: HTTP
    requestPath: /health
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: "control-plane-api-service"
  labels:
    app: control-plane-api
  {{- $negAnnotations := include "neuraltrust-platform.service.negAnnotations" (dict "global" .Values.global "backendConfigName" "control-plane-api-backendconfig" "pscServiceKey" "control-plane-api") }}
  {{- if $negAnnotations }}
  annotations:
    {{- $negAnnotations | nindent 4 }}
  {{- end }}
spec:
  {{- $serviceType := "ClusterIP" }}
  {{- if .Values.controlPlane }}
    {{- if .Values.controlPlane.components }}
      {{- if .Values.controlPlane.components.api }}
        {{- if .Values.controlPlane.components.api.service }}
          {{- if .Values.controlPlane.components.api.service.type }}
            {{- $serviceType = .Values.controlPlane.components.api.service.type }}
          {{- end }}
        {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
  type: {{ $serviceType }}
  ports:
    - port: 80
      targetPort: 8000
      name: http
  selector:
    app: control-plane-api
{{- if and .Values.controlPlane .Values.controlPlane.components .Values.controlPlane.components.api .Values.controlPlane.components.api.ingress .Values.controlPlane.components.api.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "control-plane-api-ingress"
  {{- with .Values.controlPlane.components.api }}
  {{- $resolvedHost := include "neuraltrust-platform.ingress.host" (dict "host" .host "prefix" .hostPrefix "global" $.Values.global) }}
  {{- $annotations := include "neuraltrust-platform.ingress.annotations" (dict "global" $.Values.global "local" .ingress.annotations) }}
  {{- if $annotations }}
  annotations:
    {{- $annotations | nindent 4 }}
  {{- end }}
spec:
  {{- $className := include "neuraltrust-platform.ingress.className" (dict "global" $.Values.global "local" .ingress.className) }}
  {{- if $className }}
  ingressClassName: {{ $className }}
  {{- end }}
  {{- if and .ingress.tls.enabled (include "neuraltrust-platform.ingress.renderTLS" (dict "global" $.Values.global "tlsEnabled" .ingress.tls.enabled)) }}
  tls:
    - {{- if $resolvedHost }}
      hosts:
        - {{ $resolvedHost | quote }}
      {{- end }}
      secretName: {{ include "neuraltrust-platform.ingress.effectiveTLSSecretName" (dict "global" $.Values.global "localSecretName" .ingress.tls.secretName) }}
  {{- end }}
  rules:
    - {{- if $resolvedHost }}
      host: {{ $resolvedHost | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: "control-plane-api-service"
                port:
                  name: http
  {{- end }}
{{- end }}
{{- $useRoutes := false }}
{{- if include "neuraltrust-platform.isOpenshift" . }}
  {{- $ingressEnabled := false }}
  {{- if and .Values.controlPlane .Values.controlPlane.components .Values.controlPlane.components.api .Values.controlPlane.components.api.ingress (hasKey .Values.controlPlane.components.api.ingress "enabled") }}
    {{- if .Values.controlPlane.components.api.ingress.enabled }}
      {{- $ingressEnabled = true }}
    {{- end }}
  {{- end }}
  {{- if not $ingressEnabled }}
    {{- $useRoutes = true }}
  {{- end }}
{{- end }}
{{- if $useRoutes }}
  {{- $host := "" }}
  {{- $domain := include "neuraltrust-platform.domain" . }}
  {{- if $domain }}
    {{- $host = printf "control-plane-api.%s" $domain }}
  {{- else if and .Values.controlPlane .Values.controlPlane.components .Values.controlPlane.components.api .Values.controlPlane.components.api.host }}
    {{- $host = .Values.controlPlane.components.api.host }}
  {{- else }}
    {{- /* No domain/host configured: fall back to the in-cluster service name (no vendor domain). Set global.domain or api.host for a public route. */}}
    {{- $host = "control-plane-api" }}
  {{- end }}
  {{- $tlsConfig := dict }}
  {{- if and .Values.controlPlane .Values.controlPlane.components .Values.controlPlane.components.api .Values.controlPlane.components.api.ingress .Values.controlPlane.components.api.ingress.tls }}
    {{- $tlsConfig = .Values.controlPlane.components.api.ingress.tls }}
  {{- end }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: "control-plane-api-route"
spec:
  host: {{ $host | quote }}
  tls:
    {{- include "neuraltrust-platform.route.tls" (dict "tls" $tlsConfig) | nindent 4 }}
  to:
    kind: Service
    name: "control-plane-api-service"
    weight: 100
  port:
    targetPort: http
  path: "/"
{{- end }}
{{- end }}
