{{- if eq (include "neuraltrust-platform.dataPlaneApiV2.enabled" .) "true" }}
{{- $gkeBackendConfigName := include "neuraltrust-platform.service.gkeBackendConfigName" (dict "global" .Values.global "localName" "data-plane-api-backendconfig") }}
{{- $gcp := default dict (default dict .Values.global.ingress).gcp }}
{{- if and $gkeBackendConfigName (not $gcp.backendConfig) }}
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ $gkeBackendConfigName }}
spec:
  healthCheck:
    type: HTTP
    requestPath: /health
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: "data-plane-api-service"
  labels:
    app: api
  {{- $negAnnotations := include "neuraltrust-platform.service.negAnnotations" (dict "global" .Values.global "backendConfigName" "data-plane-api-backendconfig" "pscServiceKey" "data-plane-api") }}
  {{- if $negAnnotations }}
  annotations:
    {{- $negAnnotations | nindent 4 }}
  {{- end }}
spec:
  type: {{ if and .Values.dataPlane .Values.dataPlane.components .Values.dataPlane.components.api .Values.dataPlane.components.api.service }}{{ .Values.dataPlane.components.api.service.type | default "LoadBalancer" }}{{ else }}LoadBalancer{{ end }}
  ports:
    - port: 80
      targetPort: 8000
      name: http
  selector:
    app: api
{{- if and .Values.dataPlane .Values.dataPlane.components .Values.dataPlane.components.api .Values.dataPlane.components.api.ingress .Values.dataPlane.components.api.ingress.enabled }}
  {{- $apiIngress := .Values.dataPlane.components.api.ingress }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  # Name kept distinct to force GKE to create a new BackendService/NEG attachments (avoids stale zone 404s)
  name: "data-plane-api"
  {{- $annotations := include "neuraltrust-platform.ingress.annotations" (dict "global" .Values.global "local" $apiIngress.annotations) }}
  {{- if $annotations }}
  annotations:
    {{- $annotations | nindent 4 }}
  {{- end }}
spec:
  {{- $className := include "neuraltrust-platform.ingress.className" (dict "global" .Values.global "local" $apiIngress.className) }}
  {{- if $className }}
  ingressClassName: {{ $className }}
  {{- end }}
  {{- $tlsEnabled := and $apiIngress.tls $apiIngress.tls.enabled }}
  {{- $apiHost := "" }}
  {{- if and .Values.dataPlane .Values.dataPlane.components .Values.dataPlane.components.api }}
    {{- $apiHost = include "neuraltrust-platform.ingress.host" (dict "host" .Values.dataPlane.components.api.host "prefix" .Values.dataPlane.components.api.hostPrefix "global" .Values.global) }}
  {{- end }}
  {{- if and $tlsEnabled (include "neuraltrust-platform.ingress.renderTLS" (dict "global" .Values.global "tlsEnabled" $tlsEnabled)) }}
  tls:
    - {{- if $apiHost }}
      hosts:
        - "{{ $apiHost }}"
      {{- end }}
      secretName: {{ include "neuraltrust-platform.ingress.effectiveTLSSecretName" (dict "global" .Values.global "localSecretName" $apiIngress.tls.secretName) }}
  {{- end }}
  rules:
    - {{- if $apiHost }}
      host: {{ $apiHost | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: "data-plane-api-service"
                port:
                  name: http
{{- end }}
{{- $useRoutes := false }}
{{- if include "neuraltrust-platform.isOpenshift" . }}
  {{- $ingressEnabled := false }}
  {{- if and .Values.dataPlane .Values.dataPlane.components .Values.dataPlane.components.api .Values.dataPlane.components.api.ingress (hasKey .Values.dataPlane.components.api.ingress "enabled") }}
    {{- if .Values.dataPlane.components.api.ingress.enabled }}
      {{- $ingressEnabled = true }}
    {{- end }}
  {{- end }}
  {{- if not $ingressEnabled }}
    {{- $useRoutes = true }}
  {{- end }}
{{- end }}
{{- if $useRoutes }}
  {{- $host := "" }}
  {{- $domain := include "neuraltrust-platform.domain" . }}
  {{- if $domain }}
    {{- $host = printf "data-plane-api.%s" $domain }}
  {{- else if and .Values.dataPlane .Values.dataPlane.components .Values.dataPlane.components.api .Values.dataPlane.components.api.host }}
    {{- $host = .Values.dataPlane.components.api.host }}
  {{- else }}
    {{- /* No domain/host configured: fall back to the in-cluster service name (no vendor domain). Set global.domain or api.host for a public route. */}}
    {{- $host = "data-plane-api" }}
  {{- end }}
  {{- $tlsConfig := dict }}
  {{- if and .Values.dataPlane .Values.dataPlane.components .Values.dataPlane.components.api .Values.dataPlane.components.api.ingress .Values.dataPlane.components.api.ingress.tls }}
    {{- $tlsConfig = .Values.dataPlane.components.api.ingress.tls }}
  {{- end }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: "data-plane-api-route"
spec:
  host: {{ $host | quote }}
  tls:
    {{- include "neuraltrust-platform.route.tls" (dict "tls" $tlsConfig) | nindent 4 }}
  to:
    kind: Service
    name: "data-plane-api-service"
    weight: 100
  port:
    targetPort: http
  path: "/"
{{- end }}
{{- end }}
