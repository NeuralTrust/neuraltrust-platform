{{- /*
  Optional HorizontalPodAutoscaler for the data-plane api.
  Defaults OFF — enable with:

    dataPlane.components.api.autoscaling.enabled: true
*/ -}}
{{- if and .Values.dataPlane .Values.dataPlane.enabled }}
{{- $dp := .Values.dataPlane }}
{{- $apiEnabled := eq (include "neuraltrust-platform.dataPlaneApiV2.enabled" .) "true" }}
{{- if and $apiEnabled $dp.components $dp.components.api $dp.components.api.enabled }}
{{- $as := default dict $dp.components.api.autoscaling }}
{{- if and $as $as.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: data-plane-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: api
    plane: data
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: data-plane-api
  minReplicas: {{ default 1 $as.minReplicas }}
  maxReplicas: {{ default 10 $as.maxReplicas }}
  metrics:
    {{- if $as.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $as.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if $as.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $as.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
