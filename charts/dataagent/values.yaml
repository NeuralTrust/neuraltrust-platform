# DataAgent library defaults. Umbrella merges these with top-level
# `dataagent:` and per-product `agentgateway.dataagent` / `trustguard.dataagent`.
nameOverride: ""
fullnameOverride: ""
securityHardening: true
image:
  repository: europe-west1-docker.pkg.dev/neuraltrust-app-prod/nt-docker/dataagent
  tag: "v0.5.0"
  pullPolicy: IfNotPresent
imagePullSecrets: "gcr-secret"
serviceAccount:
  create: true
  name: ""
  annotations: {}
# Single outbound stream — a second replica would double-register on DataBridge.
replicas: 1
ports:
  health: 8080
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 250m, memory: 128Mi}
nodeSelector: {}
tolerations: []
extraEnv: []
databridge:
  # Empty derives from global.saasRegion:
  #   eu → databridge.neuraltrust.ai:443
  #   us → databridge.us.neuraltrust.ai:443
  # Set both to pin a host the region map does not cover.
  addr: ""
  serverName: ""
  tlsMode: "tls"
store:
  backend: "postgres"
database:
  host: "" # Empty ⇒ global.postgresql.host, else the in-cluster control-plane-postgresql Service
  port: "" # Empty ⇒ global.postgresql.port, else 5432
  name: ""
  user: ""
  password: ""
  sslMode: "" # Empty ⇒ global.postgresql.sslMode (default "prefer"); "require" forces TLS on hosted DBs
databaseUrl: ""
existingSecret:
  name: ""
enrolment:
  token: ""
  existingSecret:
    name: ""
    key: "ENROLMENT_TOKEN"
supervisor:
  backoffMin: "1s"
  backoffMax: "30s"
  keepaliveTime: "10s"
  keepaliveTimeout: "3s"
  maxConcurrentQueries: 8
pdb:
  # Default off: a 1-replica minAvailable:1 PDB blocks every customer node
  # drain with no operator present. DataAgent reconnects on restart.
  enabled: false
  minAvailable: 1
# Set by umbrella when this instance owns clickstack-egress-collector.
egressPrimary: false
product: ""
