{{- if and (eq (include "databridge.deploy" .) "true") .Values.podDisruptionBudget.enabled }}
{{- $replicas := int (.Values.replicas | default 2) }}
{{- $minAvailable := .Values.podDisruptionBudget.minAvailable }}
{{- $maxUnavailable := .Values.podDisruptionBudget.maxUnavailable }}
{{- /* With several replicas, minAvailable: 1 lets a node drain take one pod at a
       time while the survivors keep serving — including for agents whose streams
       they do not hold, because a missed query is forwarded to the pod that does.

       With one replica the same setting makes disruptionsAllowed 0 and deadlocks
       every drain on this node: no replacement can become Ready before the only
       pod is evicted, and the eviction is what the budget refuses. maxUnavailable:
       1 allows it — the agents reconnect, which they are built to do — while still
       declaring the workload to anything that reads a budget. */}}
{{- if and (not $minAvailable) (not $maxUnavailable) }}
  {{- if gt $replicas 1 }}
    {{- $minAvailable = 1 }}
  {{- else }}
    {{- $maxUnavailable = 1 }}
  {{- end }}
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "databridge.fullname" . }}
  labels:
    {{- include "databridge.labels" . | nindent 4 }}
    app.kubernetes.io/component: broker
spec:
  {{- if $minAvailable }}
  minAvailable: {{ $minAvailable }}
  {{- else if $maxUnavailable }}
  maxUnavailable: {{ $maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "databridge.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: broker
{{- end }}
