{{- /* What the in-cluster secrets generator creates for DataBridge
       (templates/_secrets_generator.tpl in the umbrella chart): the southbound
       keypair, with the names and issuer southbound-tls-secret.yaml gives it.
       Agents in other clusters trust its CA out of band, so it is reissued only
       when the names it covers change. */ -}}
{{- if and (eq (include "databridge.deploy" .) "true") (eq (include "databridge.tlsGenerated" .) "true") }}
{{- $host := include "databridge.southboundHost" . }}
{{- $entry := dict "type" "tls" "secret" (include "databridge.tlsSecretName" .) "cn" $host
      "caCn" (printf "%s-southbound-ca" (include "databridge.fullname" .))
      "sans" (include "databridge.tlsAltNames" . | fromJsonArray)
      "days" (int (default 3650 .Values.tls.durationDays)) "reissue" true
      "annotations" (dict "neuraltrust.ai/southbound-host" $host)
      "adopt" (list (list (include "databridge.tlsSecretName" .))) }}
{{- include "neuraltrust-platform.secretsGenerator.specObjects" (dict "ctx" . "component" "databridge" "entries" (list $entry) "pins" dict) }}
{{- end }}
