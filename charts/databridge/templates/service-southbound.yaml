{{- if eq (include "databridge.deploy" .) "true" }}
{{- $sb := .Values.service.southbound }}
{{- /* Public entry point. DataAgents in other clusters dial in over TLS and
       hold a bidirectional gRPC stream open for as long as they run.

       L4 passthrough on every cloud. When annotations are empty, saas AWS
       installs get NLB defaults from global.controlPlane.loadBalancerScheme
       (internal by default). Local annotations always win. */}}
{{- $annos := include "neuraltrust-platform.controlPlane.l4Annotations" (dict "ctx" . "local" $sb.annotations) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "databridge.fullname" . }}-southbound
  labels:
    {{- include "databridge.labels" . | nindent 4 }}
    app.kubernetes.io/component: southbound
  {{- with $annos }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $sb.type | default "LoadBalancer" }}
  {{- with $sb.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  {{- with $sb.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $sb.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . | quote }}
  {{- end }}
  ports:
    - name: grpc
      port: {{ $sb.port | default 443 }}
      targetPort: southbound
      protocol: TCP
  selector:
    {{- include "databridge.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: broker
{{- end }}
