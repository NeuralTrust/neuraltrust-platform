{{- if and (eq (include "databridge.deploy" .) "true") .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "databridge.serviceAccountName" . }}
  labels:
    {{- include "databridge.labels" . | nindent 4 }}
    app.kubernetes.io/component: broker
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
