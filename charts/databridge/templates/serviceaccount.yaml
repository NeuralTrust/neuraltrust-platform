{{- if and (eq (include "databridge.deploy" .) "true") .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "databridge.serviceAccountName" . }}
  labels:
    {{- include "databridge.labels" . | nindent 4 }}
    app.kubernetes.io/component: broker
  {{- $saAnn := include "neuraltrust-platform.serviceAccount.annotationsBlock" (dict "ctx" . "annotations" .Values.serviceAccount.annotations) }}
  {{- with $saAnn }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
