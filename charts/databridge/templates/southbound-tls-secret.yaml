{{- if and (eq (include "databridge.deploy" .) "true") (eq (include "databridge.tlsAutoGenerate" .) "true") }}
{{- /*
Self-signed southbound CA + server keypair.

Off by default. Turning it on does not by itself make the listener trustworthy:
agents in other clusters verify against their own trust store, which will not
contain this CA unless you put it there. Distribute it with
scripts/export-controlplane-ca.sh and point dataagent.databridge.tlsCa at the
mounted bundle. That is the supported shape for a control plane reached over a
private network, where no public trust store is involved and the CA is simply
another piece of configuration the data planes receive.

Preserved through lookup rather than reissued every upgrade, because agents hold
long-lived streams against this listener and a new keypair drops all of them.
Reissued only when the names it has to cover change, which is what makes
retargeting global.controlPlane.domain work.
*/ -}}
{{- $ns := .Release.Namespace }}
{{- $name := include "databridge.tlsSecretName" . }}
{{- $fullname := include "databridge.fullname" . }}
{{- $days := int (default 3650 .Values.tls.durationDays) }}
{{- $host := include "databridge.southboundHost" . }}
{{- $svc := printf "%s-southbound" $fullname }}
{{- $altNames := list $host $svc (printf "%s.%s" $svc $ns) (printf "%s.%s.svc" $svc $ns) (printf "%s.%s.svc.cluster.local" $svc $ns) }}
{{- $sans := $altNames | join "," | sha256sum | trunc 16 }}
{{- $crt := "" }}
{{- $key := "" }}
{{- $ca := "" }}
{{- $existing := lookup "v1" "Secret" $ns $name }}
{{- if $existing }}
{{- $annotations := default dict (default dict $existing.metadata).annotations }}
{{- if eq (default "" (index $annotations "neuraltrust.ai/tls-sans")) $sans }}
{{- $data := default dict $existing.data }}
{{- if hasKey $data "tls.crt" }}{{- $crt = index $data "tls.crt" }}{{- end }}
{{- if hasKey $data "tls.key" }}{{- $key = index $data "tls.key" }}{{- end }}
{{- if hasKey $data "ca.crt" }}{{- $ca = index $data "ca.crt" }}{{- end }}
{{- end }}
{{- end }}
{{- if not (and $crt $key $ca) }}
{{- $caCert := genCA (printf "%s-southbound-ca" $fullname) $days }}
{{- $cert := genSignedCert $host nil $altNames $days $caCert }}
{{- $crt = $cert.Cert | b64enc }}
{{- $key = $cert.Key | b64enc }}
{{- $ca = $caCert.Cert | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "databridge.labels" . | nindent 4 }}
    app.kubernetes.io/component: southbound-tls
  annotations:
    helm.sh/resource-policy: keep
    {{- /* Reissue trigger, and the reason the hostname in the cert follows
           global.controlPlane.domain instead of freezing at first install. */}}
    neuraltrust.ai/tls-sans: {{ $sans | quote }}
    {{- /* Point a remote DataAgent's trust store at this value when you run
           without a publicly trusted certificate. */}}
    neuraltrust.ai/southbound-host: {{ $host | quote }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $crt | quote }}
  tls.key: {{ $key | quote }}
  ca.crt: {{ $ca | quote }}
{{- end }}
