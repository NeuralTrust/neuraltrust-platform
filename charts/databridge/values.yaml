# DataBridge subchart.
# Renders ONLY when global.deploymentMode=saas.
#
# Two gRPC listeners, opposite directions:
#   southbound :50052 — DataAgents in other clusters dial IN over TLS and hold a
#                       long-lived bidirectional stream. Public.
#   northbound :50051 — DataCore calls IN to run a query across those agents.
#                       Cluster-internal only.
# DataBridge itself is stateless: it routes, it does not store.
nameOverride: ""
# Pinned: DataCore addresses the northbound Service by name, and a
# release-prefixed name would silently stop matching.
fullnameOverride: "databridge"
image:
  repository: europe-west1-docker.pkg.dev/neuraltrust-app-prod/nt-docker/databridge
  tag: "v0.4.2"
  pullPolicy: IfNotPresent
imagePullSecrets: "gcr-secret"
serviceAccount:
  create: true
  name: "databridge"
  annotations: {}
# HA by default. A DataAgent's stream lives in one pod's memory; peer forwarding
# lets any replica answer by asking siblings over the headless Service.
# Singleton escape hatch: set replicas: 1 (forces discovery off).
replicas: 2
# Peer forwarding. Effective mode:
#   replicas >= 2 → headless (default); explicit discovery=off fails the render
#   replicas < 2  → off (singleton; peer Service / POD_IP omitted)
peers:
  discovery: "headless"
  # How long a replica waits for a sibling to answer before giving up on it.
  forwardTimeout: "10s"
  # How long the resolved sibling list is reused before DNS is consulted again.
  refreshInterval: "10s"
  # How long "no sibling holds this instance" is remembered, so a genuinely
  # disconnected agent does not make every retry fan out across all replicas.
  negativeTTL: "2s"
  # Pause between failing readiness and closing agent streams at shutdown, so
  # endpoints drop this pod first and agents reconnect to a survivor rather than
  # racing back into a pod that is going away.
  drainDelay: "5s"
auth:
  # How DataBridge authenticates a DataAgent at connect time:
  #   introspect — ask DataCore about each token (default; the only mode that
  #                gets an authoritative tenant/instance identity per agent)
  #   jwt        — verify DataCore-signed enrolment JWTs locally, no round trip
  #   token      — one shared secret for every agent. REJECTED in saas mode:
  #                it trusts the tenant each agent claims for itself.
  #   dev        — no verification. REJECTED in saas mode.
  mode: "introspect"
  # Empty ⇒ derived from the in-cluster DataCore Service. Set only when DataCore
  # runs somewhere this chart does not deploy it.
  datacoreIntrospectionURL: ""
  # Empty ⇒ derived from the introspection URL by swapping the trailing
  # /enrolment/introspect for /telemetry/exchange, which is DataBridge's own
  # default. Set it when the two live behind different hosts.
  datacoreTelemetryExchangeURL: ""
  # DataBridge presents this to DataCore as X-Service-Token, and DataCore
  # compares it against ENROLMENT_INTROSPECTION_TOKEN. The chart keeps the two
  # in sync through the shared platform Secret, so leave this alone unless you
  # own that Secret yourself.
  existingSecret:
    name: "" # Empty ⇒ the shared platform Secret
    key: "" # Empty ⇒ "DATACORE_SERVICE_TOKEN"
# Southbound TLS. Terminated by DataBridge itself: agents dial the L4 load
# balancer directly, so nothing in front of it can terminate on its behalf.
# The certificate must cover databridge.<global.controlPlane.domain>.
tls:
  # A kubernetes.io/tls Secret you created (tls.crt + tls.key). This is the
  # production path: agents in other clusters verify what this listener presents
  # against their own trust store, so the certificate has to come from a CA they
  # already trust.
  existingSecret: ""
  # Happy path: mint a self-signed CA + keypair when existingSecret is empty and
  # cert-manager is off. Export the CA with scripts/export-controlplane-ca.sh
  # (or set global.controlPlane.caSecretName on hybrid planes). BYO:
  # existingSecret or certManager.enabled. Explicit autoGenerate: false without
  # either source fails render.
  autoGenerate: true
  durationDays: 3650
  # Or have cert-manager issue one. Ignored when existingSecret is set.
  certManager:
    enabled: false
    issuerRef:
      name: ""
      kind: "ClusterIssuer"
      group: "cert-manager.io"
    # Empty ⇒ databridge.<global.controlPlane.domain>
    dnsNames: []
service:
  northbound:
    # Cluster-internal: only DataCore calls it.
    type: ClusterIP
    port: 50051
    annotations: {}
  southbound:
    # Public L4 passthrough. Empty annotations ⇒ AWS NLB defaults from
    # global.controlPlane.loadBalancerScheme (internal). Override annotations
    # or scheme when data planes reach you over the public internet.
    type: LoadBalancer
    port: 443
    annotations: {}
    # Pin the LB address when your DNS record already exists.
    loadBalancerIP: ""
    # Narrow the public surface to the egress ranges of your data-plane
    # clusters. Empty means the whole internet can open a TCP connection
    # (authentication still applies).
    loadBalancerSourceRanges: []
    externalTrafficPolicy: ""
ports:
  northbound: 50051
  southbound: 50052
  health: 8080
config:
  logLevel: "info"
  # Leaves 30s of the pod's 120s grace period for kubelet cleanup after the
  # application's own shutdown deadline expires.
  shutdownTimeout: "90s"
  northbound:
    maxInflightPerTenant: 128
    requestTimeout: "30s"
  southbound:
    sendBuffer: 64
    pingInterval: "15s"
    keepaliveTime: "30s"
    keepaliveTimeout: "10s"
    # gRPC closes a connection that pings more often than this. Keep it below
    # the agents' own keepalive interval or they get dropped as abusive.
    keepaliveMinTime: "5s"
# Defaults are derived from `replicas`, so leave both null unless you have a
# reason:
#   replicas: 1  ⇒ maxUnavailable: 1. minAvailable: 1 against a single replica
#     makes disruptionsAllowed 0 and deadlocks every `kubectl drain`: no
#     replacement can become Ready before the only pod is evicted, and the
#     eviction is what the budget refuses. Agents reconnect, which they are built
#     to do, so allowing it is the lesser cost.
#   replicas > 1 ⇒ minAvailable: 1. A drain then evicts one pod at a time and the
#     survivors keep serving, including for agents whose streams they do not hold.
podDisruptionBudget:
  enabled: true
  minAvailable: null
  maxUnavailable: null
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 500m, memory: 256Mi}
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
extraEnv: []
