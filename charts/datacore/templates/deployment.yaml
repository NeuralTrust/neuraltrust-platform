{{- if eq (include "neuraltrust-platform.isExternal" .) "true" }}
{{- $img := include "datacore.image" (dict "repository" .Values.image.repository "tag" .Values.image.tag "global" .Values.global) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "datacore.fullname" . }}
  labels:
    {{- include "datacore.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-plane
spec:
  {{- if not (default dict .Values.autoscaling).enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "datacore.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: data-plane
  template:
    metadata:
      labels:
        {{- include "datacore.labels" . | nindent 8 }}
        app.kubernetes.io/component: data-plane
      annotations:
        {{- /* AUT-403: roll when env ConfigMap / chart-managed Secret changes. */}}
        {{- include "neuraltrust-platform.checksumAnnotations" (dict "context" . "files" (list "/env-configmap.yaml" "/secrets.yaml")) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "datacore.serviceAccountName" . }}
      {{- include "datacore.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.securityHardening }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      volumes:
      - name: tmp
        emptyDir: {}
      {{- include "neuraltrust-platform.customCaCert.volume" . | nindent 6 }}
      {{- /* Wait for ClickHouse rather than CrashLoopBackOff into it on first boot
             (AUT-409). Host/port come from this subchart's own clickhouse block —
             .Values.infrastructure is an umbrella key and invisible here. */}}
      {{- $ch := default dict .Values.clickhouse }}
      {{- with (include "neuraltrust-platform.clickhouse.waitInit" (dict "host" ($ch.host | default "") "port" ($ch.nativePort | default "") "global" .Values.global)) }}
      initContainers:
      {{- . | nindent 6 }}
      {{- end }}
      containers:
      - name: datacore
        image: {{ $img | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        envFrom:
        - configMapRef:
            name: datacore-env-vars
        - secretRef:
            name: datacore-secrets
            optional: true
        env:
        {{- /* Shared credentials come from platform-secrets; an explicit env
               entry outranks the legacy copy still arriving via envFrom. */}}
        {{- $sharedKeys := dict "AUTH_JWT_HS256_SECRET" "AUTH_JWT_HS256_SECRET" }}
        {{- /* saas only. The introspection token authenticates DataBridge's
               callbacks and must equal the DATACORE_SERVICE_TOKEN DataBridge
               presents; the signing secret signs the enrolment JWTs DataBridge
               verifies; the RS256 key signs the OTLP access tokens the ingest
               gateway verifies. DataCore fails closed without the first two in
               hybrid residency, and turns telemetry signing on when it sees the
               third. */}}
        {{- if eq (include "neuraltrust-platform.isSaas" .) "true" }}
        {{- $_ := set $sharedKeys "ENROLMENT_INTROSPECTION_TOKEN" "ENROLMENT_INTROSPECTION_TOKEN" }}
        {{- $_ = set $sharedKeys "ENROLMENT_SIGNING_SECRET" "ENROLMENT_SIGNING_SECRET" }}
        {{- /* Mint path for private/hybrid install tokens. DataCore refuses
               POST /v1/admin/credentials with 501 "not implemented" when this
               is absent (disabledSigner). Issuer/audience default in-binary. */}}
        {{- $_ = set $sharedKeys "CONFIG_SYNC_SIGNING_SECRET" "CONFIG_SYNC_SIGNING_SECRET" }}
        {{- $_ = set $sharedKeys "TELEMETRY_JWT_PRIVATE_KEY_PEM" "TELEMETRY_JWT_PRIVATE_KEY_PEM" }}
        {{- end }}
        {{- include "neuraltrust-platform.platformSecretEnv" (dict "ctx" . "keys" $sharedKeys "skip" .Values.extraEnv) | nindent 8 }}
        {{- if ne (include "neuraltrust-platform.postgres.iamAuth" (dict "ctx" . "database" .Values.database)) "true" }}
        {{- with include "neuraltrust-platform.datastore.credentialEnv" (dict "ref" .Values.database.existingSecret "envName" "POSTGRES_PASSWORD") }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- end }}
        # Shared ClickHouse password (same secret AlertEngine reads). Explicit env
        # wins over the datacore-secrets envFrom above.
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.clickhouse.existingSecret.name | default "clickhouse" | quote }}
              key: {{ .Values.clickhouse.existingSecret.key | default "admin-password" | quote }}
        {{- with .Values.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "neuraltrust-platform.proxy-env" . | nindent 8 }}
        {{- include "neuraltrust-platform.customCaCert.env" (dict "runtime" "go" "ctx" .) | nindent 8 }}
        {{- include "neuraltrust-platform.appVersionEnv" (dict "tag" .Values.image.tag) | nindent 8 }}
        {{- if .Values.securityHardening }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        {{- end }}
        ports:
        - containerPort: {{ .Values.ports.http }}
          name: http
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        {{- include "neuraltrust-platform.customCaCert.volumeMount" . | nindent 8 }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
      {{- include "neuraltrust-platform.nodeSelector" (dict "ctx" . "local" .Values.nodeSelector) | nindent 6 }}
      {{- include "neuraltrust-platform.tolerations" (dict "ctx" . "local" .Values.tolerations) | nindent 6 }}
{{- end }}
