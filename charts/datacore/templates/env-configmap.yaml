{{- if eq (include "neuraltrust-platform.isExternal" .) "true" }}
{{- $isSaas := eq (include "neuraltrust-platform.isSaas" .) "true" }}
{{- /* DataCore's "hybrid" is the mode that reaches data planes through
       DataBridge, which is exactly what deploymentMode=saas needs. The word
       collision is unfortunate; the mapping is deliberate. */}}
{{- $residency := .Values.config.residencyBackend | default (ternary "hybrid" "saas" $isSaas) }}
{{- /* An overlay that resets one of these blocks writes `null` rather than
       removing the key, and a bare dereference then aborts the render. */}}
{{- $bridge := default dict .Values.databridge }}
{{- $enrolment := default dict .Values.enrolment }}
{{- $enrolmentJwt := default dict $enrolment.jwt }}
{{- $telemetry := default dict .Values.telemetryJwt }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: datacore-env-vars
  labels:
    {{- include "datacore.labels" . | nindent 4 }}
data:
  RESIDENCY_BACKEND: {{ $residency | quote }}
  {{- if eq $residency "hybrid" }}
  {{- /* DataCore refuses to start in this mode without an address. */}}
  DATABRIDGE_ADDR: {{ $bridge.addr | default (include "neuraltrust-platform.databridge.northboundAddr" .) | quote }}
  DATABRIDGE_TLS: {{ $bridge.tls | default false | quote }}
  ENROLMENT_JWT_ISSUER: {{ $enrolmentJwt.issuer | default "datacore" | quote }}
  ENROLMENT_JWT_AUDIENCE: {{ $enrolmentJwt.audience | default "databridge" | quote }}
  {{- with $enrolment.tokenTTL }}
  ENROLMENT_TOKEN_TTL: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- /* Telemetry signing switches on the moment a private key is present, and
         DataCore then hard-requires the issuer URL and audience. The key is
         minted into the shared platform Secret in saas mode only, so these
         travel with it — set one without the others and the pod never starts. */}}
  {{- if $isSaas }}
  {{- $issuerUrl := $telemetry.issuerUrl | default (include "neuraltrust-platform.datacore.internalUrl" .) }}
  TELEMETRY_JWT_KID: {{ $telemetry.kid | default "telemetry-v1" | quote }}
  TELEMETRY_JWT_AUDIENCE: {{ $telemetry.audience | default "otlp-ingest" | quote }}
  {{- /* OIDC identifies an issuer by its URL, and the ingest gateway builds its
         verifier from the issuer URL below: it rejects any token whose iss claim
         is a different string. DataCore's own default for iss is the bare name
         "datacore", which never matches, so the chart pins both to one value. */}}
  TELEMETRY_JWT_ISSUER: {{ $issuerUrl | quote }}
  TELEMETRY_JWT_ISSUER_URL: {{ $issuerUrl | quote }}
  {{- with $telemetry.ttl }}
  TELEMETRY_JWT_TTL: {{ . | quote }}
  {{- end }}
  {{- end }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  HTTP_ADDR: {{ .Values.config.httpAddr | quote }}
  POSTGRES_HOST: {{ include "neuraltrust-platform.postgres.host" (dict "ctx" . "host" .Values.database.host) | quote }}
  POSTGRES_PORT: {{ include "neuraltrust-platform.postgres.port" (dict "ctx" . "port" .Values.database.port) | quote }}
  POSTGRES_DATABASE: {{ .Values.database.name | quote }}
  POSTGRES_USER: {{ .Values.database.user | quote }}
  POSTGRES_SSLMODE: {{ include "neuraltrust-platform.postgres.sslMode" (dict "ctx" . "sslMode" .Values.database.sslMode) | quote }}
  {{- if eq (include "neuraltrust-platform.postgres.iamAuth" (dict "ctx" . "database" .Values.database)) "true" }}
  # IAM (RDS) DB auth: DataCore mints a SigV4 token per connection (POSTGRES_LOGIN=aws).
  # No static POSTGRES_PASSWORD is shipped. Defaults from global.postgresql.authMode
  # when database.iamAuth is unset (AUT-392). AWS_REGION is required by the binary.
  POSTGRES_LOGIN: "aws"
  {{- $dcRegion := .Values.database.awsRegion | default (default dict (default dict .Values.global).postgresql).awsRegion | default "" }}
  {{- if and $dcRegion (ne ($dcRegion | toString) "") }}
  AWS_REGION: {{ $dcRegion | quote }}
  {{- end }}
  {{- end }}
  CLICKHOUSE_ADDR: {{ printf "%s:%v" .Values.clickhouse.host .Values.clickhouse.nativePort | quote }}
  CLICKHOUSE_DATABASE: {{ .Values.clickhouse.database | quote }}
  CLICKHOUSE_OTEL_DATABASE: {{ .Values.clickhouse.otelDatabase | quote }}
  CLICKHOUSE_TLS: {{ .Values.clickhouse.tls | quote }}
  {{- with .Values.jwt.issuer }}
  AUTH_JWT_ISSUER: {{ . | quote }}
  {{- end }}
  {{- with .Values.jwt.audience }}
  AUTH_JWT_AUDIENCE: {{ . | quote }}
  {{- end }}
{{- end }}
