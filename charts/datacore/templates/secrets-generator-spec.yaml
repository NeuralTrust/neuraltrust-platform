{{- /* What the in-cluster secrets generator creates for DataCore
       (templates/_secrets_generator.tpl in the umbrella chart). */ -}}
{{- if eq (include "neuraltrust-platform.isExternal" .) "true" }}
{{- $db := include "neuraltrust-platform.secretsGenerator.dbEntry" (dict "ctx" . "db" .Values.database "key" "DATACORE_DB_PASSWORD" "adopt" (list (list "datacore-secrets" "POSTGRES_PASSWORD"))) | fromYaml }}
{{- $entries := list }}
{{- $pins := dict }}
{{- if $db.entry }}
  {{- $entries = append $entries $db.entry }}
  {{- if $db.pin }}{{- $_ := set $pins "DATACORE_DB_PASSWORD" $db.pin }}{{- end }}
{{- end }}
{{- include "neuraltrust-platform.secretsGenerator.specObjects" (dict "ctx" . "component" "datacore" "entries" $entries "pins" $pins) }}
{{- end }}
