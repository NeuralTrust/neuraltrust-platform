{{- if eq (include "neuraltrust-platform.isExternal" .) "true" }}
{{- if and (include "neuraltrust-platform.autoGenerateSecrets" .) (not .Values.global.preserveExistingSecrets) }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace "datacore-secrets") }}
{{- $hasExplicit := or .Values.database.password .Values.jwtSecret }}
{{- if or .Release.IsInstall $existing $hasExplicit }}
{{- $data := dict }}
{{- if ne (include "neuraltrust-platform.secretsGenerator.active" .) "true" }}
  {{- $_ := set $data "AUTH_JWT_HS256_SECRET" (include "neuraltrust-platform.resolveSecret" (dict "value" .Values.jwtSecret "existingSecret" $existing "secretKey" "AUTH_JWT_HS256_SECRET" "length" 64)) }}
{{- end }}
{{- /* IAM DB auth ships no static password (service mints a token), and an
       operator Secret named under `database.existingSecret` owns it instead —
       then the key is left out here and injected at the Deployment. */}}
{{- if and (ne (include "neuraltrust-platform.postgres.iamAuth" (dict "ctx" . "database" .Values.database)) "true") (not (include "neuraltrust-platform.datastore.credentialIsExternal" (dict "ref" (include "neuraltrust-platform.dbPasswordRef" (dict "ctx" . "db" .Values.database "key" "DATACORE_DB_PASSWORD") | fromYaml)))) }}
  {{- $_ := set $data "POSTGRES_PASSWORD" (include "neuraltrust-platform.resolveSecret" (dict "value" .Values.database.password "existingSecret" $existing "secretKey" "POSTGRES_PASSWORD" "length" 32)) }}
{{- end }}
{{- /* CLICKHOUSE_USER is configuration and CLICKHOUSE_PASSWORD comes from the
       shared ClickHouse Secret: both are set on the Deployment, not stored here.
       With nothing left to hold, the Secret is not rendered. */}}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: datacore-secrets
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "datacore.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k := keys $data | sortAlpha }}
  {{ $k }}: {{ index $data $k | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
