# DataCore subchart.
# Renders ONLY when global.deploymentMode=external.
# Single HTTP API on :8080. Requires ClickHouse (native protocol) for OTel raw
# data and Postgres for deployment metadata. ClickHouse migrations materialize
# DataCore tables from the otel_logs landing table written by
# clickstack-otel-collector; Postgres migrations own deployments / registry /
# enrolment tables. Then serves a tenant-scoped REST API.
nameOverride: ""
fullnameOverride: "datacore"
securityHardening: true
image:
  repository: europe-west1-docker.pkg.dev/neuraltrust-app-prod/nt-docker/datacore
  tag: "v0.18.0"
  pullPolicy: IfNotPresent
imagePullSecrets: "gcr-secret"
serviceAccount:
  create: true
  name: "datacore"
  annotations: {}
replicas: 1
# Optional HPA (disabled by default). Customer scale: min 1 / max 3.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 90
config:
  # Where DataCore reads residency data from. The names are DataCore's own and
  # do NOT line up with global.deploymentMode:
  #   "saas"   → query the local ClickHouse directly. Right for deploymentMode
  #              external, where every data plane is in this cluster.
  #   "hybrid" → fan the query out through DataBridge to data planes elsewhere.
  #              Right for deploymentMode saas.
  # Empty derives the correct one from deploymentMode, which is what you want
  # unless you are doing something deliberately unusual. Set explicitly to
  # override. Postgres is required either way unless RESIDENCY_ALLOW_STUB=true.
  residencyBackend: ""
  logLevel: "info"
  httpAddr: ":8080"
# DataBridge leg — only read when residencyBackend resolves to "hybrid".
# DataCore refuses to start in that mode without an address, so the chart wires
# it from the in-cluster northbound Service.
databridge:
  addr: "" # Empty ⇒ databridge-northbound.<namespace>.svc.cluster.local:50051
  tls: false # In-cluster hop
# Enrolment credentials DataCore issues to data planes, and the introspection
# endpoint DataBridge calls back on. ENROLMENT_INTROSPECTION_TOKEN and
# ENROLMENT_SIGNING_SECRET come from the shared platform Secret; the
# introspection token must equal DataBridge's DATACORE_SERVICE_TOKEN, which the
# chart guarantees by aliasing them to one value.
#
# Config-sync credentials (POST /v1/admin/credentials) are signed with
# CONFIG_SYNC_SIGNING_SECRET from the same Secret. Without it DataCore returns
# 501 "not implemented" and the console cannot finish a private gateway create.
# AgentGateway/TrustGuard admin verify that secret as CONFIG_SYNC_JWT_SECRET.
enrolment:
  jwt:
    issuer: "datacore"
    # DataBridge is the audience: these tokens authenticate an agent to it.
    audience: "databridge"
  tokenTTL: ""
# RS256 OTLP access tokens. DataCore mints them and publishes the JWKS the
# ClickStack ingest gateway validates against. Signing turns itself on as soon
# as a private key is present, which in saas mode the shared platform Secret
# provides — and DataCore then REQUIRES an issuer URL, so the chart always sets
# both together.
telemetryJwt:
  # No pinning needed on the verifier side: the gateway resolves keys through
  # JWKS rather than a fixed kid.
  kid: "telemetry-v1"
  # Must equal clickstack-ingest-gateway.auth.audience. Same default on both
  # sides, and the umbrella refuses to render if they are overridden to differ.
  audience: "otlp-ingest"
  ttl: ""
  # Empty ⇒ the in-cluster DataCore URL, which is where the ingest gateway
  # discovers JWKS. Both sides default to one helper; overriding only one of them
  # is refused at render, since OIDC compares issuer URLs byte for byte.
  issuerUrl: ""
ports:
  http: 8080
# PostgreSQL connection (own "datacore" database + role; DataCore renders in
# v2 external only and does not use the hybrid `global.postgresql` shared
# block). host empty → auto-derives to the in-cluster control-plane-postgresql
# Service. For external Postgres, pre-create the datacore role + database and
# set host/user/name/password below. Env names are POSTGRES_* (DataCore binary
# contract — not DB_*).
database:
  host: "" # Empty ⇒ global.postgresql.host, else the in-cluster control-plane-postgresql Service
  port: "" # Empty ⇒ global.postgresql.port, else 5432
  name: "datacore"
  user: "datacore"
  password: "" # Auto-generated if empty (in-cluster PG); omitted when iamAuth=true
  # Read the password from a Secret you created instead of writing it above. The
  # chart then omits POSTGRES_PASSWORD from datacore-secrets and the pod reads
  # your Secret directly, so no credential reaches values or release history.
  existingSecret:
    name: "" # Empty ⇒ the chart owns the password (inline or generated)
    key: "" # Empty ⇒ "POSTGRES_PASSWORD"
  sslMode: "" # Empty ⇒ global.postgresql.sslMode (default "prefer"); "require" forces TLS on hosted DBs
  # IAM (e.g. AWS RDS/Aurora) database auth. When true, emits POSTGRES_LOGIN=aws
  # and omits POSTGRES_PASSWORD. When unset, inherits global.postgresql.authMode=iam
  # (AUT-392). Explicit true/false wins. Requires IRSA + awsRegion, and
  # POSTGRES_SSLMODE require|verify-ca|verify-full.
  # iamAuth:
  awsRegion: "" # Required when IAM is on → AWS_REGION (falls back to global.postgresql.awsRegion)
# ClickHouse (native protocol, port 9000). Defaults to the in-cluster clickhouse
# subchart; set clickhouse.host/nativePort to your endpoint when
# infrastructure.clickhouse.deploy=false.
clickhouse:
  host: "clickhouse"
  nativePort: 9000
  database: "default" # DataCore tables/MVs (built-in ClickHouse DB; no create needed)
  otelDatabase: "otel" # DB where clickstack-otel-collector writes otel_logs
  tls: false
  user: "neuraltrust"
  # CLICKHOUSE_PASSWORD is read from a shared secret — the in-cluster `clickhouse`
  # subchart secret by default (same secret AlertEngine uses). For external
  # ClickHouse (infrastructure.clickhouse.deploy=false), point this at the secret
  # holding your password (matches infrastructure.clickhouse.external.secretName/Key).
  existingSecret:
    name: "clickhouse"
    key: "admin-password"
# HS256 JWT verification key (required at runtime).
jwtSecret: "" # Auto-generated if empty
# Optional JWT validation.
jwt:
  issuer: ""
  audience: ""
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 1000m, memory: 256Mi}
nodeSelector: {}
tolerations: []
extraEnv: []
service:
  type: ClusterIP
ingress:
  enabled: false
  className: ""
  annotations: {}
  tls:
    enabled: false
    secretName: ""
  host: ""
  hostPrefix: "datacore"
