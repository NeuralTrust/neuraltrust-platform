{{- if eq (include "firewall.enabled" .) "true" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: firewall-config
  labels:
    {{- include "firewall.gateway.labels" . | nindent 4 }}
data:
  PYTHONUNBUFFERED: {{ .Values.firewall.config.pythonUnbuffered | quote }}
  PYTHONDONTWRITEBYTECODE: {{ .Values.firewall.config.pythonDontWriteBytecode | quote }}
  PYTHONPATH: {{ .Values.firewall.config.pythonPath | quote }}
  HF_HOME: {{ .Values.firewall.config.hfHome | quote }}
  {{- if and .Values.firewall.config.cudaMpsActiveThreadPercentage .Values.firewall.config.cudaMpsPinnedDeviceMemLimit }}
  CUDA_MPS_ACTIVE_THREAD_PERCENTAGE: {{ .Values.firewall.config.cudaMpsActiveThreadPercentage | quote }}
  CUDA_MPS_PINNED_DEVICE_MEM_LIMIT: {{ .Values.firewall.config.cudaMpsPinnedDeviceMemLimit | quote }}
  {{- end }}
  {{- if .Values.firewall.config.applicationVersion }}
  APPLICATION_VERSION: {{ .Values.firewall.config.applicationVersion | quote }}
  {{- end }}
  {{- /* An explicit "true"/"false" is honoured. Left unset (""), the SDK gate
         follows the endpoint: gating it off while an endpoint resolves is the
         shape that made this service look instrumented and emit nothing. The
         endpoint block below sets $otelEndpoint, but OTEL_ENABLED is rendered
         first, so resolve it here too. */ -}}
  {{- $fwOtelEnabled := .Values.firewall.config.otelEnabled | default "" | toString | trim -}}
  {{- if not $fwOtelEnabled -}}
    {{- $fwResolved := .Values.firewall.config.otelExporterOtlpEndpoint -}}
    {{- $fwGlobalColl := default dict (default dict (default dict .Values.global).observability).collector -}}
    {{- if $fwGlobalColl.endpoint -}}{{- $fwResolved = $fwGlobalColl.endpoint -}}{{- end -}}
    {{- if not $fwResolved -}}
      {{- $fwResolved = include "neuraltrust-platform.observability.defaultOtlpEndpoint" . -}}
    {{- end -}}
    {{- $fwOtelEnabled = ternary "true" "false" (ne $fwResolved "") -}}
  {{- end }}
  OTEL_ENABLED: {{ $fwOtelEnabled | quote }}
  {{- if eq $fwOtelEnabled "true" }}
  # Emit stable HTTP semconv (http.server.request.duration) so watchdog RED
  # alerting sees the same series the collector and GMP expect.
  OTEL_SEMCONV_STABILITY_OPT_IN: "http"
  {{- end }}
  {{- /*
    Endpoint resolution order:
      1. global.observability.collector.endpoint (umbrella-wide override)
      2. firewall.config.otelExporterOtlpEndpoint (per-component override)
      3. the in-release ClickStack collector (external/saas, autoDiscover on)
    The umbrella override wins so an operator can flip every component to
    the in-chart collector with one knob without editing every subchart.
    The key is omitted only when none of the three resolves — hybrid, or
    autoDiscover off — so the SDK falls back to its own default rather than
    being handed an empty endpoint it cannot dial.
  */ -}}
  {{- $otelEndpoint := .Values.firewall.config.otelExporterOtlpEndpoint -}}
  {{- $globalObs := default dict (default dict .Values.global).observability -}}
  {{- $globalColl := default dict $globalObs.collector -}}
  {{- if $globalColl.endpoint -}}
    {{- $otelEndpoint = $globalColl.endpoint -}}
  {{- end -}}
  {{- /* With neither override set, fall back to the umbrella derivation. */ -}}
  {{- if not $otelEndpoint -}}
    {{- $otelEndpoint = include "neuraltrust-platform.observability.defaultOtlpEndpoint" . -}}
  {{- end }}
  {{- if $otelEndpoint }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ $otelEndpoint | quote }}
  {{- end }}
  {{- if .Values.firewall.config.otelServiceName }}
  OTEL_SERVICE_NAME: {{ .Values.firewall.config.otelServiceName | quote }}
  {{- end }}
  OTEL_ENVIRONMENT: {{ .Values.firewall.config.otelEnvironment | quote }}
  {{- /* REDIS_URL without a password is safe in the ConfigMap. When a password
         is present the URL goes in firewall-secrets instead (see secrets.yaml /
         platform-secrets.yaml) and is injected via an env entry on the pods. */}}
  {{- $redisUrl := include "neuraltrust-platform.firewall.redisUrl" . }}
  {{- if and $redisUrl (ne (include "neuraltrust-platform.firewall.redisUrl.hasPassword" .) "true") }}
  REDIS_URL: {{ $redisUrl | quote }}
  {{- end }}
  {{- range $workerName, $workerCfg := .Values.firewall.workers }}
  {{- if $workerCfg.enabled }}
  {{- $envKey := printf "%s_WORKER_URL" ($workerName | upper | replace "-" "_") }}
  {{ $envKey }}: {{ printf "http://%s-worker:80" $workerName | quote }}
  {{- end }}
  {{- end }}
  {{- range $key, $value := .Values.firewall.config.extraEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
