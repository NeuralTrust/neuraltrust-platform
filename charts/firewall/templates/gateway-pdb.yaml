{{- if eq (include "firewall.enabled" .) "true" }}
{{- $pdb := default dict .Values.firewall.gateway.podDisruptionBudget }}
{{- $autoscaling := default dict .Values.firewall.gateway.autoscaling }}
{{- $replicas := default 2 .Values.firewall.gateway.replicas }}
{{- if $autoscaling.enabled }}
  {{- $replicas = default 1 $autoscaling.minReplicas }}
{{- end }}
{{- if and $pdb.enabled (gt ($replicas | int) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: firewall
  labels:
    {{- include "firewall.gateway.labels" . | nindent 4 }}
spec:
  {{- if hasKey $pdb "maxUnavailable" }}
  maxUnavailable: {{ $pdb.maxUnavailable }}
  {{- else if hasKey $pdb "minAvailable" }}
  minAvailable: {{ $pdb.minAvailable }}
  {{- else }}
  # maxUnavailable is HPA-safe (wave-2 rule 2).
  maxUnavailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "firewall.gateway.selectorLabels" . | nindent 6 }}
{{- end }}
{{- end }}
