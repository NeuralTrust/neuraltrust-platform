{{- if eq (include "firewall.enabled" .) "true" }}
{{- $parentManagesSecrets := false }}
{{- if and $.Values.global (hasKey $.Values.global "autoGenerateSecrets") $.Values.global.autoGenerateSecrets }}
  {{- $parentManagesSecrets = true }}
{{- end }}
{{- $preserveSecrets := false }}
{{- if $.Values.global }}
  {{- if hasKey $.Values.global "preserveExistingSecrets" }}
    {{- if $.Values.global.preserveExistingSecrets }}
      {{- $preserveSecrets = true }}
    {{- end }}
  {{- end }}
{{- end }}
{{- /* Reached only with global.autoGenerateSecrets: false, the operator's promise
       to supply the credentials, so a value is never invented: firewall-secrets
       renders from firewall.secrets.jwtSecret, or from the live Secret, or not
       at all, and the operator creates it. */}}
{{- if and (not $parentManagesSecrets) (not $preserveSecrets) }}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace "firewall-secrets") }}
{{- $jwtSecret := "" }}
{{- if and .Values.firewall.secrets .Values.firewall.secrets.jwtSecret (ne .Values.firewall.secrets.jwtSecret "") }}
  {{- $jwtSecret = .Values.firewall.secrets.jwtSecret }}
{{- else if and $existingSecret $existingSecret.data (hasKey $existingSecret.data "JWT_SECRET") }}
  {{- $jwtSecret = index $existingSecret.data "JWT_SECRET" | b64dec }}
{{- end }}
{{- if $jwtSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: firewall-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "firewall.gateway.labels" . | nindent 4 }}
type: Opaque
data:
  JWT_SECRET: {{ $jwtSecret | b64enc }}
  {{- /* The Redis password must not land in the ConfigMap. */}}
  {{- with include "neuraltrust-platform.firewall.redis.password" (dict "ctx" . "fw" .Values.firewall) }}
  REDIS_PASSWORD: {{ . | b64enc }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
