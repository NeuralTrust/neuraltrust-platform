securityHardening: true # Adds readOnlyRootFilesystem, drops capabilities, seccomp profile. Set to false to restore prior behavior.
firewall:
  # --- Gateway (CPU-only, lightweight API router) ---
  gateway:
    replicas: 2
    image:
      repository: europe-west1-docker.pkg.dev/neuraltrust-app-prod/nt-docker/firewall-cpu
      tag: v2.46.0
      pullPolicy: IfNotPresent
    resources:
      limits:
        cpu: "500m"
        memory: 1Gi
      requests:
        cpu: "250m"
        memory: 512Mi
    startupProbe:
      failureThreshold: 12
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 90
    podDisruptionBudget:
      maxUnavailable: 1
    # Extra env vars appended to the gateway container (list of EnvVar).
    extraEnv: []
    # Extra envFrom sources appended to the gateway container (list of EnvFromSource: configMapRef/secretRef).
    extraEnvFrom: []
  # --- Worker defaults (shared by all workers unless overridden) ---
  # Default: CPU image. For GPU, override image to firewall-gpu, add nvidia.com/gpu
  # resources, nodeSelector, tolerations, and hostIPC (see values-dataplane-gpu.yaml.example).
  workerDefaults:
    # Recreate terminates the old pod before starting the new one. Prefer this over
    # RollingUpdate for ML workers (heavy CPU/RAM): maxSurge: 1 doubles capacity
    # during rollouts and leaves the new pod Pending on small clusters.
    deploymentStrategy: Recreate # Recreate | RollingUpdate
    image:
      repository: europe-west1-docker.pkg.dev/neuraltrust-app-prod/nt-docker/firewall-cpu
      # Keep in lockstep with gateway.image.tag.
      tag: v2.46.0
      pullPolicy: IfNotPresent
    replicas: 1
    # CPU-worker default: one HF transformer (~86M-class) per pod via ONNX.
    # 3Gi/4Gi gives ONNX runtime headroom under concurrent requests. The heavier
    # topic-guard worker overrides this below.
    resources:
      limits:
        cpu: "2"
        memory: 4Gi
      requests:
        cpu: "1"
        memory: 3Gi
    nodeSelector: {}
    tolerations: []
    hostIPC: false
    startupProbe:
      failureThreshold: 36
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 2
      targetCPUUtilizationPercentage: 80
      # No targetMemoryUtilizationPercentage: ML model RSS is constant per pod.
    podDisruptionBudget:
      maxUnavailable: 1
  # --- Workers (each gets Deployment, Service, HPA, PDB) ---
  # Per-worker extraEnv / extraEnvFrom default to empty; add them under a worker entry
  # to inject extra env vars or envFrom sources into that specific worker container.
  # Example:
  #   toxicity:
  #     enabled: true
  #     module: src.workers.toxicity.app:app
  #     extraEnv:
  #       - name: MY_VAR
  #         value: "literal"
  #     extraEnvFrom:
  #       - configMapRef: { name: my-configmap }
  workers:
    toxicity:
      enabled: true
      module: src.workers.toxicity.app:app
      extraEnv: []
      extraEnvFrom: []
    # Gateway /v1/toolguard forwards here (deprecated path).
    indirect-prompt-injections:
      enabled: true
      module: src.workers.indirect_prompt_injections.app:app
      extraEnv: []
      extraEnvFrom: []
    prompt-jailbreak:
      enabled: true
      module: src.workers.prompt_jailbreak.app:app
      # Two replicas: TrustGuard's prompt guard calls this on every request.
      # A worker's autoscaling block replaces workerDefaults.autoscaling whole.
      replicas: 2
      autoscaling:
        enabled: false
        minReplicas: 2
        maxReplicas: 3
        targetCPUUtilizationPercentage: 80
      extraEnv: []
      extraEnvFrom: []
    # Scores prompt complexity for TrustGate's smart-routing load balancer, which
    # reaches it through the gateway at /v1/complexity. Until this shipped there
    # was nothing for agentgateway's FIREWALL_BASE_URL to resolve to, so TrustGate
    # logged one startup warning and silently fell back to round-robin (AUT-402).
    # Stateful modulation needs the firewall Redis wiring from AUT-386; without a
    # reachable Redis the gateway still answers, from the stateless path.
    complexity:
      enabled: true
      module: src.workers.complexity.app:app
      extraEnv: []
      extraEnvFrom: []
    # Serves customer-defined topics, so TrustGuard topic policies call this one.
    # Present in the worker image since firewall v2.25.0, so the pinned tag above
    # already carries it. Which trained revision of NeuralTrust/topic-guard is
    # baked in follows the image tag — bump workerDefaults.image.tag to pick up a
    # retrained model. Override TOPIC_GUARD_LOCAL_MODEL_PATH via extraEnv only for
    # a custom image that stores the weights elsewhere.
    topic-guard:
      enabled: true
      module: src.workers.topic_guard.app:app
      # Two replicas: TrustGuard topic policies call this on every request.
      # A worker's autoscaling block replaces workerDefaults.autoscaling whole.
      replicas: 2
      autoscaling:
        enabled: false
        minReplicas: 2
        maxReplicas: 3
        targetCPUUtilizationPercentage: 80
      # ONNX weights are ~1.15Gi and ONNX Runtime plus the tokenizer peak past the
      # 4Gi workerDefaults limit under load, so this worker gets the same 5Gi
      # ceiling the prod overlay gives it. A worker's `resources` merges over
      # workerDefaults.resources: keys set here win, the rest are inherited.
      resources:
        requests:
          cpu: "1"
          memory: 3Gi
        limits:
          cpu: "2"
          memory: 5Gi
      extraEnv: []
      extraEnvFrom: []
  # --- Redis cache ---
  # Recommended: backs the firewall's model-score caches with Redis so every
  # replica shares what any of them computed. Optional, the firewall works
  # without it. Host, port, username, password and tls follow global.redis.
  # Off on its own when no Redis exists (global.redis.deploy=false and no
  # global.redis.host) or the Redis is a cluster (global.redis.cluster).
  redis:
    enabled: true
    # Keys are prefixed "fw:", so sharing db 0 with the other services is safe.
    db: "0"
    # Token login instead of a password, for a managed Redis (global.redis.deploy=false):
    #   ""     password (global.redis.password), or GCP Memorystore IAM through
    #          global.redis.authMode=iam + global.gcpIdentity
    #   aws    ElastiCache IAM. The pod signs with its IRSA / Pod Identity role
    #          (global.irsa or serviceAccount.annotations), which needs
    #          elasticache:Connect on the replication group and the user.
    #   azure  Entra ID, from global.azureIdentity (workload identity, managed
    #          identity or service principal). Give the identity a data access
    #          policy on the cache.
    # IAM logins always use TLS.
    login: ""
    iamUser: ""       # aws: the ElastiCache IAM user ID (REDIS_USERNAME)
    iamCacheName: ""  # aws: the replication group ID (REDIS_CACHE_NAME)
    iamRegion: ""     # aws: AWS_REGION; IRSA usually sets it
  # --- ServiceAccount ---
  serviceAccount:
    create: true
    name: firewall
    annotations: {}
  # --- Secrets (standard K8s Secret, same pattern as other charts) ---
  secrets:
    jwtSecret: ""
  # --- ConfigMap ---
  config:
    pythonUnbuffered: "1"
    pythonDontWriteBytecode: "1"
    pythonPath: "/app"
    hfHome: "/root/.cache/huggingface"
    cudaMpsActiveThreadPercentage: "20"
    cudaMpsPinnedDeviceMemLimit: "3500M"
    applicationVersion: ""
    # "" follows the resolved endpoint: on external/saas the in-release
    # ClickStack collector resolves, so the SDK comes up; in hybrid nothing
    # resolves and it stays off. Set "true"/"false" to decide explicitly.
    otelEnabled: ""
    # Empty by default. No customer install has a collector at a NeuralTrust
    # internal address, so a hostname here only produces exporter errors when an
    # operator enables OTel without also setting the umbrella-wide endpoint.
    # Sibling charts already omit their OTel config when nothing resolves.
    otelExporterOtlpEndpoint: ""
    otelServiceName: ""
    otelEnvironment: "prod"
    extraEnv: {}
  # --- Shared pod/container security ---
  podSecurityContext:
    fsGroup: 2000
  securityContext:
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    runAsNonRoot: false
    runAsUser: 0
  # imagePullSecrets: unset → global.imagePullSecrets → gcr-secret; "" → global
  # only; "none" suppresses.
  # --- GKE HealthCheckPolicy ---
  healthCheckPolicy:
    enabled: true
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 2
global:
  imageRegistry: ""
  autoGenerateSecrets: false
  preserveExistingSecrets: false
