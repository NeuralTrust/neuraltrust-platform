{{- /* Gateway API counterpart of ingress.yaml, rendered when
       global.ingress.provider=gateway-api. */ -}}
{{- if and (eq (include "trustguard.enabled" .) "true") .Values.ingress.enabled (include "neuraltrust-platform.ingress.gatewayApi" (dict "global" .Values.global)) }}
{{- $dpHost := include "neuraltrust-platform.ingress.host" (dict "host" .Values.ingress.dataPlane.host "prefix" .Values.ingress.dataPlane.hostPrefix "global" .Values.global) }}
{{- include "neuraltrust-platform.httpRoute" (dict "ctx" . "name" "trustguard" "labels" (printf "%s\napp.kubernetes.io/component: data-plane" (include "trustguard.labels" .)) "hosts" (list $dpHost) "service" .Values.dataPlane.name "port" 80 "healthPath" "/readyz") }}
{{- if eq (include "neuraltrust-platform.isExternal" .) "true" }}
{{- $cpHost := include "neuraltrust-platform.ingress.host" (dict "host" .Values.ingress.controlPlane.host "prefix" .Values.ingress.controlPlane.hostPrefix "global" .Values.global) }}
---
{{ include "neuraltrust-platform.httpRoute" (dict "ctx" . "name" "trustguard-admin" "labels" (printf "%s\napp.kubernetes.io/component: control-plane" (include "trustguard.labels" .)) "hosts" (list $cpHost) "service" .Values.controlPlane.name "port" 80 "healthPath" "/readyz") }}
{{- end }}
{{- end }}
