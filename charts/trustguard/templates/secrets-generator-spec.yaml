{{- /* What the in-cluster secrets generator creates for trustguard
       (templates/_secrets_generator.tpl in the umbrella chart). */ -}}
{{- if eq (include "trustguard.enabled" .) "true" }}
{{- $db := include "neuraltrust-platform.secretsGenerator.dbEntry" (dict "ctx" . "db" .Values.database "key" "TRUSTGUARD_DB_PASSWORD" "adopt" (list (list "trustguard-secrets" "DB_PASSWORD"))) | fromYaml }}
{{- $entries := list }}
{{- $pins := dict }}
{{- if $db.entry }}
  {{- $entries = append $entries $db.entry }}
  {{- if $db.pin }}{{- $_ := set $pins "TRUSTGUARD_DB_PASSWORD" $db.pin }}{{- end }}
{{- end }}
{{- /* Config-sync listener keypair: same SANs as configsync-tls-secret.yaml. */}}
{{- if eq (include "trustguard.configSyncTls.generated" .) "true" }}
  {{- $tls := (default dict .Values.configSync).grpcTls | default dict }}
  {{- $svc := .Values.controlPlane.name }}
  {{- $cn := include "trustguard.configSyncTls.serverName" . }}
  {{- $sans := list $svc (printf "%s.%s" $svc .Release.Namespace) (printf "%s.%s.svc" $svc .Release.Namespace) $cn }}
  {{- $entries = append $entries (dict "type" "tls" "secret" (include "trustguard.configSyncTls.secretName" .) "cn" $cn "caCn" "trustguard-configsync-ca" "sans" $sans "days" (int ($tls.durationDays | default 3650)) "adopt" (list (list "trustguard-configsync-tls"))) }}
{{- end }}
{{- include "neuraltrust-platform.secretsGenerator.specObjects" (dict "ctx" . "component" "trustguard" "entries" $entries "pins" $pins) }}
{{- end }}
