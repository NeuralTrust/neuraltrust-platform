{{- if eq (include "trustguard.enabled" .) "true" }}
{{- if and (include "neuraltrust-platform.autoGenerateSecrets" .) (not .Values.global.preserveExistingSecrets) }}
{{- $isHybrid := eq (include "neuraltrust-platform.isHybrid" .) "true" }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace "trustguard-secrets") }}
{{- $configSyncOn := eq (include "neuraltrust-platform.configSync.enabled" .) "true" }}
{{- /* Config-sync contributes to $hasExplicit whenever it is ON, not only when the
       chart has to mint the token. Keyed on "needs managed", an install that
       supplies its own configSync.existingSecret dropped this whole Secret from any
       upgrade render that cannot see the cluster, so `helm diff upgrade` and
       `--dry-run` showed CONFIG_SYNC_LKG_KEY vanishing with no replacement. The live
       upgrade was always fine — lookup finds the Secret and resource-policy: keep
       preserves it — but a review diff that lies is worse than no diff (AUT-408). */}}
{{- $hasExplicit := or .Values.adminJwtSecret .Values.tokenSigningSecret .Values.redisEventsSecret .Values.database.password $configSyncOn }}
{{- if or .Release.IsInstall $existing $hasExplicit }}
{{- $dbPw := include "neuraltrust-platform.resolveSecret" (dict "value" .Values.database.password "existingSecret" $existing "secretKey" "DB_PASSWORD" "length" 32) }}
{{- $data := dict }}
{{- if ne (include "neuraltrust-platform.secretsGenerator.active" .) "true" }}
  {{- $_ := set $data "ADMIN_JWT_SECRET" (include "neuraltrust-platform.resolveSecret" (dict "value" .Values.adminJwtSecret "existingSecret" $existing "secretKey" "ADMIN_JWT_SECRET" "length" 64)) }}
  {{- $_ := set $data "TRUSTGUARD_TOKEN_SIGNING_SECRET" (include "neuraltrust-platform.resolveSecret" (dict "value" .Values.tokenSigningSecret "existingSecret" $existing "secretKey" "TRUSTGUARD_TOKEN_SIGNING_SECRET" "length" 64)) }}
  {{- $_ := set $data "REDIS_EVENTS_SECRET" (include "neuraltrust-platform.resolveSecret" (dict "value" .Values.redisEventsSecret "existingSecret" $existing "secretKey" "REDIS_EVENTS_SECRET" "length" 64)) }}
{{- end }}
{{- /* v2 hybrid: DB_PASSWORD, SENSIBLE_PG_DSN, and REDIS_PASSWORD all come
       from the shared `postgresql-secrets` / `redis-secrets` Secrets (wired
       via envFrom on the Deployment), so they are omitted here to keep a
       single source of truth. IAM DB auth also ships no static password. */}}
{{- /* An operator Secret named under `existingSecret` owns the credential, so
       the key is left out here and injected at the Deployment instead. */}}
{{- $dbExternal := include "neuraltrust-platform.datastore.credentialIsExternal" (dict "ref" (include "neuraltrust-platform.dbPasswordRef" (dict "ctx" . "db" .Values.database "key" "TRUSTGUARD_DB_PASSWORD") | fromYaml)) }}
{{- if and (ne (include "neuraltrust-platform.postgres.iamAuth" (dict "ctx" . "database" .Values.database)) "true") (not $isHybrid) (not $dbExternal) }}
  {{- $_ := set $data "DB_PASSWORD" $dbPw }}
{{- end }}
{{- $redisExternal := include "neuraltrust-platform.datastore.credentialIsExternal" (dict "ref" (include "neuraltrust-platform.redis.passwordRef" (dict "ctx" . "redis" .Values.redis) | fromYaml)) }}
{{- $redisPw := include "neuraltrust-platform.redis.password" (dict "ctx" . "password" .Values.redis.password) }}
{{- if and $redisPw (not .Values.redis.iamAuth) (not $isHybrid) (not $redisExternal) }}
  {{- $_ := set $data "REDIS_PASSWORD" $redisPw }}
{{- end }}
{{- /* TRUSTGUARD_PLATFORM_CLIENT_ID/_SECRET are injected from the shared
       trustguard-client-credentials Secret via the Deployment env, so the pair
       stays identical to AgentGateway's client credentials. Not stored here. */}}
{{- if $configSyncOn }}
  {{- $csToken := include "neuraltrust-platform.configSync.token" (dict "ctx" . "existingSecret" $existing) }}
  {{- if $csToken }}{{- $_ := set $data "CONFIG_SYNC_TOKEN" $csToken }}{{- end }}
  {{- $_ := set $data "CONFIG_SYNC_LKG_KEY" (include "neuraltrust-platform.configSync.lkgKey" (dict "ctx" . "existingSecret" $existing)) }}
{{- end }}
{{- /* Hybrid ClickStack auth is owned by clickstack-egress-collector (enrolment
       exchange). No OTEL_EXPORTER_OTLP_HEADERS on app Secrets. With nothing left
       to hold (the in-cluster generator owns the rest), the Secret is not
       rendered and the Deployments' optional envFrom finds nothing. */}}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: trustguard-secrets
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "trustguard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k := keys $data | sortAlpha }}
  {{ $k }}: {{ index $data $k | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
