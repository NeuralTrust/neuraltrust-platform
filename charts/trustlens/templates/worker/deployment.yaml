{{- if .Values.enabled }}
{{- $img := include "trustlens.image" (dict "repository" .Values.image.repository "tag" .Values.image.tag "global" .Values.global) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.dataPlane.name }}
  labels:
    {{- include "trustlens.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-plane
spec:
  {{- if not (default dict .Values.dataPlane.autoscaling).enabled }}
  replicas: {{ .Values.dataPlane.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "trustlens.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: data-plane
  template:
    metadata:
      labels:
        {{- include "trustlens.labels" . | nindent 8 }}
        app.kubernetes.io/component: data-plane
      annotations:
        {{- /* AUT-403: roll when env ConfigMap / chart-managed Secret changes. */}}
        {{- include "neuraltrust-platform.checksumAnnotations" (dict "context" . "files" (list "/env-configmap.yaml" "/secrets.yaml")) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "trustlens.serviceAccountName" . }}
      {{- include "trustlens.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.securityHardening }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      volumes:
      - name: tmp
        emptyDir: {}
      {{- include "neuraltrust-platform.customCaCert.volume" . | nindent 6 }}
      containers:
      - name: worker
        image: {{ $img | quote }}
        args: {{ toJson .Values.dataPlane.args }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        envFrom:
        - configMapRef:
            name: trustlens-env-vars
        - secretRef:
            name: trustlens-secrets
            optional: true
        env:
        {{- /* Shared credentials come from platform-secrets; an explicit env
               entry outranks the legacy copy still arriving via envFrom. */}}
        {{- include "neuraltrust-platform.platformSecretEnv" (dict "ctx" . "keys" (dict "JWT_SECRET" "TRUSTLENS_JWT_SECRET" "ENCRYPTION_KEYSET" "ENCRYPTION_KEYSET") "skip" .Values.dataPlane.extraEnv) | nindent 8 }}
        {{- with .Values.dataPlane.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "neuraltrust-platform.proxy-env" . | nindent 8 }}
        {{- include "neuraltrust-platform.customCaCert.env" (dict "runtime" "go" "ctx" .) | nindent 8 }}
        {{- include "neuraltrust-platform.appVersionEnv" (dict "tag" .Values.image.tag) | nindent 8 }}
        {{- if .Values.securityHardening }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        {{- end }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        {{- include "neuraltrust-platform.customCaCert.volumeMount" . | nindent 8 }}
        resources:
          {{- toYaml .Values.dataPlane.resources | nindent 10 }}
        # Optional probes — the worker has no health port by default (River
        # consumer only). Set dataPlane.healthPort when a /healthz endpoint exists.
        {{- if .Values.dataPlane.healthPort }}
        ports:
        - name: health
          containerPort: {{ .Values.dataPlane.healthPort }}
        readinessProbe:
          httpGet:
            path: {{ .Values.dataPlane.healthPath | default "/healthz" }}
            port: health
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: {{ .Values.dataPlane.healthPath | default "/healthz" }}
            port: health
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        {{- end }}
      {{- include "neuraltrust-platform.nodeSelector" (dict "ctx" . "local" .Values.dataPlane.nodeSelector) | nindent 6 }}
      {{- include "neuraltrust-platform.tolerations" (dict "ctx" . "local" .Values.dataPlane.tolerations) | nindent 6 }}
{{- end }}
