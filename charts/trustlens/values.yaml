# TrustLens. Opt-in (enabled=true). Postgres-only; migrations on startup.
# worker → hybrid + external; api → external only.
enabled: false
nameOverride: ""
fullnameOverride: "trustlens"

securityHardening: true

image:
  repository: europe-west1-docker.pkg.dev/neuraltrust-app-prod/nt-docker/trustlens
  tag: "" # Required when enabled; no release image is published yet
  pullPolicy: IfNotPresent

imagePullSecrets: "gcr-secret"

serviceAccount:
  create: true
  name: "trustlens"
  annotations: {}

config:
  environment: "production"
  httpAddr: ":8080"

# PostgreSQL connection (external-capable). Password lives in the secret.
database:
  host: "" # Required in v2
  port: 5432
  name: "trustlens"
  user: "trustlens"
  password: "" # Auto-generated if empty
  sslMode: "prefer" # TLS when available, plaintext fallback for the non-TLS in-cluster PG; use "require" for hosted DBs

# HS256 JWT verification key + Tink AEAD keyset for integration credentials.
jwtSecret: "" # Auto-generated if empty
encryptionKeyset: "" # Auto-generated if empty

# ---- control-plane (api runtime) — full deployments only ----
controlPlane:
  name: trustlens-api
  args: ["/api"]
  replicas: 1
  # Optional HPA (disabled by default). Customer scale: min 1 / max 3.
  # When enabled, Deployment.spec.replicas is omitted so HPA owns the count.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 90
  ports:
    http: 8080
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 500m, memory: 1Gi }
  nodeSelector: {}
  tolerations: []
  extraEnv: []
  service:
    port: 8080

# ---- data-plane (worker runtime) — hybrid + full ----
dataPlane:
  name: trustlens-worker
  args: ["/worker"]
  replicas: 1
  # Optional HPA (disabled by default). Customer scale: min 1 / max 3.
  # When enabled, Deployment.spec.replicas is omitted so HPA owns the count.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 90
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 1Gi }
  # Worker is a River consumer with no health port today. Set healthPort (and
  # optionally healthPath) once the binary exposes HTTP /healthz.
  healthPort: ""
  healthPath: "/healthz"
  nodeSelector: {}
  tolerations: []
  extraEnv: []

ingress:
  enabled: true
  className: ""
  annotations: {}
  tls:
    enabled: false
    secretName: ""
  controlPlane:
    host: ""
    hostPrefix: "trustlens"
