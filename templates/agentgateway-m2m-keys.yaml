{{- /*
Generates the AgentGateway Admin API machine-credential key pair in-cluster, so
an external install gets the feature with no operator action (ENG-1212).

Why a hook Job at all: the app loads the private key as PKCS#8, and Helm cannot
produce an RSA key in PKCS#8 (`genPrivateKey "rsa"` is PKCS#1). The public half
has to match that private key, and TrustGate reads it as a single-line
base64-encoded PEM, so the Job writes both into one Secret.

Why no new image: some installs mirror their own registry or run under a
vulnerability allowlist, so a dedicated tool image is a real cost. This reuses
the app image the chart already deploys — Node generates PKCS#8 natively.
External/saas only, so that image is always present.

Why its own Secret rather than `platform-secrets`: pre-install hooks run before
Helm creates any manifest. The public half is not a platform credential (only
the admin workload reads it), and helm uninstall leaves the Secret so a
reinstall keeps the same pair.

Skipped entirely when an operator supplies the pair, or when they turn the
generator off to own the keys themselves.
*/}}
{{- if eq (include "neuraltrust-platform.agentgatewayM2m.generateKeys" .) "true" }}
{{- $secretName := include "neuraltrust-platform.agentgatewayM2m.generatedSecretName" . }}
{{- $saName := printf "%s-agentgateway-m2m-keys" (include "neuraltrust-platform.name" .) }}
{{- $cpApp := default dict (index .Values "control-plane-app") }}
{{- $cp := default dict $cpApp.controlPlane }}
{{- $appImage := default dict (default dict (default dict $cp.components).app).image }}
{{- $repo := $appImage.repository | default "europe-west1-docker.pkg.dev/neuraltrust-app-prod/nt-docker/app" }}
{{- $tag := $appImage.tag | default "v1.142.0" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/name: {{ include "neuraltrust-platform.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: agentgateway-m2m-keys
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $saName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/name: {{ include "neuraltrust-platform.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: agentgateway-m2m-keys
rules:
  {{- /* Reads and writes exactly one Secret, by name. */}}
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $secretName | quote }}]
    verbs: ["get", "patch"]
  {{- /* RBAC cannot scope `create` by name — the object does not exist yet — so
         this one verb is namespace-wide. The Job only ever creates the Secret
         named above, and both the Role and the Job are deleted once the hook
         succeeds. */}}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $saName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/name: {{ include "neuraltrust-platform.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: agentgateway-m2m-keys
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $saName }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $saName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/name: {{ include "neuraltrust-platform.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: agentgateway-m2m-keys
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "neuraltrust-platform.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: agentgateway-m2m-keys
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $saName }}
      {{- include "neuraltrust-platform.controlPlane.imagePullSecrets" (dict "root" $cpApp "global" (.Values.global | default dict)) | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: generate
          image: {{ include "neuraltrust-platform.image" (dict "repository" $repo "tag" $tag "global" .Values.global) | quote }}
          imagePullPolicy: {{ $appImage.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: M2M_SECRET_NAME
              value: {{ $secretName | quote }}
            - name: M2M_PRIVATE_KEY
              value: "AGENTGATEWAY_M2M_PRIVATE_KEY"
            - name: M2M_PUBLIC_KEYS
              value: "ADMIN_M2M_PUBLIC_KEYS"
            {{- /* Node's TLS trusts the API server through the projected CA. */}}
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          command:
            - node
            - -e
            - |
              const crypto = require('node:crypto')
              const fs = require('node:fs')
              const sa = '/var/run/secrets/kubernetes.io/serviceaccount'
              const ns = fs.readFileSync(sa + '/namespace', 'utf8').trim()
              const token = fs.readFileSync(sa + '/token', 'utf8').trim()
              const name = process.env.M2M_SECRET_NAME
              const privField = process.env.M2M_PRIVATE_KEY
              const pubField = process.env.M2M_PUBLIC_KEYS
              // Dial the API server by its in-cluster DNS name rather than
              // KUBERNETES_SERVICE_HOST. On IPv6 single-stack clusters that variable
              // holds a bare IPv6 literal, which is not a parsable URL host without
              // brackets, and even bracketed it fails TLS verification because the
              // compressed form is string-compared against the expanded IP SAN.
              // kubernetes.default.svc is address-family agnostic and is in the
              // default SAN set on every distribution this chart targets.
              const port = process.env.KUBERNETES_SERVICE_PORT || '443'
              const base = 'https://kubernetes.default.svc:' + port
              const collection = base + '/api/v1/namespaces/' + ns + '/secrets'
              const auth = { Authorization: 'Bearer ' + token }
              const json = Object.assign({ 'Content-Type': 'application/json' }, auth)

              function describe(encoded) {
                const key = crypto.createPrivateKey(Buffer.from(encoded, 'base64').toString())
                return key.asymmetricKeyType + ' ' + key.asymmetricKeyDetails.modulusLength + '-bit'
              }

              function publicFromPrivate(encoded) {
                const key = crypto.createPrivateKey(Buffer.from(encoded, 'base64').toString())
                const pem = crypto.createPublicKey(key).export({ type: 'spki', format: 'pem' }).toString()
                return Buffer.from(pem).toString('base64')
              }

              function pairPayload() {
                const pair = crypto.generateKeyPairSync('rsa', { modulusLength: 2048 })
                const pem = pair.privateKey.export({ type: 'pkcs8', format: 'pem' }).toString()
                const pubPem = pair.publicKey.export({ type: 'spki', format: 'pem' }).toString()
                const data = {}
                data[privField] = Buffer.from(pem).toString('base64')
                data[pubField] = Buffer.from(Buffer.from(pubPem).toString('base64')).toString('base64')
                return data
              }

              async function main() {
                const found = await fetch(collection + '/' + name, { headers: auth })
                if (found.status === 200) {
                  const body = await found.json()
                  const existing = (body.data && body.data[privField]) || ''
                  if (existing) {
                    let shape = 'unparseable, the app will not be able to sign tokens'
                    try {
                      shape = describe(existing)
                    } catch (err) {
                      console.error('warning: existing private key does not parse: ' + String(err))
                    }
                    if (body.data && body.data[pubField]) {
                      console.log('m2m key pair already present (' + shape + '), leaving it untouched')
                      return
                    }
                    // Private half survived an interrupted run; derive the public
                    // half rather than mint a new pair that would desync TrustGate.
                    const patch = {}
                    patch[pubField] = Buffer.from(publicFromPrivate(existing)).toString('base64')
                    const patched = await fetch(collection + '/' + name, {
                      method: 'PATCH',
                      headers: Object.assign({ 'Content-Type': 'application/merge-patch+json' }, auth),
                      body: JSON.stringify({ data: patch }),
                    })
                    if (!patched.ok) {
                      throw new Error('patch failed: ' + patched.status + ' ' + (await patched.text()))
                    }
                    console.log('backfilled public key next to existing private key (' + shape + ')')
                    return
                  }
                } else if (found.status !== 404) {
                  throw new Error('read failed: ' + found.status + ' ' + (await found.text()))
                }

                const data = pairPayload()
                const shape = describe(data[privField])

                if (found.status === 404) {
                  const meta = { name: name, namespace: ns }
                  const created = await fetch(collection, {
                    method: 'POST',
                    headers: json,
                    body: JSON.stringify({ apiVersion: 'v1', kind: 'Secret', type: 'Opaque', metadata: meta, data: data }),
                  })
                  if (created.status === 409) {
                    console.log('another run created it first, leaving it untouched')
                    return
                  }
                  if (!created.ok) {
                    throw new Error('create failed: ' + created.status + ' ' + (await created.text()))
                  }
                  console.log('generated an RSA PKCS#8 m2m key pair (' + shape + ')')
                  return
                }

                const patched = await fetch(collection + '/' + name, {
                  method: 'PATCH',
                  headers: Object.assign({ 'Content-Type': 'application/merge-patch+json' }, auth),
                  body: JSON.stringify({ data: data }),
                })
                if (!patched.ok) {
                  throw new Error('patch failed: ' + patched.status + ' ' + (await patched.text()))
                }
                console.log('added an RSA PKCS#8 m2m key pair to the existing Secret (' + shape + ')')
              }

              main().catch((err) => {
                console.error(String(err))
                process.exit(1)
              })
{{- end }}
