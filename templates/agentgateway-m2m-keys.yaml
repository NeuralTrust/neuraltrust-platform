{{- /*
Generates the AgentGateway Admin API machine-credential key pair in-cluster, so
an external install gets the feature with no operator action (ENG-1212).

Both halves go into one Secret: the app signs with the private key and TrustGate
admin verifies with the public one, so a pair that drifts apart 401s every
service token. The hook itself lives in `_keygen.tpl`.

Skipped entirely when an operator supplies the pair, or when they turn the
generator off to own the keys themselves.
*/}}
{{- if eq (include "neuraltrust-platform.agentgatewayM2m.generateKeys" .) "true" }}
{{- include "neuraltrust-platform.keygenHook" (dict
      "ctx" .
      "component" "agentgateway-m2m-keys"
      "secretName" (include "neuraltrust-platform.agentgatewayM2m.generatedSecretName" .)
      "subject" "m2m key pair"
      "nameEnv" "M2M_SECRET_NAME"
      "privateEnv" "M2M_PRIVATE_KEY"
      "privateField" "AGENTGATEWAY_M2M_PRIVATE_KEY"
      "publicEnv" "M2M_PUBLIC_KEYS"
      "publicField" "ADMIN_M2M_PUBLIC_KEYS") }}
{{- end }}
