{{- /*
Umbrella-owned control-plane Secret shared by control-plane-api and control-plane-app.
Renders only in v2 external mode when secrets are being managed by this chart.
Values are read from either control-plane-api.controlPlane.secrets or
control-plane-app.controlPlane.secrets (API preferred), so operators can
place them under either root.
*/ -}}
{{- $secretName := "control-plane-secrets" -}}
{{- $auto := eq (include "neuraltrust-platform.autoGenerateSecrets" .) "true" -}}
{{- $preserve := .Values.global.preserveExistingSecrets | default false -}}
{{- $isExternal := eq (include "neuraltrust-platform.isExternal" .) "true" -}}
{{- $cpApi := default dict (index .Values "control-plane-api") -}}
{{- $cpApp := default dict (index .Values "control-plane-app") -}}
{{- $apiCp := default dict $cpApi.controlPlane -}}
{{- $appCp := default dict $cpApp.controlPlane -}}
{{- $apiSecrets := default dict $apiCp.secrets -}}
{{- $appSecrets := default dict $appCp.secrets -}}
{{- $secrets := merge (deepCopy $apiSecrets) $appSecrets -}}
{{- /* Bootstrap admin for control-plane-app. Inline global.superadmin.email +
       password land here so the Deployment can reference them via secretKeyRef
       instead of a plain env value. Skipped when the operator supplies their
       own Secret through global.superadmin.existingSecret.name. */ -}}
{{- $sa := default dict (default dict .Values.global).superadmin -}}
{{- $saExisting := default dict $sa.existingSecret -}}
{{- $saInline := and (not $saExisting.name) $sa.email $sa.password -}}
{{- /* Outbound email. Only chart-managed when the operator has not pointed
       global.email.existingSecret.name at their own Secret. The generic
       EMAIL_* / SMTP_* / SES_* keys are provider-agnostic; the legacy
       resend-* keys above stay for existing Resend installs. */ -}}
{{- $email := default dict (default dict .Values.global).email -}}
{{- $emailExisting := default dict $email.existingSecret -}}
{{- $emailManaged := not $emailExisting.name -}}
{{- $emailSmtp := default dict $email.smtp -}}
{{- $emailSes := default dict $email.ses -}}
{{- if and $isExternal $auto (not $preserve) }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  CONTROL_PLANE_JWT_SECRET: {{ include "neuraltrust-platform.resolveSecret" (dict "value" $secrets.controlPlaneJWTSecret "existingSecret" $existing "secretKey" "CONTROL_PLANE_JWT_SECRET") | b64enc | quote }}
  AUTH_SECRET: {{ include "neuraltrust-platform.resolveSecret" (dict "value" $secrets.authSecret "existingSecret" $existing "secretKey" "AUTH_SECRET") | b64enc | quote }}
  NEXTAUTH_SECRET: {{ include "neuraltrust-platform.resolveSecret" (dict "value" $secrets.authSecret "existingSecret" $existing "secretKey" "AUTH_SECRET") | b64enc | quote }}
  OPENAI_API_KEY: {{ $secrets.openaiApiKey | default "" | b64enc | quote }}
  {{- /* Legacy Resend keys, kept in sync with the generic RESEND_API_KEY key
         below so an operator moving to global.email sees no drift. */}}
  resend-api-key: {{ (default dict $email.resend).apiKey | default $secrets.resendApiKey | default "" | b64enc | quote }}
  resend-alert-sender: {{ $email.from | default $secrets.resendAlertSender | default "" | b64enc | quote }}
  resend-invite-sender: {{ $secrets.resendInviteSender | default "" | b64enc | quote }}
  resend-reply-to: {{ $email.replyTo | default $secrets.resendReplyTo | default "" | b64enc | quote }}
  TRUSTGATE_JWT_SECRET: {{ include "neuraltrust-platform.resolveSecret" (dict "value" $secrets.trustgateJwtSecret "existingSecret" $existing "secretKey" "TRUSTGATE_JWT_SECRET") | b64enc | quote }}
  FIREWALL_API_URL: {{ $secrets.firewallApiUrl | default "" | b64enc | quote }}
  {{- if $secrets.firewallJwtSecret }}
  FIREWALL_JWT_SECRET: {{ $secrets.firewallJwtSecret | b64enc | quote }}
  {{- end }}
  MODEL_SCANNER_SECRET: {{ $secrets.modelScannerSecret | default "" | b64enc | quote }}
  {{- if $saInline }}
  ONPREM_SUPERADMIN_EMAIL: {{ $sa.email | b64enc | quote }}
  ONPREM_SUPERADMIN_PASSWORD: {{ $sa.password | b64enc | quote }}
  {{- end }}
  {{- if $emailManaged }}
  {{- /* Only credentials belong here. The from / reply-to addresses are public
         (they ship in every message header) and are emitted as plain
         Deployment env instead. */}}
  RESEND_API_KEY: {{ (default dict $email.resend).apiKey | default $secrets.resendApiKey | default "" | b64enc | quote }}
  {{- if $emailSmtp.password }}
  SMTP_PASSWORD: {{ $emailSmtp.password | b64enc | quote }}
  {{- end }}
  {{- if $emailSes.accessKeyId }}
  SES_ACCESS_KEY_ID: {{ $emailSes.accessKeyId | b64enc | quote }}
  SES_SECRET_ACCESS_KEY: {{ $emailSes.secretAccessKey | default "" | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
