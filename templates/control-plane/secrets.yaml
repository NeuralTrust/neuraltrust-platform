{{- /*
Umbrella-owned control-plane Secret shared by control-plane-api and control-plane-app.
Renders only in v2 external mode when secrets are being managed by this chart.
Values are read from either control-plane-api.controlPlane.secrets or
control-plane-app.controlPlane.secrets (API preferred), so operators can
place them under either root.
*/ -}}
{{- $secretName := "control-plane-secrets" -}}
{{- $auto := eq (include "neuraltrust-platform.autoGenerateSecrets" .) "true" -}}
{{- $preserve := .Values.global.preserveExistingSecrets | default false -}}
{{- $isExternal := eq (include "neuraltrust-platform.isExternal" .) "true" -}}
{{- $cpApi := default dict (index .Values "control-plane-api") -}}
{{- $cpApp := default dict (index .Values "control-plane-app") -}}
{{- $apiCp := default dict $cpApi.controlPlane -}}
{{- $appCp := default dict $cpApp.controlPlane -}}
{{- $apiSecrets := default dict $apiCp.secrets -}}
{{- $appSecrets := default dict $appCp.secrets -}}
{{- $secrets := merge (deepCopy $apiSecrets) $appSecrets -}}
{{- /* Bootstrap admin for control-plane-app. Inline global.superadmin.email +
       password land here so the Deployment can reference them via secretKeyRef
       instead of a plain env value. Skipped when the operator supplies their
       own Secret through global.superadmin.existingSecret.name. */ -}}
{{- $sa := default dict (default dict .Values.global).superadmin -}}
{{- $saExisting := default dict $sa.existingSecret -}}
{{- $saInline := and (not $saExisting.name) $sa.email $sa.password -}}
{{- /* Outbound email. Only chart-managed when the operator has not pointed
       global.email.existingSecret.name at their own Secret. The generic
       EMAIL_* / SMTP_* / SES_* keys are provider-agnostic; the legacy
       resend-* keys above stay for existing Resend installs. */ -}}
{{- $email := default dict (default dict .Values.global).email -}}
{{- $emailExisting := default dict $email.existingSecret -}}
{{- $emailManaged := not $emailExisting.name -}}
{{- $emailSmtp := default dict $email.smtp -}}
{{- $emailSes := default dict $email.ses -}}
{{- if and $isExternal $auto (not $preserve) }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) }}
{{- /* Values are kept base64-encoded, as they go into `data`. */}}
{{- $data := dict }}
{{- /* A value configured here wins; otherwise a value already in the live Secret
       (patched in by hand) is kept, since dropping the key from the manifest would
       delete it on upgrade; otherwise the key is left out. Every reader of these
       keys references them `optional`, so an absent key is the same as an empty
       one. */}}
{{- if ne (include "neuraltrust-platform.secretsGenerator.active" .) "true" }}
  {{- $_ := set $data "CONTROL_PLANE_JWT_SECRET" (include "neuraltrust-platform.resolveSecret" (dict "value" $secrets.controlPlaneJWTSecret "existingSecret" $existing "secretKey" "CONTROL_PLANE_JWT_SECRET") | b64enc) }}
  {{- $_ := set $data "AUTH_SECRET" (include "neuraltrust-platform.resolveSecret" (dict "value" $secrets.authSecret "existingSecret" $existing "secretKey" "AUTH_SECRET") | b64enc) }}
{{- end }}
{{- /* openaiApiKey is documented and handled as either a string or a
       {secretName, secretKey} map — both control-plane Deployments branch on
       `kindIs "map"` and reference the operator's Secret directly. Piping the map
       into b64enc aborted the whole render ("wrong type for value; expected
       string"), so the documented map form could not be installed at all
       (AUT-383). A map means the operator owns the credential, so omit the key
       here rather than trying to encode it; this mirrors how AUT-381 treats a
       non-scalar as "not pinned here". */}}
{{- if not (kindIs "map" $secrets.openaiApiKey) }}
  {{- with include "neuraltrust-platform.controlPlaneSecret.liveOrValue" (dict "value" ($secrets.openaiApiKey | default "") "existing" $existing "key" "OPENAI_API_KEY") }}{{- $_ := set $data "OPENAI_API_KEY" . }}{{- end }}
{{- end }}
{{- /* The Resend API key, under the name the app reads (resend-api-key). The
       legacy password-reset / invite senders read it whatever the provider. */}}
{{- $resendKey := (default dict $email.resend).apiKey | default "" }}
{{- if and (not $resendKey) (not (kindIs "map" $secrets.resendApiKey)) }}{{- $resendKey = $secrets.resendApiKey | default "" }}{{- end }}
{{- with include "neuraltrust-platform.controlPlaneSecret.liveOrValue" (dict "value" $resendKey "existing" $existing "key" "resend-api-key") }}{{- $_ := set $data "resend-api-key" . }}{{- end }}
{{- /* Configuration the app falls back to when its own values leave it unset
       (the app subchart cannot see control-plane-api values). Written only when
       set, like the integrations above. */}}
{{- with include "neuraltrust-platform.controlPlaneSecret.liveOrValue" (dict "value" ($email.from | default $secrets.resendAlertSender | default "") "existing" $existing "key" "resend-alert-sender") }}{{- $_ := set $data "resend-alert-sender" . }}{{- end }}
{{- with include "neuraltrust-platform.controlPlaneSecret.liveOrValue" (dict "value" ($email.replyTo | default $secrets.resendReplyTo | default "") "existing" $existing "key" "resend-reply-to") }}{{- $_ := set $data "resend-reply-to" . }}{{- end }}
{{- with include "neuraltrust-platform.controlPlaneSecret.liveOrValue" (dict "value" ($secrets.firewallApiUrl | default "") "existing" $existing "key" "FIREWALL_API_URL") }}{{- $_ := set $data "FIREWALL_API_URL" . }}{{- end }}
{{- if $secrets.firewallJwtSecret }}
  {{- $_ := set $data "FIREWALL_JWT_SECRET" ($secrets.firewallJwtSecret | b64enc) }}
{{- end }}
{{- if $saInline }}
  {{- $_ := set $data "ONPREM_SUPERADMIN_EMAIL" ($sa.email | b64enc) }}
  {{- $_ := set $data "ONPREM_SUPERADMIN_PASSWORD" ($sa.password | b64enc) }}
{{- end }}
{{- if $emailManaged }}
  {{- /* Only credentials belong here, and only the selected provider's: the app
         builds one transport and reads no other provider's keys. The from /
         reply-to addresses are public (they ship in every message header) and
         are emitted as plain Deployment env instead. The Resend key lives in
         resend-api-key above. */}}
  {{- $emailProvider := $email.provider | default "resend" }}
  {{- if and (eq $emailProvider "smtp") $emailSmtp.password }}
    {{- $_ := set $data "SMTP_PASSWORD" ($emailSmtp.password | b64enc) }}
  {{- end }}
  {{- if and (eq $emailProvider "ses") $emailSes.accessKeyId }}
    {{- $_ := set $data "SES_ACCESS_KEY_ID" ($emailSes.accessKeyId | b64enc) }}
    {{- $_ := set $data "SES_SECRET_ACCESS_KEY" ($emailSes.secretAccessKey | default "" | b64enc) }}
  {{- end }}
{{- end }}
{{- /* Nothing configured and nothing left to hold (the in-cluster generator owns
       the signing keys): the Secret is not rendered. */}}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{- range $k := keys $data | sortAlpha }}
  {{ $k }}: {{ index $data $k | quote }}
  {{- end }}
{{- end }}
{{- end }}
