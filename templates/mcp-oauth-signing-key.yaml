{{- /*
Generates the MCP OAuth RS256 signing key in-cluster, so an external install gets
the feature with no operator action.

Why a hook Job at all: the app loads the key with `importPKCS8`, and Helm cannot
produce an RSA key in PKCS#8 (`genPrivateKey "rsa"` is PKCS#1, `"ecdsa"` is SEC1,
and `"ed25519"` is PKCS#8 but the wrong algorithm). Without a stable key every
replica signs with its own ephemeral one, so tokens fail JWKS verification across
replicas.

Why no new image: some installs mirror their own registry or run under a
vulnerability allowlist, so a dedicated tool image is a real cost. This reuses the
exact app image the chart already deploys — Node generates PKCS#8 natively and
reaches the API server with the projected service-account token. MCP OAuth is
external-only, so that image is always present.

Why its own Secret rather than `platform-secrets`: pre-install hooks run before
Helm creates any manifest, so a Job that pre-created the chart-owned Secret would
collide with Helm's ownership metadata on install. This Secret is hook-owned,
which also means `helm uninstall` leaves it in place and a reinstall keeps the
same key.

Skipped entirely when an operator supplies a key, or when they turn the generator
off to own the key themselves.
*/}}
{{- if eq (include "neuraltrust-platform.mcpOAuth.generateSigningKey" .) "true" }}
{{- $secretName := include "neuraltrust-platform.mcpOAuth.generatedSecretName" . }}
{{- $saName := printf "%s-mcp-signing-key" (include "neuraltrust-platform.name" .) }}
{{- $cpApp := default dict (index .Values "control-plane-app") }}
{{- $cp := default dict $cpApp.controlPlane }}
{{- $appImage := default dict (default dict (default dict $cp.components).app).image }}
{{- $repo := $appImage.repository | default "europe-west1-docker.pkg.dev/neuraltrust-app-prod/nt-docker/app" }}
{{- $tag := $appImage.tag | default "v1.117.0" }}
{{- $pullSecret := "gcr-secret" }}
{{- if $cpApp.imagePullSecrets }}
  {{- $pullSecret = $cpApp.imagePullSecrets }}
{{- else if hasKey $cp "imagePullSecrets" }}
  {{- $pullSecret = $cp.imagePullSecrets }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/name: {{ include "neuraltrust-platform.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: mcp-signing-key
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $saName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/name: {{ include "neuraltrust-platform.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: mcp-signing-key
rules:
  {{- /* Reads and writes exactly one Secret, by name. */}}
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $secretName | quote }}]
    verbs: ["get", "patch"]
  {{- /* RBAC cannot scope `create` by name — the object does not exist yet — so
         this one verb is namespace-wide. It is the minimum that lets a fresh
         install bootstrap its own key; the Job only ever creates the Secret named
         above, and both the Role and the Job are deleted once the hook
         succeeds. */}}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $saName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/name: {{ include "neuraltrust-platform.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: mcp-signing-key
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $saName }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $saName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/name: {{ include "neuraltrust-platform.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: mcp-signing-key
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "neuraltrust-platform.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: mcp-signing-key
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $saName }}
      {{- if and $pullSecret (ne $pullSecret "none") (ne $pullSecret "") }}
      imagePullSecrets:
        - name: {{ $pullSecret }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: generate
          image: {{ include "neuraltrust-platform.image" (dict "repository" $repo "tag" $tag "global" .Values.global) | quote }}
          imagePullPolicy: {{ $appImage.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: SIGNING_SECRET_NAME
              value: {{ $secretName | quote }}
            - name: SIGNING_SECRET_KEY
              value: "MCP_OAUTH_SIGNING_KEY"
            {{- /* Node's TLS trusts the API server through the projected CA. */}}
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          command:
            - node
            - -e
            - |
              const crypto = require('node:crypto')
              const fs = require('node:fs')
              const sa = '/var/run/secrets/kubernetes.io/serviceaccount'
              const ns = fs.readFileSync(sa + '/namespace', 'utf8').trim()
              const token = fs.readFileSync(sa + '/token', 'utf8').trim()
              const name = process.env.SIGNING_SECRET_NAME
              const field = process.env.SIGNING_SECRET_KEY
              const base = 'https://' + process.env.KUBERNETES_SERVICE_HOST + ':' + process.env.KUBERNETES_SERVICE_PORT
              const collection = base + '/api/v1/namespaces/' + ns + '/secrets'
              const auth = { Authorization: 'Bearer ' + token }
              const json = Object.assign({ 'Content-Type': 'application/json' }, auth)

              // Reports the key's algorithm and size without revealing it, so the log
              // is evidence the app will be able to load it.
              function describe(encoded) {
                const key = crypto.createPrivateKey(Buffer.from(encoded, 'base64').toString())
                return key.asymmetricKeyType + ' ' + key.asymmetricKeyDetails.modulusLength + '-bit'
              }

              async function main() {
                const found = await fetch(collection + '/' + name, { headers: auth })
                if (found.status === 200) {
                  const body = await found.json()
                  // Never replace an existing key: it signs live access tokens.
                  if (body.data && body.data[field]) {
                    let shape = 'unparseable, the app will fall back to ephemeral keys'
                    try {
                      shape = describe(body.data[field])
                    } catch (err) {
                      console.error('warning: existing signing key does not parse: ' + String(err))
                    }
                    console.log('signing key already present (' + shape + '), leaving it untouched')
                    return
                  }
                } else if (found.status !== 404) {
                  throw new Error('read failed: ' + found.status + ' ' + (await found.text()))
                }

                const pair = crypto.generateKeyPairSync('rsa', { modulusLength: 2048 })
                const pem = pair.privateKey.export({ type: 'pkcs8', format: 'pem' }).toString()
                const data = {}
                data[field] = Buffer.from(pem).toString('base64')
                // Fail here rather than let the app discover it at login time.
                const shape = describe(data[field])

                if (found.status === 404) {
                  const meta = { name: name, namespace: ns }
                  const created = await fetch(collection, {
                    method: 'POST',
                    headers: json,
                    body: JSON.stringify({ apiVersion: 'v1', kind: 'Secret', type: 'Opaque', metadata: meta, data: data }),
                  })
                  // Another replica of this hook won the race; its key is as good.
                  if (created.status === 409) {
                    console.log('another run created it first, leaving it untouched')
                    return
                  }
                  if (!created.ok) {
                    throw new Error('create failed: ' + created.status + ' ' + (await created.text()))
                  }
                  console.log('generated an RSA PKCS#8 signing key (' + shape + ')')
                  return
                }

                const patched = await fetch(collection + '/' + name, {
                  method: 'PATCH',
                  headers: Object.assign({ 'Content-Type': 'application/merge-patch+json' }, auth),
                  body: JSON.stringify({ data: data }),
                })
                if (!patched.ok) {
                  throw new Error('patch failed: ' + patched.status + ' ' + (await patched.text()))
                }
                console.log('added an RSA PKCS#8 signing key to the existing Secret (' + shape + ')')
              }

              main().catch((err) => {
                console.error(String(err))
                process.exit(1)
              })
{{- end }}
