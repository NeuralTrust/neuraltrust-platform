{{- /*
Generates the MCP OAuth RS256 signing key in-cluster, so an external install gets
the feature with no operator action. The app loads it with `importPKCS8`, and
without a stable key every replica signs with its own ephemeral one, so tokens
fail JWKS verification across replicas.

The hook itself — and why it is a hook, reuses the app image, and owns its own
Secret — lives in `_keygen.tpl`.

Skipped entirely when an operator supplies a key, or when they turn the generator
off to own the key themselves.
*/}}
{{- if eq (include "neuraltrust-platform.mcpOAuth.generateSigningKey" .) "true" }}
{{- include "neuraltrust-platform.keygenHook" (dict
      "ctx" .
      "component" "mcp-signing-key"
      "secretName" (include "neuraltrust-platform.mcpOAuth.generatedSecretName" .)
      "subject" "signing key"
      "nameEnv" "SIGNING_SECRET_NAME"
      "privateEnv" "SIGNING_SECRET_KEY"
      "privateField" "MCP_OAUTH_SIGNING_KEY") }}
{{- end }}
