{{- /*
Creates the roles and databases the platform expects on the chart's own
in-cluster PostgreSQL, and aligns each role's password with the Secret the
service reads.

The PostgreSQL image bootstraps exactly one role and one database, from
POSTGRES_USER / POSTGRES_DB. Hybrid needs nothing more — every hybrid service
shares that pair — but external mode gives each service its own database so it
can own its own migrations, and nothing was creating those. The services then
authenticated as roles that did not exist and crash-looped, which is not a state
an operator should have to fix with psql (AUT-412).

This never touches a managed instance. Host and port below are templated from
`global.postgresql.service`, never read from `postgresql-secrets`, and
`bootstrapJob.enabled` already refuses to render once `global.postgresql.host`
names something else or auth is IAM.

Idempotent, because it runs again whenever what it sets up changes and on
re-installs into a namespace whose Secrets were kept: an existing role has its
password re-aligned with the Secret the pods read, an existing database keeps
its data and only gains the owner and grants.

An ordinary Job in the release, not a hook. Helm runs post-install and
post-upgrade hooks only after the release becomes ready, and the services that
need these roles cannot become ready without them, so a hook deadlocked every
install that waits (`helm --wait`, ntctl, Flux). As part of the release it runs
alongside the services, which restart until their role exists. Its name ends in
a hash of what it sets up, so it runs again exactly when that changes; see
$inputs below.

Managed mode is the one exception to "never touches a managed instance", and
only when the operator opts in with `global.postgresql.managedBootstrap`. The
same Job, named postgresql-managed-bootstrap, logs in to `global.postgresql.host`
with the admin login in `managedBootstrap.adminSecret`, creates the control-plane
role and database too (there is no image to create them), takes each role it
must own a database as only for that statement, and creates the extensions the
services need.
*/ -}}
{{- $managed := eq (include "neuraltrust-platform.postgresql.managedBootstrap.enabled" .) "true" }}
{{- if or (eq (include "neuraltrust-platform.postgresql.bootstrapJob.enabled" .) "true") $managed }}
{{- $pg := default dict (default dict .Values.global).postgresql }}
{{- $img := default dict $pg.image }}
{{- $job := default dict $pg.bootstrapJob }}
{{- $service := default dict $pg.service }}
{{- $adminDb := include "neuraltrust-platform.v2.hybridPg.database" . }}
{{- $adminRole := include "neuraltrust-platform.v2.hybridPg.user" . }}
{{- $isExternal := eq (include "neuraltrust-platform.isExternal" .) "true" }}
{{- $mb := default dict $pg.managedBootstrap }}
{{- $mbAdmin := default dict $mb.adminSecret }}
{{- $jobName := "control-plane-postgresql-bootstrap" }}
{{- if $managed }}{{- $jobName = "postgresql-managed-bootstrap" }}{{- end }}
{{- /* The pod label keeps the base name, so it can be found whatever the hash. */}}
{{- $appLabel := $jobName }}
{{- /* The control-plane password: the operator's passwordSecret when set,
       otherwise the shared postgresql-secrets (or its existingSecret). */}}
{{- $cpRef := include "neuraltrust-platform.postgresql.passwordSecretRef" . | fromYaml }}
{{- $cpSecret := include "neuraltrust-platform.v2.hybridPg.secretName" . }}
{{- $cpKey := "POSTGRES_PASSWORD" }}
{{- if eq (include "neuraltrust-platform.postgresql.passwordIsExternal" .) "true" }}
  {{- $cpSecret = $cpRef.name }}
  {{- $cpKey = $cpRef.key | default "POSTGRES_PASSWORD" }}
{{- end }}
{{- /* `default` cannot read these: it treats an explicit false as absent. */}}
{{- $aeEnabled := true }}
{{- if hasKey (default dict .Values.alertengine) "enabled" }}{{- $aeEnabled = (default dict .Values.alertengine).enabled }}{{- end }}

{{- /* Every service that owns a role: the two telemetry writers resolve theirs
       through the same mode-aware helpers as their env ConfigMaps, so the Job
       cannot disagree with what the pod dials. `defaultKey` is the key read from
       the chart's own Secret; an `existingSecret` hook (AUT-411) redirects both
       name and key to the operator's Secret. */}}
{{- $candidates := list
  (dict "key" "agentgateway" "gate" (eq (include "neuraltrust-platform.product.enabled" (dict "ctx" . "product" "trustgate")) "true") "writer" true "secret" "agentgateway-secrets" "defaultKey" "DB_PASSWORD")
  (dict "key" "trustguard" "gate" (eq (include "neuraltrust-platform.product.enabled" (dict "ctx" . "product" "trustguard")) "true") "writer" true "secret" "trustguard-secrets" "defaultKey" "DB_PASSWORD")
  (dict "key" "alertengine" "gate" (and $isExternal $aeEnabled) "secret" "alertengine-secrets" "defaultKey" "DB_PASSWORD")
  (dict "key" "datacore" "gate" $isExternal "secret" "datacore-secrets" "defaultKey" "POSTGRES_PASSWORD")
}}
{{- $services := list }}
{{- $passwords := list }}
{{- range $c := $candidates }}
  {{- $vals := default dict (index $.Values $c.key) }}
  {{- $db := default dict $vals.database }}
  {{- $role := "" }}
  {{- $name := "" }}
  {{- if $c.writer }}
    {{- $role = include "neuraltrust-platform.v2.writerUser" (dict "ctx" $ "explicit" $db.user "default" $c.key) }}
    {{- $name = include "neuraltrust-platform.v2.dbName" (dict "ctx" $ "explicit" $db.name "external" $c.key) }}
  {{- else }}
    {{- $role = $db.user | default $c.key }}
    {{- $name = $db.name | default $c.key }}
  {{- end }}
  {{- $ref := default dict $db.existingSecret }}
  {{- /* Skipped when: the service is not deployed; it authenticates with IAM and
         so has no password to set; or it shares the bootstrap role, which the
         image itself created (every hybrid service resolves to exactly that). */}}
  {{- $iam := eq (include "neuraltrust-platform.postgres.iamAuth" (dict "ctx" $ "database" $db)) "true" }}
  {{- if and $c.gate (not $iam) (ne $role $adminRole) }}
    {{- $services = append $services (dict
      "key" $c.key
      "role" $role
      "db" $name
      "env" (printf "%s_DB_PASSWORD" (upper $c.key))
      "secret" ($ref.name | default $c.secret)
      "secretKey" ($ref.key | default $c.defaultKey)
    ) }}
    {{- /* A password can change only when it is set in values or kept in a Secret
           the operator owns; one the chart generated is reused for good
           (resolveSecret). Only those two can, so only they are hashed. */}}
    {{- $current := "" }}
    {{- if $ref.name }}
      {{- $current = include "neuraltrust-platform.postgresql.bootstrapJob.secretValue" (dict "ctx" $ "name" $ref.name "key" ($ref.key | default $c.defaultKey)) }}
    {{- end }}
    {{- $passwords = append $passwords (printf "%s=%s%s" $c.key ($db.password | default "" | toString) $current | sha256sum) }}
  {{- end }}
{{- end }}
{{- /* What its name hashes: everything the Job sets up, and everything that
       shapes its pod. Change any of it and the next apply runs a new Job;
       change none and the completed one is left alone. The pod template of a
       Job cannot change in place, so a pod-shaping input left out would fail
       the upgrade instead. The chart version stands for the script and the
       template itself: a new chart runs it once more, which is harmless. */}}
{{- $operatorSecrets := list }}
{{- if $managed }}
  {{- $operatorSecrets = append $operatorSecrets (include "neuraltrust-platform.postgresql.bootstrapJob.secretValue" (dict "ctx" . "name" $mbAdmin.name "key" ($mbAdmin.passwordKey | default "password"))) }}
{{- end }}
{{- if eq (include "neuraltrust-platform.postgresql.passwordIsExternal" .) "true" }}
  {{- $operatorSecrets = append $operatorSecrets (include "neuraltrust-platform.postgresql.bootstrapJob.secretValue" (dict "ctx" . "name" $cpSecret "key" $cpKey)) }}
{{- end }}
{{- $inputs := dict
  "services" $services "passwords" $passwords "operatorSecrets" (toJson $operatorSecrets | sha256sum)
  "managed" $managed "admin" $mbAdmin "adminDatabase" ($mb.adminDatabase | default "")
  "controlPlane" (list $cpSecret $cpKey) "image" (list $img.repository $img.tag)
  "host" (include "neuraltrust-platform.v2.hybridPg.host" .) "port" ($service.port | default 5432)
  "chart" .Chart.Version "postgresql" (toJson $pg | sha256sum)
  "pod" (list
    (include "neuraltrust-platform.postgresql.imagePullSecrets" .)
    (include "neuraltrust-platform.nodeSelector" (dict "ctx" .))
    (include "neuraltrust-platform.tolerations" (dict "ctx" .))
    (include "neuraltrust-platform.image" (dict "repository" $img.repository "tag" $img.tag "global" .Values.global))
    (include "neuraltrust-platform.isOpenshift" .))
}}
{{- $jobName = printf "%s-%s" $jobName (toJson $inputs | sha256sum | trunc 10) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $jobName }}
  labels:
    app: {{ $appLabel }}
{{- /* No ttlSecondsAfterFinished: the Job belongs to the release, so a TTL would
       delete it and the next upgrade would create it again and re-run it.
       Kept after it finishes, succeeded or not, because "which roles did it
       create" is the first question asked after an install; the next change
       to its inputs replaces it.
       backoffLimit covers the PostgreSQL pod, which starts in the same apply
       and may wait for a node: each attempt waits five minutes for it. */}}
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: {{ $appLabel }}
    spec:
      restartPolicy: Never
      {{- if not (include "neuraltrust-platform.isOpenshift" .) }}
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
      {{- end }}
      {{- include "neuraltrust-platform.postgresql.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: bootstrap
          image: {{ include "neuraltrust-platform.image" (dict "repository" $img.repository "tag" $img.tag "global" .Values.global) | quote }}
          imagePullPolicy: {{ $img.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            {{- if not (include "neuraltrust-platform.isOpenshift" .) }}
            runAsUser: 999
            runAsGroup: 999
            {{- end }}
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/sh
            - -c
            - |
              set -e

              log() { printf '%s\n' "$*"; }

              if [ -z "${PGPASSWORD:-}" ] || [ -z "${PGUSER:-}" ]; then
              {{- if $managed }}
                log "ERROR: Secret {{ $mbAdmin.name }} is missing the admin login (keys {{ $mbAdmin.usernameKey | default "username" }} and {{ $mbAdmin.passwordKey | default "password" }})."
                log "       Create it in this namespace with a login that can create roles and databases."
              {{- else }}
                log "ERROR: postgresql-secrets is missing POSTGRES_USER or POSTGRES_PASSWORD."
                log "       With autoGenerateSecrets=false or preserveExistingSecrets=true the"
                log "       chart writes no Secret, so pre-create postgresql-secrets before installing."
              {{- end }}
                exit 1
              fi

              log "Waiting for PostgreSQL at ${PGHOST}:${PGPORT} as \"${PGUSER}\"..."
              ATTEMPT=0
              until psql -X -tAc 'SELECT 1' >/dev/null 2>&1; do
                ATTEMPT=$((ATTEMPT + 1))
                if [ "${ATTEMPT}" -ge 100 ]; then
                  log "ERROR: no authenticated connection after $((ATTEMPT * 3))s."
                {{- if $managed }}
                  log "       Check the host, port and sslMode in global.postgresql, that this"
                  log "       namespace can reach the instance, and the admin login in {{ $mbAdmin.name }}."
                {{- else }}
                  log "       If the data directory outlived the Secret, the stored password is"
                  log "       no longer POSTGRES_PASSWORD — the image applies that only when it"
                  log "       initialises an empty directory. Reset the role from inside the"
                  log "       PostgreSQL pod, or restore the Secret it was initialised with."
                {{- end }}
                  exit 1
                fi
                [ $((ATTEMPT % 10)) -eq 0 ] && log "  still waiting (attempt ${ATTEMPT})..."
                sleep 3
              done
              log "Connected."

              q() { psql -X -q -v ON_ERROR_STOP=1 "$@"; }

              # Names and passwords reach the server as psql variables, never pasted
              # into SQL text: :"x" as a quoted identifier, :'x' as a literal. They
              # only interpolate when the statement arrives on stdin — psql hands a
              # -c string to the server untouched — hence the here-documents.
              role_exists() {
                FOUND="$(psql -X -tA -v r="$1" 2>/dev/null <<'SQL'
              SELECT 1 FROM pg_roles WHERE rolname = :'r';
              SQL
                )"
                [ "${FOUND}" = "1" ]
              }

              db_exists() {
                FOUND="$(psql -X -tA -v d="$1" 2>/dev/null <<'SQL'
              SELECT 1 FROM pg_database WHERE datname = :'d';
              SQL
                )"
                [ "${FOUND}" = "1" ]
              }

              # Create the database when absent, otherwise leave its contents alone
              # and only converge ownership and grants. Owning it is what lets the
              # service run its own migrations, including on PostgreSQL 15+ where
              # the public schema no longer grants CREATE to everyone.
              ensure_database() {
                DB="$1"; ROLE="$2"
              {{- if $managed }}
                # A managed instance's admin is not a superuser: it can make a
                # role own a database only while it holds that role itself.
                HELD=""
                if [ "${ROLE}" != "${PGUSER}" ]; then
                  q -v r="${ROLE}" <<'SQL'
              GRANT :"r" TO CURRENT_USER;
              SQL
                  HELD=1
                fi
              {{- end }}
                if db_exists "${DB}"; then
                  q -v d="${DB}" -v r="${ROLE}" <<'SQL'
              ALTER DATABASE :"d" OWNER TO :"r";
              SQL
                  log "  database \"${DB}\" already present, owner is \"${ROLE}\""
                else
                  q -v d="${DB}" -v r="${ROLE}" <<'SQL'
              CREATE DATABASE :"d" OWNER :"r";
              SQL
                  log "  created database \"${DB}\" owned by \"${ROLE}\""
                fi
                q -v d="${DB}" -v r="${ROLE}" <<'SQL'
              GRANT ALL PRIVILEGES ON DATABASE :"d" TO :"r";
              SQL
                q -d "${DB}" -v r="${ROLE}" <<'SQL'
              GRANT ALL ON SCHEMA public TO :"r";
              SQL
              {{- if $managed }}
                # pgcrypto and the like are trusted extensions: the database owner
                # may create them, the admin may not. Hence SET ROLE to the owner,
                # while the admin still holds it.
                for EXT in ${EXTENSIONS}; do
                  if q -d "${DB}" -v r="${ROLE}" -v e="${EXT}" >/dev/null 2>&1 <<'SQL'
              SET ROLE :"r";
              CREATE EXTENSION IF NOT EXISTS :"e";
              SQL
                  then
                    log "  extension ${EXT} present in \"${DB}\""
                  else
                    log "  WARNING: could not create extension ${EXT} in \"${DB}\". On Azure, allow-list it"
                    log "           in the server parameter azure.extensions; elsewhere, check it is installed."
                    NOEXT="${NOEXT} ${DB}/${EXT}"
                  fi
                done
                if [ -n "${HELD}" ]; then
                  q -v r="${ROLE}" <<'SQL'
              REVOKE :"r" FROM CURRENT_USER;
              SQL
                fi
              {{- end }}
              }

              # The password arrives as the NAME of an env var, so it is never a
              # process argument and never reaches a log line.
              bootstrap_service() {
                LABEL="$1"; ROLE="$2"; DB="$3"; PW="$(printenv "$4" || true)"
              {{- if $managed }}
                if [ "${ROLE}" = "${PGUSER}" ]; then
                  log "${LABEL}: role \"${ROLE}\" is the admin login itself; left as it is."
                  ensure_database "${DB}" "${ROLE}"
                  return 0
                fi
              {{- end }}
                if [ -z "${PW}" ]; then
                  log "${LABEL}: no password in ${5} (key ${6}); skipping. The service cannot connect until its role exists."
                  SKIPPED="${SKIPPED} ${LABEL}"
                  return 0
                fi
                if role_exists "${ROLE}"; then
                  q -v r="${ROLE}" -v p="${PW}" <<'SQL'
              ALTER ROLE :"r" WITH LOGIN PASSWORD :'p';
              SQL
                  log "${LABEL}: role \"${ROLE}\" already present, password re-aligned"
                else
                  q -v r="${ROLE}" -v p="${PW}" <<'SQL'
              CREATE ROLE :"r" WITH LOGIN PASSWORD :'p';
              SQL
                  log "${LABEL}: created role \"${ROLE}\""
                fi
                ensure_database "${DB}" "${ROLE}"
              }

              SKIPPED=""
              {{- if $managed }}
              NOEXT=""
              # Extensions the services' migrations expect, created in every
              # database. A failure is reported, not fatal: the service that needs
              # one says so when it migrates.
              EXTENSIONS="{{ join " " ($mb.extensions | default list) }}"

              # Nothing created the control-plane pair on a managed instance, so it
              # is a service like the others, with the password the API reads.
              bootstrap_service "control-plane" {{ $adminRole | quote }} {{ $adminDb | quote }} "CONTROL_PLANE_DB_PASSWORD" {{ $cpSecret | quote }} {{ $cpKey | quote }}
              {{- else }}

              # The bootstrap pair the image created. Ensured here too so a data
              # directory that predates a change to global.postgresql.database, or
              # one restored from elsewhere, still ends up with it.
              CONTROL_PLANE_DB="${CONTROL_PLANE_DB:-{{ $adminDb }}}"
              log "control plane: role \"${PGUSER}\", database \"${CONTROL_PLANE_DB}\""
              ensure_database "${CONTROL_PLANE_DB}" "${PGUSER}"
              {{- end }}
              {{ range $s := $services }}
              bootstrap_service {{ $s.key | quote }} {{ $s.role | quote }} {{ $s.db | quote }} {{ $s.env | quote }} {{ $s.secret | quote }} {{ $s.secretKey | quote }}
              {{- end }}

              {{- if $managed }}
              [ -n "${NOEXT}" ] && SKIPPED="${SKIPPED} extensions:${NOEXT}"
              {{- end }}

              if [ -n "${SKIPPED}" ]; then
                log "Done, without:${SKIPPED}"
              else
                log "Done."
              fi
          env:
            {{- if $managed }}
            - name: PGHOST
              value: {{ include "neuraltrust-platform.v2.hybridPg.host" . | quote }}
            - name: PGPORT
              value: {{ include "neuraltrust-platform.v2.hybridPg.port" . | quote }}
            - name: PGSSLMODE
              value: {{ include "neuraltrust-platform.v2.hybridPg.sslMode" . | quote }}
            - name: PGDATABASE
              value: {{ $mb.adminDatabase | default "postgres" | quote }}
            - name: PGCONNECT_TIMEOUT
              value: "5"
            - name: HOME
              value: "/tmp"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ $mbAdmin.name | quote }}
                  key: {{ $mbAdmin.usernameKey | default "username" | quote }}
                  optional: true
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $mbAdmin.name | quote }}
                  key: {{ $mbAdmin.passwordKey | default "password" | quote }}
                  optional: true
            - name: CONTROL_PLANE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $cpSecret | quote }}
                  key: {{ $cpKey | quote }}
                  optional: true
            {{- else }}
            - name: PGHOST
              value: "control-plane-postgresql"
            - name: PGPORT
              value: {{ $service.port | default 5432 | quote }}
            {{- /* Admin work happens on the always-present `postgres` database, so
                   the control-plane one can be created if it is somehow missing. */}}
            - name: PGDATABASE
              value: "postgres"
            - name: PGCONNECT_TIMEOUT
              value: "5"
            - name: HOME
              value: "/tmp"
            {{- /* optional, so a missing Secret produces the message above rather
                   than a pod stuck in CreateContainerConfigError. */}}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgresql-secrets
                  key: POSTGRES_USER
                  optional: true
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secrets
                  key: POSTGRES_PASSWORD
                  optional: true
            - name: CONTROL_PLANE_DB
              valueFrom:
                secretKeyRef:
                  name: postgresql-secrets
                  key: POSTGRES_DB
                  optional: true
            {{- end }}
            {{- range $s := $services }}
            - name: {{ $s.env }}
              valueFrom:
                secretKeyRef:
                  name: {{ $s.secret | quote }}
                  key: {{ $s.secretKey | quote }}
                  optional: true
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- if $job.resources }}
            {{- toYaml $job.resources | nindent 12 }}
            {{- else }}
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- include "neuraltrust-platform.nodeSelector" (dict "ctx" .) | nindent 6 }}
      {{- include "neuraltrust-platform.tolerations" (dict "ctx" .) | nindent 6 }}
{{- end }}
