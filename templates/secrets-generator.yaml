{{- /*
In-cluster secrets generator. See `neuraltrust-platform.secretsGenerator.active`
in templates/_secrets_generator.tpl for why the chart stopped rendering
generated values, and what this Job guarantees.

This file renders the umbrella's own contributions (the shared registry keys, the
in-cluster PostgreSQL admin password, the TrustGuard platform client secret) and
the Job that reads every contribution and writes the values. Subcharts render
their own contributions next to the Secret templates they replace.
*/ -}}
{{- if eq (include "neuraltrust-platform.secretsGenerator.active" .) "true" }}
{{- $target := include "neuraltrust-platform.secretsGenerator.name" . }}
{{- $adoptable := splitList " " (include "neuraltrust-platform.secretsGenerator.adoptable" .) }}

{{- /* 1. Registry keys, when consumers read them from the generated Secret. */}}
{{- if eq (include "neuraltrust-platform.platformSecret.name" .) $target }}
{{- $registry := fromYaml (include "neuraltrust-platform.platformSecret.registry" .) }}
{{- $explicit := include "neuraltrust-platform.platformSecret.explicit" . | fromYaml }}
{{- $shapes := splitList " " (include "neuraltrust-platform.platformSecret.shapes" .) }}
{{- $entries := list }}
{{- $pins := dict }}
{{- range $key := (keys $registry | sortAlpha) }}
  {{- $entry := index $registry $key }}
  {{- /* As in shared-platform-secret.yaml: an alias holds its target's value, so
         a pin on the alias could never be honoured. */}}
  {{- if and $entry.aliasOf (hasKey $explicit $key) }}
    {{- fail (printf "global.platformSecret.values.%s: %s must equal %s, so pin %s instead" $key $key $entry.aliasOf $entry.aliasOf) }}
  {{- end }}
  {{- $wanted := false }}
  {{- range $shape := (splitList " " ($entry.requires | default "external")) }}
    {{- if has $shape $shapes }}{{- $wanted = true }}{{- end }}
  {{- end }}
  {{- $adopt := list (list "platform-secrets" $key) }}
  {{- if has $entry.legacyName $adoptable }}
    {{- $adopt = append $adopt (list $entry.legacyName $entry.legacyKey) }}
  {{- end }}
  {{- /* Only the credentials this install's services read, as the rendered
         Secret did. A product switched on later adopts its key back from the
         Secrets the chart kept it in. */}}
  {{- if $wanted }}
  {{- $gen := $entry.generate | default "adopt" }}
  {{- $spec := dict "key" $key "adopt" $adopt }}
  {{- if $entry.aliasOf }}
    {{- $spec = dict "key" $key "type" "alias" "source" $entry.aliasOf }}
  {{- else if eq $gen "random" }}
    {{- $_ := set $spec "type" "alnum" }}
    {{- $_ := set $spec "length" ($entry.length | default 64 | int) }}
  {{- else if eq $gen "install" }}
    {{- /* Generated only on a fresh install: an install running on the app's
           built-in default has already encrypted data with it. */}}
    {{- $_ := set $spec "type" "install" }}
    {{- $_ := set $spec "length" ($entry.length | default 64 | int) }}
    {{- $_ := set $spec "freshIf" (list "platform-secrets" $entry.legacyName) }}
  {{- else if eq $gen "rsa" }}
    {{- $_ := set $spec "type" "rsa-pkcs1" }}
  {{- else }}
    {{- $_ := set $spec "type" "adopt" }}
  {{- end }}
  {{- if and (not $entry.aliasOf) (hasKey $explicit $key) }}
    {{- $_ := set $pins $key (index $explicit $key) }}
  {{- end }}
  {{- $entries = append $entries $spec }}
  {{- end }}
{{- end }}
{{- include "neuraltrust-platform.secretsGenerator.specObjects" (dict "ctx" . "component" "platform" "entries" $entries "pins" $pins) }}
{{- end }}

{{- /* 2. The in-cluster PostgreSQL admin password. */}}
{{- if eq (include "neuraltrust-platform.postgresql.generatedAdmin" .) "true" }}
{{- $globalPg := default dict (default dict .Values.global).postgresql }}
{{- $cpApiPg := default dict (default dict (default dict (default dict (index .Values "control-plane-api")).controlPlane).components).postgresql }}
{{- $pinned := $globalPg.password | default (default dict $cpApiPg.secrets).password | default "" | toString }}
{{- $entries := list (dict "key" "POSTGRES_PASSWORD" "type" "alnum" "length" 32 "adopt" (list (list "postgresql-secrets" "POSTGRES_PASSWORD"))) }}
{{- $pins := dict }}
{{- if $pinned }}{{- $_ := set $pins "POSTGRES_PASSWORD" $pinned }}{{- end }}
{{- include "neuraltrust-platform.secretsGenerator.specObjects" (dict "ctx" . "component" "postgresql" "entries" $entries "pins" $pins) }}
{{- end }}

{{- /* 3. The TrustGuard platform client secret, shared by TrustGuard and TrustGate. */}}
{{- if eq (include "neuraltrust-platform.trustguardClient.generated" .) "true" }}
{{- $v2 := default dict (default dict .Values.global).v2 }}
{{- $entries := list (dict "key" "TRUSTGUARD_CLIENT_SECRET" "type" "alnum" "length" 48 "adopt" (list (list "trustguard-client-credentials" "CLIENT_SECRET") (list "v2-trustguard-client-secret" "CLIENT_SECRET"))) }}
{{- $pins := dict }}
{{- if $v2.trustguardClientSecret }}{{- $_ := set $pins "TRUSTGUARD_CLIENT_SECRET" $v2.trustguardClientSecret }}{{- end }}
{{- include "neuraltrust-platform.secretsGenerator.specObjects" (dict "ctx" . "component" "trustguard-client" "entries" $entries "pins" $pins) }}
{{- end }}

{{- /* The Job. Same shape as the keygen hooks (templates/_keygen.tpl): the app
       image, which carries Node and the openssl CLI, so an install that mirrors
       images has nothing new to mirror; the API server reached through the
       projected service-account token; RBAC scoped to named objects. */}}
{{- $saName := printf "%s-secrets-generator" (include "neuraltrust-platform.name" .) }}
{{- $components := splitList " " (include "neuraltrust-platform.secretsGenerator.components" .) }}
{{- $generated := list $target }}
{{- range $id := splitList " " (include "neuraltrust-platform.secretsGenerator.tlsIds" .) }}
  {{- $generated = append $generated (include "neuraltrust-platform.secretsGenerator.tlsName" (dict "id" $id)) }}
{{- end }}
{{- $specNames := list }}
{{- $pinNames := list }}
{{- range $c := $components }}
  {{- $specNames = append $specNames (printf "neuraltrust-generator-spec-%s" $c) }}
  {{- $pinNames = append $pinNames (printf "neuraltrust-generator-pins-%s" $c) }}
{{- end }}
{{- $cpApp := default dict (index .Values "control-plane-app") }}
{{- $cp := default dict $cpApp.controlPlane }}
{{- $appImage := default dict (default dict (default dict $cp.components).app).image }}
{{- $repo := $appImage.repository | default "europe-west1-docker.pkg.dev/neuraltrust-app-prod/nt-docker/app" }}
{{- $appTag := $appImage.tag | default "v2.18.1" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-15"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/name: {{ include "neuraltrust-platform.name" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: secrets-generator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $saName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-15"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/name: {{ include "neuraltrust-platform.name" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: secrets-generator
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: {{ toJson $specNames }}
    verbs: ["get", "delete"]
  {{- /* Reads the pins and the Secrets the chart rendered values into before, to
         adopt them; reads and patches only the Secrets it generates. */}}
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: {{ toJson (concat $pinNames $adoptable (list "v2-trustguard-client-secret") $generated) }}
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: {{ toJson $generated }}
    verbs: ["patch"]
  {{- /* Spec objects an earlier chart left behind (see secretsGenerator.specObjects). */}}
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: {{ toJson $pinNames }}
    verbs: ["delete"]
  {{- /* RBAC cannot scope `create` by name, since the object does not exist yet.
         The Job only ever creates the Secrets named above, and the Role is
         deleted once the hook succeeds. */}}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $saName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-15"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/name: {{ include "neuraltrust-platform.name" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: secrets-generator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $saName }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $saName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/name: {{ include "neuraltrust-platform.name" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: secrets-generator
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "neuraltrust-platform.name" . }}
        app.kubernetes.io/component: secrets-generator
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $saName }}
      {{- include "neuraltrust-platform.controlPlane.imagePullSecrets" (dict "root" $cpApp "global" (.Values.global | default dict)) | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: generate
          image: {{ include "neuraltrust-platform.image" (dict "repository" $repo "tag" $appTag "global" .Values.global) | quote }}
          imagePullPolicy: {{ $appImage.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: GENERATED_SECRET
              value: {{ $target | quote }}
            - name: SPEC_COMPONENTS
              value: {{ join " " $components | quote }}
            - name: SPEC_LABEL
              value: {{ include "neuraltrust-platform.secretsGenerator.specLabel" . | quote }}
            - name: SPEC_FORMAT
              value: {{ include "neuraltrust-platform.secretsGenerator.specFormat" . | quote }}
            - name: HOME
              value: /tmp
            {{- /* Node's TLS trusts the API server through the projected CA. */}}
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          command:
            - node
            - -e
            - |
{{ include "neuraltrust-platform.secretsGenerator.script" . | indent 14 }}
{{- end }}
