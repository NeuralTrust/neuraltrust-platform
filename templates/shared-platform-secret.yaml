{{- /*
Shared platform Secret — one home for every cross-service application
credential. Replaces the hand-duplicated per-service copies that drifted apart
and caused silent auth failures (control-plane-app alone used to reach into
seven different Secrets to build its env).

Resolution order per key, so an upgrade adopts live values instead of rotating
them:
  1. explicit value in values (global.platformSecret.values.<KEY>, or the
     per-service value path the key had before consolidation)
  2. existing `platform-secrets` key
  3. existing legacy per-service Secret key — the migration step
  4. generate (only for keys the chart owns; `adopt` keys are omitted instead,
     and `install` keys generate on a fresh install but never on an upgrade)

Not rendered when the operator owns the Secret
(global.platformSecret.existingSecret.name), when the shared Secret is disabled,
under global.preserveExistingSecrets, or with autoGenerateSecrets=false. All of
those cases are decided in one place — `neuraltrust-platform.platformSecret.name`
returns a name only when the chart itself renders this Secret, so consumers and
this template can never disagree about whether it exists.
*/}}
{{- $sharedName := include "neuraltrust-platform.platformSecret.name" . -}}
{{- if eq $sharedName "platform-secrets" }}
{{- $registry := fromYaml (include "neuraltrust-platform.platformSecret.registry" .) }}
{{- $existingShared := lookup "v1" "Secret" .Release.Namespace "platform-secrets" }}

{{- /* Per-service value paths that fed the legacy Secrets, kept working so an
       operator who pinned a credential in values still gets it. */}}
{{- $ag := default dict (index .Values "agentgateway") }}
{{- $tg := default dict (index .Values "trustguard") }}
{{- $ae := default dict (index .Values "alertengine") }}
{{- $tl := default dict (index .Values "trustlens") }}
{{- $fwSecrets := default dict (default dict (default dict .Values.firewall).firewall).secrets }}
{{- $dpSecrets := default dict (default dict (default dict (index .Values "data-plane-api")).dataPlane).secrets }}
{{- $cpApiSecrets := default dict (default dict (default dict (index .Values "control-plane-api")).controlPlane).secrets }}
{{- $cpAppSecrets := default dict (default dict (default dict (index .Values "control-plane-app")).controlPlane).secrets }}
{{- $cp := merge (deepCopy $cpApiSecrets) $cpAppSecrets }}
{{- $candidates := dict
  "SERVER_SECRET_KEY" ($ag.serverSecretKey | default "")
  "ADMIN_JWT_SECRET" ($tg.adminJwtSecret | default "")
  "TRUSTGUARD_TOKEN_SIGNING_SECRET" ($tg.tokenSigningSecret | default "")
  "REDIS_EVENTS_SECRET" ($tg.redisEventsSecret | default "")
  "AUTH_JWT_SECRET" ($ae.authJwtSecret | default "")
  "APP_ENCRYPTION_KEY" ($ae.appEncryptionKey | default "")
  "TRUSTLENS_JWT_SECRET" ($tl.jwtSecret | default "")
  "ENCRYPTION_KEYSET" ($tl.encryptionKeyset | default "")
  "JWT_SECRET" ($fwSecrets.jwtSecret | default "")
  "DATA_PLANE_JWT_SECRET" ($dpSecrets.dataPlaneJWTSecret | default "")
  "CONTROL_PLANE_JWT_SECRET" ($cp.controlPlaneJWTSecret | default "")
  "AUTH_SECRET" ($cp.authSecret | default "")
  "MODEL_SCANNER_SECRET" ($cp.modelScannerSecret | default "")
}}
{{- /* Direct escape hatch, highest precedence. */}}
{{- range $k, $v := (default dict (default dict (default dict .Values.global).platformSecret).values) }}
  {{- $_ := set $candidates $k $v }}
{{- end }}
{{- /* Several of the per-service paths above accept either a plain credential or
       a `{secretName, secretKey}` map pointing at an operator Secret. Only a
       scalar is a value we can store, and b64enc aborts the whole render on a
       map or list, so those shapes are treated as "not pinned here". A numeric
       credential still works: `--set` yields an int, not a string. */}}
{{- $explicit := dict }}
{{- range $k, $v := $candidates }}
  {{- if and $v (not (kindIs "map" $v)) (not (kindIs "slice" $v)) }}
    {{- $_ := set $explicit $k ($v | toString) }}
  {{- end }}
{{- end }}

{{- /* Which install shapes are in play, so a hybrid install only carries the
       credentials its in-cluster services read. A key already present in the
       live Secret is kept regardless, so upgrades never drop one. */}}
{{- $shapes := list }}
{{- if eq (include "neuraltrust-platform.isExternal" .) "true" }}
  {{- $shapes = append $shapes "external" }}
{{- end }}
{{- range $product := list "trustgate" "trustguard" "dataPlane" }}
  {{- if eq (include "neuraltrust-platform.product.enabled" (dict "ctx" $ "product" $product)) "true" }}
    {{- $shapes = append $shapes $product }}
  {{- end }}
{{- end }}
{{- /* TrustLens is opt-in in both modes, and `product.enabled` reports every
       product as on in external, so its keys follow the subchart flag. */}}
{{- if (default dict .Values.trustlens).enabled }}
  {{- $shapes = append $shapes "trustlens" }}
{{- end }}
{{- /* MCP OAuth is external-only: the authorization server is the control-plane
       app, which hybrid does not deploy. It also stays off until a signing key
       exists, so an install never carries a client secret for a feature the app
       cannot actually serve across replicas — generating a credential no workload
       can use is exactly the unused copy this Secret exists to avoid. */}}
{{- if eq (include "neuraltrust-platform.mcpOAuth.enabled" .) "true" }}
  {{- $shapes = append $shapes "mcpOAuth" }}
{{- end }}
{{- /* Watchdog usage export calls both the control-plane and data-plane APIs, so
       it needs their signing keys even in a hybrid install that hosts neither. */}}
{{- $wd := default dict .Values.watchdog }}
{{- if and $wd.enabled (default dict $wd.usageExport).enabled }}
  {{- $shapes = append $shapes "watchdog" }}
{{- end }}

{{- /* One lookup per distinct legacy Secret. */}}
{{- $legacy := dict }}
{{- range $key, $entry := $registry }}
  {{- if not (hasKey $legacy $entry.legacyName) }}
    {{- $_ := set $legacy $entry.legacyName (lookup "v1" "Secret" $.Release.Namespace $entry.legacyName) }}
  {{- end }}
{{- end }}

{{- /* Keys this install needs, plus every key the live Secret already holds. */}}
{{- $wanted := dict }}
{{- range $key, $entry := $registry }}
  {{- $keep := false }}
  {{- range $shape := (splitList " " ($entry.requires | default "external")) }}
    {{- if has $shape $shapes }}{{- $keep = true }}{{- end }}
  {{- end }}
  {{- if and (not $keep) $existingShared $existingShared.data (hasKey $existingShared.data $key) }}
    {{- $keep = true }}
  {{- end }}
  {{- if $keep }}{{- $_ := set $wanted $key true }}{{- end }}
{{- end }}

{{- /* Pass 1: keys that resolve on their own. */}}
{{- $resolved := dict }}
{{- range $key, $entry := $registry }}
  {{- if and (not $entry.aliasOf) (hasKey $wanted $key) }}
    {{- $value := (index $explicit $key) | default "" }}
    {{- if not $value }}
      {{- if and $existingShared $existingShared.data (hasKey $existingShared.data $key) }}
        {{- $value = index $existingShared.data $key | b64dec }}
      {{- end }}
    {{- end }}
    {{- if not $value }}
      {{- $src := index $legacy $entry.legacyName }}
      {{- if and $src $src.data (hasKey $src.data $entry.legacyKey) }}
        {{- $value = index $src.data $entry.legacyKey | b64dec }}
      {{- end }}
    {{- end }}
    {{- $gen := $entry.generate | default "adopt" }}
    {{- /* `install` generates on a fresh install but never on an upgrade. The key
           it exists for has an application-side default, and an install running
           on that default has already encrypted data with it — handing the app a
           new value on upgrade would make those rows undecryptable. Leaving the
           key absent keeps the app on its default until an operator pins one. */}}
    {{- if and (not $value) (or (eq $gen "random") (and (eq $gen "install") $.Release.IsInstall)) }}
      {{- $value = randAlphaNum ($entry.length | default 64 | int) }}
    {{- end }}
    {{- if $value }}{{- $_ := set $resolved $key $value }}{{- end }}
  {{- end }}
{{- end }}

{{- /* Pass 2: aliases mirror their target so the invariant holds on install. */}}
{{- range $key, $entry := $registry }}
  {{- if $entry.aliasOf }}
    {{- /* An alias exists precisely because the two names must hold one value.
           Pinning the alias instead of its target would quietly break that, so
           say so rather than discarding the pin. */}}
    {{- if hasKey $explicit $key }}
      {{- fail (printf "global.platformSecret.values.%s: %s must equal %s, so pin %s instead" $key $key $entry.aliasOf $entry.aliasOf) }}
    {{- end }}
  {{- end }}
  {{- if and $entry.aliasOf (hasKey $wanted $key) }}
    {{- $target := index $resolved $entry.aliasOf | default "" }}
    {{- /* The alias is in `$wanted` either because its shape is in play or
           because the live Secret already carries it. In that second case the
           target may be absent entirely, and mirroring nothing would drop a key
           the install already depends on. */}}
    {{- if and (not $target) $existingShared $existingShared.data (hasKey $existingShared.data $key) }}
      {{- $target = index $existingShared.data $key | b64dec }}
    {{- end }}
    {{- if $target }}{{- $_ := set $resolved $key $target }}{{- end }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $sharedName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    app.kubernetes.io/name: {{ include "neuraltrust-platform.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: platform
type: Opaque
data:
  {{- range $key := (keys $resolved | sortAlpha) }}
  {{ $key }}: {{ index $resolved $key | b64enc }}
  {{- end }}
{{- end }}
