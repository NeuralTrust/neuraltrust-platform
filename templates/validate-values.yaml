{{- /*
Fail early for unsupported topology values. This template intentionally emits
no Kubernetes resource when validation succeeds.
*/ -}}
{{- $global := default dict .Values.global -}}
{{- $mode := $global.deploymentMode | default "hybrid" -}}
{{- if not (has $mode (list "hybrid" "external")) -}}
  {{- fail (printf "global.deploymentMode must be one of: hybrid, external (got %q)" $mode) -}}
{{- end -}}

{{- $products := default dict $global.products -}}
{{- range $name, $enabled := $products -}}
  {{- if not (has $name (list "trustgate" "trustguard" "dataPlane")) -}}
    {{- fail (printf "global.products supports only trustgate, trustguard, and dataPlane (got %q)" $name) -}}
  {{- end -}}
  {{- if not (kindIs "bool" $enabled) -}}
    {{- fail (printf "global.products.%s must be a boolean" $name) -}}
  {{- end -}}
{{- end -}}
{{- if eq $mode "hybrid" -}}
  {{- $anyProduct := or
    (eq (include "neuraltrust-platform.product.enabled" (dict "ctx" . "product" "trustgate")) "true")
    (eq (include "neuraltrust-platform.product.enabled" (dict "ctx" . "product" "trustguard")) "true")
    (eq (include "neuraltrust-platform.product.enabled" (dict "ctx" . "product" "dataPlane")) "true")
  -}}
  {{- if not $anyProduct -}}
    {{- fail "v2 hybrid requires at least one product: set global.products.trustgate, global.products.trustguard, and/or global.products.dataPlane to true. External mode ignores these flags and always deploys the full stack." -}}
  {{- end -}}
{{- end -}}

{{- /* MCP OAuth needs the control-plane app as its authorization server, and that
       app only exists in external mode — a hybrid install talks to the hosted
       platform instead. Enabling it in hybrid would point TrustGate at an issuer
       nobody serves in the cluster and generate a client secret the hosted side
       has never seen, so refuse instead of wiring a login that cannot complete. */ -}}
{{- /* Read through the intent helper, not the raw value: a string-typed `enabled`
       (what Flux valuesFrom and Helmfile produce) is truthy either way, so a plain
       truthiness test here would reject a hybrid install for turning the feature
       OFF while the gate helper read the same value as disabled. */ -}}
{{- if and (eq (include "neuraltrust-platform.mcpOAuth.intent" .) "on") (ne $mode "external") -}}
  {{- fail "global.mcpOAuth.enabled requires global.deploymentMode=external: the MCP OAuth authorization server is the control-plane app, which a hybrid install does not deploy." -}}
{{- end -}}

{{- /* The issuer is derived from global.domain as app.<domain>, because a subchart
       cannot read a sibling's values and both sides must agree on one string. An
       install that serves the app from somewhere else therefore advertises an
       issuer nobody serves, and since the feature is on by default the operator
       never opts into discovering that. Fail with the one-line fix rather than let
       JWKS fetches break at request time. */ -}}
{{- if eq (include "neuraltrust-platform.mcpOAuth.enabled" .) "true" -}}
  {{- $appValues := default dict (index .Values "control-plane-app") -}}
  {{- $appComponent := default dict (default dict (default dict $appValues.controlPlane).components).app -}}
  {{- $customHost := or ($appComponent.host | default "") (and $appComponent.hostPrefix (ne $appComponent.hostPrefix "app")) -}}
  {{- if and $customHost (not (default dict $global.mcpOAuth).issuer) -}}
    {{- fail "MCP OAuth derives its issuer from global.domain as app.<domain>, but this install serves the control-plane app from a different host, so the issuer would point somewhere that serves no JWKS and every MCP login would fail. Set global.mcpOAuth.issuer to the app's real public URL plus /api/mcp/oauth, or set global.mcpOAuth.enabled=false." -}}
  {{- end -}}
{{- end -}}

{{- $trustlens := default dict .Values.trustlens -}}
{{- $trustlensImage := default dict $trustlens.image -}}
{{- if and ($trustlens.enabled | default false) (not ($trustlensImage.tag | default "")) -}}
  {{- fail "trustlens.image.tag is required when trustlens.enabled=true; no default TrustLens release image is published yet." -}}
{{- end -}}

{{- /* Outbound email. A provider selected without its required settings would
       leave the app silently unable to send, so fail at render time instead. */ -}}
{{- $email := default dict $global.email -}}
{{- $emailProvider := $email.provider | default "resend" -}}
{{- if not (has $emailProvider (list "resend" "ses" "smtp")) -}}
  {{- fail (printf "global.email.provider must be one of: resend, ses, smtp (got %q)" $emailProvider) -}}
{{- end -}}
{{- if eq $emailProvider "ses" -}}
  {{- $ses := default dict $email.ses -}}
  {{- if not ($ses.region | default "") -}}
    {{- fail "global.email.ses.region is required when global.email.provider=ses" -}}
  {{- end -}}
  {{- if and $ses.accessKeyId (not $ses.secretAccessKey) -}}
    {{- fail "global.email.ses.secretAccessKey is required when global.email.ses.accessKeyId is set (omit both to use the pod IAM role)" -}}
  {{- end -}}
{{- else if eq $emailProvider "smtp" -}}
  {{- $smtp := default dict $email.smtp -}}
  {{- if not ($smtp.host | default "") -}}
    {{- fail "global.email.smtp.host is required when global.email.provider=smtp" -}}
  {{- end -}}
  {{- if not ($smtp.port | default "") -}}
    {{- fail "global.email.smtp.port is required when global.email.provider=smtp" -}}
  {{- end -}}
  {{- if and $smtp.password (not ($smtp.user | default "")) -}}
    {{- fail "global.email.smtp.user is required when global.email.smtp.password is set" -}}
  {{- end -}}
  {{- if and ($smtp.user | default "") (not $smtp.password) (not (default dict $email.existingSecret).name) -}}
    {{- fail "global.email.smtp.user needs a password: set global.email.smtp.password or point global.email.existingSecret.name at a Secret holding it" -}}
  {{- end -}}
{{- end -}}
{{- /* An operator-supplied Secret cannot be filled in by the chart. */ -}}
{{- $emailExisting := default dict $email.existingSecret -}}
{{- if $emailExisting.name -}}
  {{- $inline := "" -}}
  {{- if (default dict $email.resend).apiKey -}}{{- $inline = "resend.apiKey" -}}{{- end -}}
  {{- if (default dict $email.smtp).password -}}{{- $inline = "smtp.password" -}}{{- end -}}
  {{- if (default dict $email.ses).accessKeyId -}}{{- $inline = "ses.accessKeyId" -}}{{- end -}}
  {{- if $inline -}}
    {{- fail (printf "global.email.existingSecret.name and global.email.%s are mutually exclusive; drop the inline credential" $inline) -}}
  {{- end -}}
{{- end -}}

{{- /* A cache password is meaningless against the Redis this chart deploys: it runs
       `redis-server --protected-mode no` with no `--requirepass`, so every consumer
       that inherits the password would get "Client sent AUTH, but no password is
       set". Only reject the unambiguous shape — deploying our own Redis and naming
       no host, so nothing can be pointing anywhere else. */ -}}
{{- $globalRedis := default dict $global.redis -}}
{{- $redisDeploy := true -}}
{{- if hasKey $globalRedis "deploy" -}}{{- $redisDeploy = $globalRedis.deploy -}}{{- end -}}
{{- if and ($globalRedis.password | default "") $redisDeploy (not ($globalRedis.host | default "")) -}}
  {{- fail "global.redis.password is set while the chart deploys its own Redis (global.redis.deploy=true) and global.redis.host is empty. That Redis runs without a password, so every service inheriting this one would fail to authenticate. Set global.redis.deploy=false and global.redis.host for a managed cache, or drop the password." -}}
{{- end -}}

{{- /* Same rule for datastore credentials (AUT-411): a pre-created Secret owns the
       credential, so an inline password alongside it would be silently ignored. */ -}}
{{- range $check := list
  (dict "path" "agentgateway.database" "values" (default dict (default dict $.Values.agentgateway).database))
  (dict "path" "agentgateway.redis" "values" (default dict (default dict $.Values.agentgateway).redis))
  (dict "path" "trustguard.database" "values" (default dict (default dict $.Values.trustguard).database))
  (dict "path" "trustguard.redis" "values" (default dict (default dict $.Values.trustguard).redis))
  (dict "path" "alertengine.database" "values" (default dict (default dict $.Values.alertengine).database))
  (dict "path" "datacore.database" "values" (default dict (default dict $.Values.datacore).database))
-}}
  {{- $ref := default dict $check.values.existingSecret -}}
  {{- if and $ref.name $check.values.password -}}
    {{- fail (printf "%s.existingSecret.name and %s.password are mutually exclusive; drop the inline credential (the pre-created Secret wins and the chart omits the key)" $check.path $check.path) -}}
  {{- end -}}
{{- end -}}

{{- /* The same hook for the control-plane role (AUT-413), which needs more guarding
       than the per-service ones because the chart used to compose connection
       strings out of this password. It can only be honoured where nothing reads a
       composed DSN. */ -}}
{{- $globalPg := default dict $global.postgresql -}}
{{- $pgPasswordRef := default dict $globalPg.passwordSecret -}}
{{- if $pgPasswordRef.name -}}
  {{- if $globalPg.password -}}
    {{- fail "global.postgresql.passwordSecret.name and global.postgresql.password are mutually exclusive; drop the inline credential (the pre-created Secret wins and the chart omits the key)" -}}
  {{- end -}}
  {{- /* The same password under its other name: platform-secrets.yaml and
         postgresql/secrets.yaml both accept this overlay, so leaving it out
         would let an inline credential be silently dropped. */ -}}
  {{- $apiPg := default dict (default dict (default dict (default dict (index $.Values "control-plane-api")).controlPlane).components).postgresql -}}
  {{- if (default dict $apiPg.secrets).password -}}
    {{- fail "global.postgresql.passwordSecret.name and control-plane-api.controlPlane.components.postgresql.secrets.password are mutually exclusive; drop the inline credential (the pre-created Secret wins and the chart omits the key)" -}}
  {{- end -}}
  {{- if (default dict $globalPg.existingSecret).name -}}
    {{- fail "global.postgresql.passwordSecret.name and global.postgresql.existingSecret.name are mutually exclusive. existingSecret hands the chart a whole Secret to inject as-is, so it already owns the password; passwordSecret keeps the chart writing every other key and takes only the credential from you." -}}
  {{- end -}}
  {{- if ne $mode "external" -}}
    {{- fail (printf "global.postgresql.passwordSecret is external-only, and this release is %s. Hybrid composes SENSIBLE_PG_DSN from this password for the TrustGate and TrustGuard telemetry exporters and for DataAgent, none of which can take the parts separately yet (RUN-1086, AUT-397)." $mode) -}}
  {{- end -}}
  {{- $pgDeploy := true -}}
  {{- if hasKey $globalPg "deploy" -}}{{- $pgDeploy = $globalPg.deploy -}}{{- end -}}
  {{- if $pgDeploy -}}
    {{- fail "global.postgresql.passwordSecret requires global.postgresql.deploy=false. The chart's own PostgreSQL is initialised from POSTGRES_PASSWORD in postgresql-secrets and the bootstrap Job authenticates with it, so the chart has to own that key when it runs the instance itself." -}}
  {{- end -}}
{{- end -}}

{{- $autoGenerate := true -}}
{{- if hasKey $global "autoGenerateSecrets" -}}{{- $autoGenerate = $global.autoGenerateSecrets -}}{{- end -}}
{{- $preserveExisting := false -}}
{{- if hasKey $global "preserveExistingSecrets" -}}{{- $preserveExisting = $global.preserveExistingSecrets -}}{{- end -}}
{{- if and (eq $mode "external") $preserveExisting -}}
  {{- $existingControlPlane := lookup "v1" "Secret" .Release.Namespace "control-plane-secrets" -}}
  {{- if and $existingControlPlane (kindIs "map" $existingControlPlane) $existingControlPlane.data -}}
    {{- if or (not (hasKey $existingControlPlane.data "AUTH_SECRET")) (not (hasKey $existingControlPlane.data "NEXTAUTH_SECRET")) -}}
      {{- fail "preserveExistingSecrets=true requires control-plane-secrets to contain both AUTH_SECRET and NEXTAUTH_SECRET before an external upgrade." -}}
    {{- end -}}
  {{- end -}}
{{- end -}}

{{- /* Config-sync is fail-closed for each enabled product. */ -}}
{{- range $component := list
  (dict "name" "agentgateway" "secretName" "agentgateway-secrets" "values" (default dict $.Values.agentgateway) "product" "trustgate")
  (dict "name" "trustguard" "secretName" "trustguard-secrets" "values" (default dict $.Values.trustguard) "product" "trustguard")
-}}
  {{- if eq (include "neuraltrust-platform.product.enabled" (dict "ctx" $ "product" $component.product)) "true" -}}
  {{- $configSync := default dict $component.values.configSync -}}
  {{- $existingRef := default dict $configSync.existingSecret -}}
  {{- $managedSecret := lookup "v1" "Secret" $.Release.Namespace $component.secretName -}}
  {{- $managedData := dict -}}
  {{- if and $managedSecret (kindIs "map" $managedSecret) $managedSecret.data -}}
    {{- $managedData = $managedSecret.data -}}
  {{- end -}}
  {{- /* Only the SaaS-issued token is operator-owned. CONFIG_SYNC_LKG_KEY
         encrypts a local snapshot cache and is generated by the chart, so it is
         deliberately not part of this gate. */ -}}
  {{- $hasManagedToken := and (hasKey $managedData "CONFIG_SYNC_TOKEN") (ne (index $managedData "CONFIG_SYNC_TOKEN") "") -}}
  {{- $inlineTokenUsable := and ($configSync.token | default "") $autoGenerate (not $preserveExisting) -}}
  {{- $configSyncOn := eq (include "neuraltrust-platform.configSync.enabledFrom" (dict "mode" $mode "configSync" $configSync)) "true" -}}
  {{- if and
    $configSyncOn
    (not $inlineTokenUsable)
    (not ($existingRef.name | default ""))
    (not $hasManagedToken)
  -}}
    {{- fail (printf "%s config-sync requires CONFIG_SYNC_TOKEN, the token issued to you by the NeuralTrust UI: set %s.configSync.existingSecret.name, or use %s.configSync.token only when chart Secret generation is enabled. The companion CONFIG_SYNC_LKG_KEY is generated by the chart while global.autoGenerateSecrets=true and global.preserveExistingSecrets=false; with either flipped, add it to that same Secret alongside the token. Hybrid enables config-sync by default; set %s.configSync.enabled=false only for Postgres-managed configuration." $component.name $component.name $component.name $component.name) -}}
  {{- end -}}
  {{- end -}}
{{- end -}}

{{- /* Hybrid product OTLP is mandatory when TrustGate and/or TrustGuard are
     enabled. data-plane-only (red-teaming) hybrid skips DataAgent. */ -}}
{{- $clickstack := default dict $global.clickstack -}}
{{- $egress := default dict $clickstack.egress -}}
{{- if eq $mode "hybrid" -}}
  {{- if and (hasKey $clickstack "enabled") (eq $clickstack.enabled false) -}}
    {{- fail "global.clickstack.enabled is no longer supported: hybrid product OTLP is mandatory. Use global.deploymentMode=external for air-gapped / local-only product telemetry." -}}
  {{- end -}}
  {{- if and (hasKey $egress "enabled") (eq $egress.enabled false) -}}
    {{- fail "global.clickstack.egress.enabled is no longer supported: hybrid product OTLP always uses the DataAgent-co-located egress collector. Use global.deploymentMode=external for air-gapped / local-only product telemetry." -}}
  {{- end -}}
  {{- if eq (include "neuraltrust-platform.dataagent.required" .) "true" -}}
    {{- range $product := list "trustgate" "trustguard" -}}
      {{- if eq (include "neuraltrust-platform.product.enabled" (dict "ctx" $ "product" $product)) "true" -}}
        {{- if ne (include "neuraltrust-platform.dataagent.instanceEnabled" (dict "ctx" $ "product" $product)) "true" -}}
          {{- $valuesRoot := include "neuraltrust-platform.product.valuesRoot" (dict "product" $product) -}}
          {{- fail (printf "v2 hybrid with global.products.%s=true requires %s.dataagent (enrolment.token or enrolment.existingSecret.name) so the OTLP egress sidecar can use the loopback OAuth broker. Use global.deploymentMode=external for air-gapped / local-only product telemetry." $product $valuesRoot) -}}
        {{- end -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
{{- end -}}

{{- /* data-plane-api SQL backend validation. */ -}}
{{- $dpRoot := default dict (index .Values "data-plane-api") -}}
{{- $dpComponents := default dict (default dict $dpRoot.dataPlane).components -}}
{{- $dpApi := default dict $dpComponents.api -}}
{{- $dpApiEnabled := true -}}
{{- if hasKey $dpApi "enabled" -}}{{- $dpApiEnabled = $dpApi.enabled -}}{{- end -}}
{{- $dpApiDatabase := default dict $dpApi.database -}}
{{- $dpBackend := $dpApiDatabase.backend | default "" | toString | lower -}}
{{- $dataPlaneEnabled := eq (include "neuraltrust-platform.product.enabled" (dict "ctx" . "product" "dataPlane")) "true" -}}
{{- if and $dataPlaneEnabled $dpBackend (not (has $dpBackend (list "postgres" "postgresql" "clickhouse" "auto"))) -}}
  {{- fail (printf "data-plane-api.dataPlane.components.api.database.backend must be one of: postgres, clickhouse, auto (got %q)" $dpBackend) -}}
{{- end -}}
{{- if and $dataPlaneEnabled (eq $mode "hybrid") $dpApiEnabled (eq $dpBackend "clickhouse") -}}
  {{- $dpCh := default dict $dpComponents.clickhouse -}}
  {{- $dpChHost := $dpCh.host | default "clickhouse" -}}
  {{- if not (contains "." $dpChHost) -}}
    {{- fail "data-plane-api.dataPlane.components.api.database.backend=clickhouse in v2 hybrid requires an external ClickHouse: set data-plane-api.dataPlane.components.clickhouse.host to a dotted (external) endpoint, or use the default PostgreSQL backend." -}}
  {{- end -}}
{{- end -}}

{{- /*
Config-sync gRPC TLS must be obtainable whenever the gateway binaries refuse
cleartext. Under a deployed APP_ENV the control plane will not construct its
listener without a cert/key, so turning generation off without supplying a
Secret produces a pod that cannot start. Fail at render instead.
*/ -}}
{{- if eq $mode "external" -}}
  {{- range $chart := list "agentgateway" "trustguard" -}}
    {{- $sub := default dict (index $.Values $chart) -}}
    {{- if eq (include "neuraltrust-platform.product.enabled" (dict "ctx" $ "product" (ternary "trustgate" "trustguard" (eq $chart "agentgateway")))) "true" -}}
      {{- $appEnv := lower (trim ((default dict $sub.config).appEnv | default "")) -}}
      {{- if has $appEnv (list "prod" "production" "staging" "stage") -}}
        {{- $tls := default dict (default dict $sub.configSync).grpcTls -}}
        {{- /* hasKey, not `default`: sprig reads an explicit false back as true. */ -}}
        {{- $autoGenOff := and (hasKey $tls "autoGenerate") (not $tls.autoGenerate) -}}
        {{- if and $autoGenOff (not ($tls.existingSecret | default "")) -}}
          {{- fail (printf "%s.configSync.grpcTls.autoGenerate=false requires %s.configSync.grpcTls.existingSecret: with config.appEnv=%q the control plane refuses to start without a config-sync gRPC TLS cert and key. Supply a kubernetes.io/tls Secret (tls.crt, tls.key, ca.crt), re-enable autoGenerate, or set a non-deployed config.appEnv." $chart $chart $appEnv) -}}
        {{- end -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
