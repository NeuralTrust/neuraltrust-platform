# NeuralTrust Platform (v2 only). For v1 clusters pin --version ~1.14.0.

global:
  # Cloud / Kubernetes flavour: "aws" | "gcp" | "azure" | "openshift" | "kubernetes"
  platform: "gcp"
  # "hybrid" (default) → data planes in-cluster; control planes hosted.
  # "external" → control + data planes + in-cluster analytics (no DataAgent).
  # "saas" → everything external renders, plus DataBridge, the ClickStack ingest
  #   gateway and DataCore in hybrid residency, so this cluster can serve data
  #   planes that live somewhere else. Happy path: set global.domain only
  #   (UI hosts + hybrid dial names). Override with controlPlane.domain for
  #   split-DNS.
  deploymentMode: "hybrid"
  # Which NeuralTrust SaaS the hybrid control-plane traffic goes to:
  #   "eu" (default) → *.neuraltrust.ai
  #   "us"           → *.us.neuraltrust.ai  (Americas)
  # Drives config-sync, DataBridge enrolment and ClickStack telemetry together.
  # Any other value is rejected at render. Inert in external mode.
  # The config-sync token and DataAgent enrolment token must be issued by that
  # same region; per-endpoint overrides below still win when set.
  saasRegion: "eu"
  controlPlane:
    # Point a hybrid data plane at a control plane that is not NeuralTrust's
    # — a customer (or internal) global.deploymentMode=saas install.
    #
    # --- domain -------------------------------------------------------------
    # Bare DNS suffix, no scheme/port/path. On hybrid: replaces saasRegion for
    # every outbound leg. On saas: optional override of global.domain when dial
    # names differ from UI hosts (split-DNS).
    #   databridge.<domain>:443
    #   https://telemetry.<domain>
    #   <product>-configsync.<domain>:443
    # Leave empty on hybrid to use NeuralTrust SaaS per saasRegion.
    # Leave empty on saas to use global.domain.
    domain: ""
    # L4 LoadBalancer scheme for DataBridge southbound + config-sync expose
    # (AWS NLB annotations when local annotations are empty). saas only.
    #   internal          — private hybrid reachability (default)
    #   internet-facing   — data planes over the public internet
    loadBalancerScheme: "internal"
    # --- dial hosts (DNS not ready yet / raw NLB) ---------------------------
    # When Route53 / private DNS for *.<domain> is missing, dial the load
    # balancer hostname directly and keep domain for TLS SNI. host:port;
    # bare host gets :443. Empty → derived from domain / saasRegion.
    databridgeAddr: "" # e.g. k8s-….elb.amazonaws.com:443
    configSyncAddr: "" # e.g. k8s-….elb.amazonaws.com:443 (single product only; 2+ products fail the render)
    telemetryUrl: "" # e.g. https://k8s-….elb.amazonaws.com  (OTLP/HTTP base)
    # --- private / chart-generated CA --------------------------------------
    # Secret (key ca.crt) holding the control-plane CA bundle. One name wires
    # all three dial legs. Empty → system roots (NeuralTrust SaaS).
    # Produce with scripts/export-controlplane-ca.sh on the central cluster.
    caSecretName: ""
  # External-only bootstrap admin for control-plane-app. Ignored in hybrid
  # (app does not render). Prefer existingSecret (avoids Helm release history);
  # inline email+password is the escape hatch when both are non-empty.
  superadmin:
    email: ""
    password: ""
    existingSecret:
      name: ""
      emailKey: "ONPREM_SUPERADMIN_EMAIL"
      passwordKey: "ONPREM_SUPERADMIN_PASSWORD"
  # Outbound platform email (control-plane-app is the only sender). The app
  # instantiates one transport, selected by provider. Leaving provider on
  # "resend" with no credentials keeps email off; the app logs and skips.
  email:
    # resend | ses | smtp
    provider: "resend"
    # "From" address. Empty falls back to the legacy
    # controlPlane.secrets.resendAlertSender, then to the app's own default.
    from: ""
    # Optional Reply-To header.
    replyTo: ""
    # Reference an operator-managed Secret instead of the inline credentials
    # below, so nothing lands in Helm release history.
    existingSecret:
      name: ""
      resendApiKeyKey: "RESEND_API_KEY"
      smtpPasswordKey: "SMTP_PASSWORD"
      sesAccessKeyIdKey: "SES_ACCESS_KEY_ID"
      sesSecretAccessKeyKey: "SES_SECRET_ACCESS_KEY"
    resend:
      # Falls back to controlPlane.secrets.resendApiKey when empty.
      apiKey: ""
    ses:
      # Required when provider is ses. Independent of global.aws.region so SES
      # can live in a different region than the cluster.
      region: ""
      # Leave both empty to use the pod's IAM role (IRSA / instance profile).
      # Setting them overrides the SDK credential chain for every AWS call in
      # the pod, including Postgres IAM auth.
      accessKeyId: ""
      secretAccessKey: ""
    smtp:
      # host and port are required when provider is smtp.
      host: ""
      port: 587
      # false sends without TLS; anything else is treated as secure by the app.
      secure: true
      # Omit user/password for an unauthenticated relay.
      user: ""
      password: ""
  # Hybrid product selection (positive opt-in). Defaults are all false so
  # overlays only declare what they want. External mode ignores these flags
  # and always deploys the full product stack. Firewall follows TrustGuard.
  products:
    trustgate: false
    trustguard: false
    dataPlane: false
  # v2 knobs: shared client_credentials pair AgentGateway presents to
  # TrustGuard. Both sides read the same Secret so id/secret stay in sync.
  v2:
    trustguardClientId: "agentgateway-platform"
    trustguardClientSecret: "" # Auto-generated when empty (global.autoGenerateSecrets)
    trustguardClientSecretName: ""
  # Hybrid raw-telemetry destination. local (default) keeps payloads in Postgres.
  telemetry:
    raw: local
  # Hybrid product OTLP: apps → local clickstack-egress-collector (DataAgent
  # enrolment). No direct authToken. Air-gapped → deploymentMode=external.
  # Ignored in external (in-cluster clickstack-otel-collector → ClickHouse).
  clickstack:
    endpoint: ""
    protocol: ""
    insecure: false
    egress:
      nameOverride: "" # ClusterIP Service name (default clickstack-egress-collector)
      clientId: "otlp-egress" # non-secret oauth2client placeholder
      clientSecret: "unused" # non-secret oauth2client placeholder (broker ignores it)
      endpoint: "" # OTLP/HTTP base; default https://telemetry.neuraltrust.ai
      # Sidecar bind host. Override to "0.0.0.0" only for IPv4-only kernels.
      listenHost: "::"
      # Secret (key ca.crt) holding the CA bundle that signs the endpoint above.
      # Empty trusts the system roots. Set it when the telemetry endpoint belongs
      # to a customer-owned control plane presenting a private or chart-generated
      # certificate. The collector reads its trust store from config, not from
      # global.customCaCert, so that setting alone does not cover this hop.
      # When set (or when global.controlPlane.caSecretName expands here), the
      # exporter keeps system roots by default — telemetry is often publicly
      # signed while DataBridge/config-sync use the chart CA.
      tlsCaSecretName: ""
      # When tlsCaSecretName / caSecretName is active, also trust system roots
      # (otelcol include_system_ca_certs_pool). false = closed private-PKI only.
      tlsIncludeSystemCaCerts: true
      image:
        repository: europe-west1-docker.pkg.dev/neuraltrust-app-prod/nt-docker/opentelemetry-collector-contrib
        tag: "0.158.0"
        pullPolicy: IfNotPresent
      resources: {}
  # Base domain used for URL generation (<hostPrefix>.<domain>).
  domain: "neuraltrust.ai"
  imageRegistry: "" # Global registry mirror; empty = per-component defaults
  # Optional global pull-secret list. Control-plane app/api honour it after
  # their own keys (AUT-390); other product charts vary — see chart-wide audit.
  imagePullSecrets: []
  autoGenerateSecrets: true
  preserveExistingSecrets: false
  # Shared platform Secret (`platform-secrets`) — one home for every
  # cross-service application credential (service-to-service JWT secrets, the
  # app auth secret, encryption keys). Replaces the hand-duplicated per-service
  # copies that used to drift apart and cause silent auth failures.
  #
  # Upgrades adopt the live per-service values, so nothing rotates. The legacy
  # per-service Secrets keep being written for one release so a rollback still
  # finds them; see SECRETS.md for the key-by-key mapping.
  platformSecret:
    # false ⇒ every consumer keeps referencing its legacy per-service Secret.
    # Also implied by preserveExistingSecrets, where the operator owns them.
    enabled: true
    # Point consumers at a Secret you manage instead. Must carry the logical key
    # names listed in SECRETS.md.
    existingSecret:
      name: ""
    # Pin individual credentials, keyed by logical name. Highest precedence.
    # e.g. values: { CONTROL_PLANE_JWT_SECRET: "..." }
    # Supply these via --set or a values file kept out of git; never commit real
    # credentials. For committed config use existingSecret.name above, or
    # External Secrets. Pin the target of an alias, not the alias itself
    # (AUTH_SECRET, not NEXTAUTH_SECRET) — the chart rejects the latter.
    values: {}
  # MCP OAuth. The control-plane app acts as the authorization server and
  # TrustGate as a pre-registered confidential client; the chart gives both sides
  # the same client secret from `platform-secrets`, so the pair cannot drift.
  # external mode only — hybrid has no control-plane app (it uses the hosted
  # platform), so enabling this in hybrid fails at render time rather than wiring
  # a login that cannot complete.
  mcpOAuth:
    # Unset ⇒ on in external, off in hybrid. A signing key is always available
    #          because generateSigningKey below creates one when nothing else
    #          provides it, so the feature needs no operator action.
    # true   ⇒ required. The render fails when no signing key is available, which
    #          can only happen with generateSigningKey: false and no key of yours.
    # false  ⇒ never. With no client id the app answers 503 on the OAuth routes.
    enabled:
    # Generate the RS256 signing key in-cluster on first install, via a hook Job
    # that reuses the app image this chart already deploys — no extra image to
    # mirror or scan. Skipped as soon as you supply a key of your own.
    # Set false to own the key yourself; MCP OAuth then stays off until you do.
    generateSigningKey: true
    # Client id TrustGate presents. Both sides must agree.
    clientId: "trustgate"
    # Full issuer URL, e.g. "https://app.example.com/api/mcp/oauth".
    # Empty ⇒ derived from global.domain. Set it explicitly whenever the app is
    # not served from app.<global.domain>, since the client resolves JWKS through
    # this URL and a wrong host fails only at request time.
    issuer: ""
    # Audience TrustGate validates the `aud` claim against. This default matches
    # what the app mints, which is a compiled-in constant it does NOT read from the
    # environment — so changing this configures only one side and TrustGate will
    # reject every token the app issues. Leave it alone unless the app gains a
    # matching setting (AUT-391).
    audience: "neuraltrust-mcp"
    # Comma-separated scopes TrustGate requires on the token. Client-side only, as
    # with audience above. Empty ⇒ none required.
    scopes: ""
    # Comma-separated callback origins, e.g. "https://*.mcp.example.com".
    # Empty ⇒ https://*.mcp.<global.domain>. Do not widen this to bare "https://":
    # an empty allowlist makes the app accept a callback on ANY https origin, so the
    # chart refuses to enable MCP OAuth when neither this nor global.domain is set.
    allowedRedirectHosts: ""
    # Supplying your own RS256 signing key is optional — leave it to
    # generateSigningKey above unless you need to control the material.
    # It must be PKCS#8, which is why the chart's own templating cannot produce it
    # (Helm emits PKCS#1 for RSA, and its one PKCS#8 generator produces ed25519).
    # Create one, base64 so it survives values as a single line:
    #   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
    #     | openssl base64 -A
    # then pin it via global.platformSecret.values.MCP_OAUTH_SIGNING_KEY or put it
    # straight in the platform Secret (see SECRETS.md). Yours always wins over a
    # generated key; swapping one in later invalidates tokens signed by the old.
  # AgentGateway Admin API machine credentials (ENG-1212). Automation exchanges
  # a long-lived client_id/client_secret for a short-lived admin token at
  # POST /api/gateway/oauth/token on the app. The app signs with an RSA private
  # key; TrustGate verifies with the matching public key. Optional: leaving the
  # feature off keeps console JWTs working and disables the Credentials tab.
  #
  # External/saas only — hybrid has no in-cluster Admin API (proxy-only) and no
  # control-plane app to mint tokens. Both sides share one issuer helper, because
  # a trailing-slash mismatch is enough to 401 every service token.
  agentgatewayM2m:
    # Unset ⇒ on in external/saas when a key pair is available (generated by
    #          default). Always off in hybrid.
    # true   ⇒ required. The render fails when no key pair is available, which
    #          needs generateKeys: false and no keys of yours.
    # false  ⇒ never. The Credentials tab stays disabled; console JWTs still work.
    enabled:
    # Generate the RSA PKCS#8 private key and matching public key in-cluster on
    # first install, via a hook Job that reuses the app image. Skipped as soon
    # as you supply a pair of your own. Set false to own the keys yourself.
    generateKeys: true
    # iss stamped on tokens and verified by TrustGate. Empty ⇒ the app's public
    # origin (https://app.<global.domain>). Set it whenever the app is not served
    # from that host — the two sides must be identical, character for character.
    issuer: ""
    # aud on both sides. Leave at the default unless you change TrustGate too.
    audience: "trustgate-admin"
    # kid stamped on tokens. Only needed while two keys are live during rotation.
    keyId: ""
    # Ceiling TrustGate accepts on a token's own exp-iat. Tokens above it 401.
    maxTokenTtl: "15m"
    # TrustGate's verifying keys: a single-line base64-encoded public PEM, or a
    # JSON array of {kid,pem} during rotation. Empty when generateKeys is on —
    # the Job writes the matching public half next to the private key. Required
    # the moment you pin AGENTGATEWAY_M2M_PRIVATE_KEY yourself, because the chart
    # cannot derive a public key from a value it does not parse.
    publicKeys: ""
    # Supplying your own pair is optional. PKCS#8 private key, base64 so it
    # survives values as a single line:
    #   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out m2m.key
    #   openssl rsa -in m2m.key -pubout -out m2m.pub
    #   base64 -i m2m.key | tr -d '\n'   # → platformSecret.values.AGENTGATEWAY_M2M_PRIVATE_KEY
    #   base64 -i m2m.pub | tr -d '\n'   # → agentgatewayM2m.publicKeys
    # Never put the private key in publicKeys or the public key on the app.
  # Shared PostgreSQL (v2 hybrid + external control-plane).
  # Hybrid: every service (AgentGateway, TrustGuard, DataAgent, data-plane-api)
  # connects to ONE shared database via the `postgresql-secrets` Secret
  # rendered from this block.
  # External: `deploy` still gates the in-cluster Postgres Deployment, and this
  # block (plus control-plane-api overlays) feeds the shared `postgresql-secrets`
  # used by control-plane-api/app. Runtime services keep their own per-service
  # `*.database` identities. Set `deploy: false` and `host`/credentials (or
  # existingSecret) for a hosted instance. Application migrations own tables;
  # there is no chart-managed schema init.
  postgresql:
    deploy: true
    host: "" # Empty + deploy=true resolves to the in-cluster "control-plane-postgresql" Service
    port: 5432
    user: neuraltrust
    database: neuraltrust
    password: "" # Empty auto-generates and stores it in postgresql-secrets
    sslMode: prefer
    # Prisma pool size baked into the generated DSN. Multiplies with app
    # replicaCount against the server's max_connections — lower it when many
    # services share one Postgres, or when replica counts go up.
    connectionLimit: 15
    # authMode: password | iam (external Postgres only; ignored when deploy=true).
    # awsRegion is required for IAM token minting on control-plane api/app.
    authMode: "password"
    awsRegion: ""
    # Naming a Secret here hands it to you wholesale: the chart injects it with
    # envFrom and cannot rename its keys, so use the variable names your services
    # read. Leave empty to let the chart write the canonical POSTGRES_* family and
    # rename per service (see SECRETS.md).
    existingSecret:
      name: ""
    # The control-plane role's password, owned by a Secret you created. The
    # chart then leaves `POSTGRES_PASSWORD` out of postgresql-secrets and
    # injects yours by reference wherever it is read, so no credential passes
    # through values or release history. Unlike `existingSecret` above, the
    # chart still writes every other key. Available in both external and hybrid.
    #
    # It works because nothing needs a connection string composed at render
    # time: `control-plane-app` builds its own from the POSTGRES_* parts, and
    # the TrustGate / TrustGuard telemetry exporters plus DataAgent fall back
    # to the same discrete parts when no DSN is configured (RUN-1086, RUN-1093).
    #
    # Ignored under authMode=iam, which has no static password to redirect.
    #
    # Image floor: app images need `scripts/postgres-password-url.mjs` (Prisma
    # CLI still wants a URL at migrate time). TrustGate / TrustGuard / DataAgent
    # need the discrete-parts fallback — older images still expect
    # SENSIBLE_PG_DSN and will skip the raw-telemetry sink or fail DataAgent
    # config validation. Check the tags in the subchart values before setting
    # this on hybrid.
    #
    # The reference is required rather than optional: a wrong `key` stops the pod
    # with CreateContainerConfigError instead of connecting with no password.
    passwordSecret:
      name: "" # Empty ⇒ the chart owns the password (inline or generated)
      key: "" # Empty ⇒ "POSTGRES_PASSWORD"
    # Bootstrap Job for the chart's own PostgreSQL. The container image creates
    # exactly one role and one database (user/database above), which is all hybrid
    # needs — every hybrid service shares that pair. External mode gives each
    # service its own database and its own migrations, so the Job creates and
    # grants those roles too, taking each password from the Secret the service
    # itself reads. Idempotent, and it never runs against a managed instance:
    # setting `host` or authMode=iam stops it rendering at all. Deliberately not
    # the key AUT-334 retired, whose mode=enabled did reach managed instances: an
    # overlay still carrying that one is ignored rather than obeyed.
    bootstrapJob:
      enabled: true
      resources: {} # Empty → 100m/64Mi requests, 500m/128Mi limits
    # In-cluster PostgreSQL Deployment image/resources/persistence knobs.
    image:
      repository: europe-west1-docker.pkg.dev/neuraltrust-app-prod/nt-docker/postgres
      tag: "17-alpine"
      pullPolicy: IfNotPresent
      # Empty → global.imagePullSecrets → chart default gcr-secret. ["none"] suppresses.
      imagePullSecrets: []
    resources:
      requests:
        memory: 2Gi
        cpu: 500m
      limits:
        memory: 4Gi
        cpu: 2000m
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""
      preserveOnDelete: true
    service:
      type: ClusterIP
      port: 5432
  # Shared Redis (v2 hybrid).
  redis:
    deploy: true
    host: "" # Empty + deploy=true resolves to the in-cluster "redis" Service
    port: 6379
    password: ""
    username: ""
    tls: ""
    existingSecret:
      name: ""
      keys:
        host: "REDIS_HOST"
        port: "REDIS_PORT"
        password: "REDIS_PASSWORD"
        username: "REDIS_USERNAME"
        tls: "REDIS_TLS"
  security:
    allowInsecureImages: true # Bitnami charts require this
  storageClass: ""
  nodeSelector: {}
  tolerations: []
  proxy:
    enabled: false
    httpProxy: ""
    httpsProxy: ""
    noProxy: "localhost,127.0.0.1,::1,.cluster.local,.svc"
  customCaCert:
    enabled: false
    secretName: ""
    key: ca.crt
    mountPath: /etc/ssl/certs/custom-ca.crt
  irsa:
    roleArn: ""
    applyGlobally: false
  psc:
    negNames: {}
  ingress:
    provider: ""
    className: ""
    annotations: {}
    tls:
      autoGenerate: true
      secretName: "neuraltrust-ingress-tls"
      commonName: "neuraltrust.local"
      durationDays: 3650
    aws:
      scheme: "internet-facing"
      targetType: "ip"
      groupName: "neuraltrust"
      certificateArn: ""
      sslRedirect: "443"
      wafAclArn: ""
      additionalAnnotations: {}
    gcp:
      staticIpName: ""
      managedCertificates: ""
      backendConfig: ""
      sslRedirect: false
      neg:
        enabled: true
      additionalAnnotations: {}
    azure:
      appGatewayName: ""
      sslCertificate: ""
      sslRedirect: false
      wafPolicyId: ""
      requestTimeout: ""
      additionalAnnotations: {}
  monitoring:
    enabled: false
    additionalLabels: {}
    interval: 30s
    alertLabels:
      team: platform
  observability:
    enabled: false
    tenantId: ""
    clusterName: ""
    hostedExport:
      enabled: true
      endpoint: "https://collector.neuraltrust.ai"
      auth:
        tokenSecretName: "neuraltrust-observability-token"
        tokenSecretKey: "token"
        tokenValue: ""
      tlsCaSecretName: ""
      sendingQueue:
        enabled: true
        storage: file_storage
        maxSize: 1000
      retry:
        initialInterval: 5s
        maxInterval: 30s
        maxElapsedTime: 0s
    sendLogs: false
    sendTraces: true
    collector:
      fullnameOverride: "otel-collector"
      endpoint: ""
      # Bind host for health / OTLP / prometheus exporters. Default "::"
      # dual-stacks on Linux; set "0.0.0.0" only if bindv6only=1 breaks IPv4.
      listenHost: "::"
      image:
        repository: europe-west1-docker.pkg.dev/neuraltrust-app-prod/nt-docker/opentelemetry-collector-contrib
        tag: "0.158.0"
        pullPolicy: IfNotPresent
      imagePullSecret: "gcr-secret"
      replicas: 1
      autoscaling:
        enabled: false
        minReplicas: 1
        maxReplicas: 3
        targetCPUUtilizationPercentage: 80
        targetMemoryUtilizationPercentage: 90
      podDisruptionBudget:
        enabled: false
        maxUnavailable: 1
      service:
        type: ClusterIP
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
      bufferPVC:
        enabled: true
        size: 2Gi
        storageClass: ""
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      podAnnotations: {}
      podLabels: {}
      nodeSelector: {}
      tolerations: []
      affinity: {}
      debug: false
      extraReceivers: {}
      extraProcessors: {}
      extraExporters: {}
      extraServicePipelines: {}
      serviceAccount:
        create: true
        name: ""
        annotations: {}
      rbac:
        create: true
        clusterScoped: true
# Infrastructure toggles.
infrastructure:
  # In-cluster ClickHouse: external mode only. Set deploy=false for hosted CH.
  clickhouse:
    deploy: true
    external:
      host: "clickhouse.clickhouse.svc.cluster.local"
      port: "8123"
      user: "neuraltrust"
      password: ""
      database: "neuraltrust"
      secretName: "clickhouse"
      secretKey: "admin-password"
  # In-cluster Redis Deployment knobs. host/port/password flow through
  # global.redis; the block below controls how the in-cluster Redis renders.
  redis:
    image:
      repository: europe-west1-docker.pkg.dev/neuraltrust-app-prod/nt-docker/redis-stack-server
      tag: "7.2.0-v20"
      pullPolicy: IfNotPresent
    port: 6379
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    persistence:
      enabled: false
      size: 2Gi
      storageClass: ""
    nodeSelector: {}
    tolerations: []
# ClickHouse subchart values (rendered only in v2 external).
clickhouse:
  securityHardening: true
  fullnameOverride: "clickhouse"
  replicaCount: 1
  imagePullSecrets: "gcr-secret"
  image:
    repository: europe-west1-docker.pkg.dev/neuraltrust-app-prod/nt-docker/clickhouse-server
    tag: "26.7"
    pullPolicy: IfNotPresent
  global:
    imagePullSecrets: []
  auth:
    username: "neuraltrust"
    password: ""
    existingSecret: ""
    existingSecretKey: "admin-password"
    database: "neuraltrust"
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources:
    requests:
      memory: 4Gi
      cpu: 1
    limits:
      memory: 8Gi
      cpu: 4
  logLevel: "fatal"
  listenHost: "::"
  backup:
    enabled: false
    schedule: "0 2 * * *"
    database: ""
    storage:
      type: s3
      s3:
        endpoint: ""
        accessKeyId: ""
        secretAccessKey: ""
        existingSecret: ""
        existingSecretKeyAccessKeyId: access-key-id
        existingSecretKeySecretAccessKey: secret-access-key
      azblob:
        connectionString: ""
        container: ""
        path: "clickhouse-backups/"
        existingSecret: ""
        existingSecretKeyConnectionString: connection-string
    image:
      repository: ""
      tag: ""
      pullPolicy: IfNotPresent
    serviceAccount:
      create: false
      name: ""
      annotations: {}
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    nodeSelector: {}
    tolerations: []
    affinity: {}
# =============================================================================
# Control-plane split (v2 external only).
# =============================================================================
# Both charts share the umbrella-owned `control-plane` ServiceAccount and
# `control-plane-secrets` Secret (templates/control-plane/). Component config
# lives inside each chart's own root.
#
# imagePullSecrets precedence (AUT-390): controlPlane.imagePullSecrets →
# <subchart>.imagePullSecrets → global.imagePullSecrets → gcr-secret.
# Omit the keys (do not default them) so unset falls through; set "none" (or
# global ["none"]) to suppress. Fallback lives only in the template helper.
control-plane-api:
  controlPlane:
    serviceAccount:
      create: true
      name: control-plane
      annotations: {}
    secrets:
      controlPlaneJWTSecret: ""
      authSecret: ""
      openaiApiKey: ""
      resendApiKey: ""
      # Outbound "from" address; the app reads it as SENDER.
      resendAlertSender: ""
      # Optional Reply-To header on platform emails (REPLY_TO_EMAIL).
      resendReplyTo: ""
      firewallJwtSecret: ""
      modelScannerSecret: ""
    components:
      api:
        enabled: true
        host: ""
        hostPrefix: "api"
        service:
          type: ClusterIP
        ingress:
          enabled: true
          className: ""
          annotations: {}
          tls:
            enabled: true
            secretName: ""
        replicaCount: 2
        image:
          repository: "europe-west1-docker.pkg.dev/neuraltrust-app-prod/nt-docker/control-plane-api"
          tag: "v1.24.0"
          pullPolicy: IfNotPresent
        config:
          controlPlaneApiUrl: ""
          dataPlaneApiUrl: ""
        resources:
          requests:
            memory: 1Gi
            cpu: 1000m
          limits:
            memory: 2Gi
            cpu: 2000m
        autoscaling:
          enabled: false
          minReplicas: 1
          maxReplicas: 10
          targetCPUUtilizationPercentage: 80
          targetMemoryUtilizationPercentage: 90
        podDisruptionBudget:
          enabled: false
          maxUnavailable: 1
        extraEnv: []
        extraEnvFrom: []
      postgresql:
        # Per-service Postgres wiring for v2 external. Ignored in hybrid.
        # authMode: password | iam. IAM requires IRSA + awsRegion; the Python
        # API uses POSTGRES_CONNECTION_TYPE=aurora (emitted into postgresql-secrets).
        authMode: "password"
        awsRegion: "" # Required when authMode=iam → AWS_REGION (or set global.postgresql.awsRegion)
        secrets:
          name: "postgresql-secrets"
          user: "neuraltrust"
          password: ""
          database: "neuraltrust"
          host: "control-plane-postgresql"
          port: "5432"
control-plane-app:
  controlPlane:
    serviceAccount:
      create: true
      name: control-plane
      annotations: {}
    components:
      app:
        enabled: true
        host: ""
        hostPrefix: "app"
        hostname: "::"
        secondaryHost: ""
        service:
          type: ClusterIP
        ingress:
          enabled: true
          className: ""
          annotations: {}
          tls:
            enabled: true
            secretName: ""
        replicaCount: 2
        image:
          repository: "europe-west1-docker.pkg.dev/neuraltrust-app-prod/nt-docker/app"
          tag: "v1.147.3"
          pullPolicy: IfNotPresent
        config:
          nodeEnv: production
          port: 3000
          controlPlaneApiUrl: ""
          dataPlaneApiUrl: ""
          appUrl: ""
          nextAuthUrl: ""
          firewallApiUrl: ""
          # Prefer platform env email (SES/SMTP/Resend) over per-org DB config.
          # Default true because this chart only renders in external mode.
          authEmailForceEnv: "true"
          agentgatewayUrl: ""
          agentgatewayProxyUrl: ""
          trustguardUrl: ""
          # Customer-facing TrustGuard origin used in collector, WAF and SDK
          # setup snippets. The console refuses to print in-cluster hosts there,
          # so trustguardUrl cannot serve this purpose. Empty => derived as
          # https://trustguard.<global.domain>, matching the trustguard chart's
          # data-plane ingress; set explicitly when that host differs.
          trustguardPublicUrl: ""
          datacoreUrl: ""
          datacoreMetricsEnabled: "true"
          alertEngineApiUrl: ""
          trustlensApiUrl: ""
          modelScannerApiUrl: ""
          openaiModel: "gpt-4o-mini"
        resources:
          requests:
            memory: 512Mi
            cpu: 250m
          limits:
            memory: 1Gi
            cpu: 500m
        # Surge before retire; preStopSleepSeconds lets the ingress drain.
        maxUnavailable: 0
        maxSurge: 1
        preStopSleepSeconds: 15
        initContainer:
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: 500m
        autoscaling:
          enabled: false
          minReplicas: 1
          maxReplicas: 10
          targetCPUUtilizationPercentage: 80
          targetMemoryUtilizationPercentage: 90
        podDisruptionBudget:
          enabled: false
          maxUnavailable: 1
        extraEnv: []
        extraEnvFrom: []
      postgresql:
        # Per-service Postgres wiring for v2 external.
        # authMode: password | iam. IAM requires IRSA + awsRegion; the Next.js
        # app uses POSTGRES_AUTH_MODE=iam and mints a token for Prisma migrate.
        authMode: "password"
        awsRegion: "" # Required when authMode=iam → AWS_REGION (or set global.postgresql.awsRegion)
        secrets:
          name: "postgresql-secrets"
          user: "neuraltrust"
          password: ""
          database: "neuraltrust"
          host: "control-plane-postgresql"
          port: "5432"
# =============================================================================
# Platform v2 in-cluster services.
# =============================================================================

# TrustGate (commercial name for AgentGateway): admin + proxy/MCP. Image repo
# stays agentgateway for now; K8s names stay agentgateway-*.
agentgateway:
  image:
    tag: "v0.41.1"
  # Empty host/port/sslMode/username/tls inherit from global.postgresql /
  # global.redis, then fall back to the in-cluster Services. Set them here only
  # to point this one service somewhere else.
  database:
    sslMode: ""
    # Unset ⇒ global.postgresql.authMode (AUT-392). Explicit true/false wins.
    # iamAuth:
  redis:
    host: ""
    iamAuth: false
  trustguard:
    # Empty ⇒ stable in-cluster TrustGuard Service when
    # global.products.trustguard=true. Omitted entirely when Guard is off.
    baseURL: ""
  # Per-product DataAgent (hybrid). Nested so product overlays mix via -f.
  # Identity (tenant_id / instance_id) comes from the enrolment JWT only.
  dataagent:
    enrolment:
      token: ""
      existingSecret:
        name: ""
        key: "ENROLMENT_TOKEN"
    existingSecret:
      name: ""
# TrustGuard: control-plane + data-plane (/v1/evaluate).
trustguard:
  image:
    tag: "v0.39.1"
  # Empty host/port/sslMode/username/tls inherit — see the agentgateway note.
  database:
    sslMode: ""
    # Unset ⇒ global.postgresql.authMode (AUT-392). Explicit true/false wins.
    # iamAuth:
  redis:
    host: ""
    iamAuth: false
  dataagent:
    enrolment:
      token: ""
      existingSecret:
        name: ""
        key: "ENROLMENT_TOKEN"
    existingSecret:
      name: ""
# TrustLens (opt-in).
trustlens:
  enabled: false
  image:
    tag: ""
  database:
    # Empty inherits global.postgresql, then control-plane-postgresql:5432.
    host: ""
    port: ""
    sslMode: ""
# Shared DataAgent defaults. Per-product enrolment lives only under
# agentgateway.dataagent / trustguard.dataagent.
dataagent:
  image:
    tag: "v0.6.1"
  databridge:
    # Empty derives from global.saasRegion (databridge.<saas domain>:443).
    addr: ""
    serverName: ""
  database:
    # Empty inherits global.postgresql, then control-plane-postgresql:5432.
    sslMode: ""
# DataCore (v2 external only): residency API over local ClickHouse + Postgres
# (deployment metadata). Own `datacore` database/role — not the hybrid shared
# `global.postgresql` block.
datacore:
  image:
    tag: "v0.18.0"
  database:
    # Empty inherits global.postgresql, then control-plane-postgresql:5432.
    # name/user stay per-service: external gives each service its own role+DB.
    host: ""
    port: ""
    name: "datacore"
    user: "datacore"
    sslMode: ""
    # Unset ⇒ global.postgresql.authMode (AUT-392). Explicit true/false wins.
    # iamAuth:
  clickhouse:
    host: "clickhouse"
    nativePort: 9000
    database: "default"
    otelDatabase: "otel"
# DataBridge (v2 saas only): brokers data planes running outside this cluster.
# HA by default (replicas=2 + peer headless). Singleton: databridge.replicas: 1.
# Ignored in hybrid and external.
databridge:
  image:
    tag: "v0.4.2"
  replicas: 2
  peers:
    discovery: "headless"
  auth:
    # introspect (default) or jwt. "token" and "dev" are refused in saas mode:
    # both let any enrolled data plane assert its own tenant.
    mode: "introspect"
  # Agents dial this Service over TLS (no ingress). Default autoGenerate mints
  # a self-signed CA; export with scripts/export-controlplane-ca.sh. BYO:
  # existingSecret or certManager.
  tls:
    existingSecret: ""
    autoGenerate: true
    certManager:
      enabled: false
      issuerRef:
        name: ""
  service:
    southbound:
      # L4 passthrough. Empty annotations ⇒ AWS NLB from
      # global.controlPlane.loadBalancerScheme (internal).
      type: LoadBalancer
      annotations: {}
      loadBalancerSourceRanges: []
# ClickStack ingest gateway (v2 saas only): public OTLP door for data planes in
# other clusters. Verifies a DataCore-signed RS256 JWT per batch, stamps the
# tenant from the verified claim, forwards to clickstack-collector below.
clickstack-ingest-gateway:
  # Same upstream contrib collector as global.observability.collector and
  # global.clickstack.egress, served from the NeuralTrust mirror. Bump all three
  # together.
  image:
    tag: "0.158.0"
  # Exposed at telemetry.<global.controlPlane.domain> — same host hybrid egress
  # sidecars dial. Ingress is ON by default (product path). Inherits
  # global.ingress like app/api (shared ALB + ACM). Disable only if you must
  # hide the public door: ingress.enabled=false.
  ingress:
    enabled: true
    className: ""
    annotations: {}
    tls:
      enabled: true
      secretName: ""
      # Mint a self-signed CA and leaf for the host above, for a control plane
      # reached over a private network. Remote data planes must then trust the CA
      # via global.clickstack.egress.tlsCaSecretName / global.controlPlane.caSecretName.
      autoGenerate: false
# ClickStack OTel collector (v2 external only): OTLP-to-ClickHouse pipeline.
clickstack-otel-collector:
  image:
    tag: "2.34.0"
    repository: europe-west1-docker.pkg.dev/neuraltrust-app-prod/nt-docker/clickstack-otel-collector
  clickhouse:
    endpoint: "http://clickhouse:8123"
    database: "otel"
# AlertEngine (v2 external only): detection rules over ClickHouse telemetry.
alertengine:
  enabled: true
  image:
    tag: "v0.7.2"
  database:
    # Empty inherits global.postgresql, then control-plane-postgresql:5432.
    # name/user stay per-service: external gives each service its own role+DB.
    host: ""
    port: ""
    name: "alertengine"
    user: "alertengine"
    sslMode: ""
    # Unset ⇒ global.postgresql.authMode (AUT-392). Explicit true/false wins.
    # iamAuth:
  clickhouse:
    host: "clickhouse"
    nativePort: 9000
    # Event tables live in `default`; `otel` is the OTLP landing DB only (AUT-385).
    database: "default"
    username: "neuraltrust"
    secure: false
# data-plane-api (analytics / evaluation API).
data-plane-api:
  securityHardening: true
  dataPlane:
    enabled: true
    imagePullSecrets: "gcr-secret"
    serviceAccount:
      create: true
      name: data-plane
      annotations: {}
    secrets:
      # Selected by name and read with optional secretKeyRefs, so an absent
      # Secret leaves the variable unset rather than blocking the pod. The chart
      # does not create these; pre-create the ones you need.
      openaiApiKeySecretName: "openai-secrets"
      googleApiKeySecretName: "google-secrets"
      resendApiKeySecretName: "resend-secrets"
      # Empty ⇒ the shared platform Secret (see global.platformSecret). Set this
      # to read the data-plane JWT from a Secret you manage instead. Unlike the
      # three above, these refs are NOT optional: whatever you point this at must
      # carry both DATA_PLANE_JWT_SECRET and REDIS_URL, or the api pod stops at
      # CreateContainerConfigError.
      dataPlaneJWTSecretName: ""
      # Operator pin for the shared DATA_PLANE_JWT_SECRET. Empty ⇒ resolved from
      # the shared platform Secret.
      dataPlaneJWTSecret: ""
    components:
      clickhouse:
        enabled: true
        host: "clickhouse"
        port: "8123"
        user: "neuraltrust"
        database: "neuraltrust"
        existingSecret:
          name: "clickhouse"
          key: "admin-password"
        auth:
          username: "neuraltrust"
        secrets:
          name: "clickhouse-secrets"
        configmap:
          name: "clickhouse-init-job"
      api:
        enabled: true
        host: ""
        hostPrefix: "data-plane-api"
        service:
          type: ClusterIP
        ingress:
          enabled: true
          className: ""
          annotations: {}
          tls:
            enabled: true
            secretName: ""
        classifierModel: "gpt"
        database:
          backend: ""
          postgresql:
            host: ""
            port: ""
            user: ""
            database: ""
            schema: "public"
            sslMode: "prefer"
            existingSecret:
              name: "postgresql-secrets"
              keys:
                host: "POSTGRES_HOST"
                port: "POSTGRES_PORT"
                user: "POSTGRES_USER"
                password: "POSTGRES_PASSWORD"
                database: "POSTGRES_DB"
            migration:
              enabled: true
              image:
                repository: europe-west1-docker.pkg.dev/neuraltrust-app-prod/nt-docker/postgres
                tag: "17-alpine"
                pullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 128Mi
        image:
          repository: europe-west1-docker.pkg.dev/neuraltrust-app-prod/nt-docker/data-plane-api
          tag: v1.47.0
          pullPolicy: IfNotPresent
        accessMode: ReadWriteOnce
        huggingfaceToken: ""
        storage: 10Gi
        replicas: 2
        autoscaling:
          enabled: false
          minReplicas: 1
          maxReplicas: 10
          targetCPUUtilizationPercentage: 80
          targetMemoryUtilizationPercentage: 90
        podDisruptionBudget:
          enabled: false
          maxUnavailable: 1
        resources:
          requests:
            cpu: 1
            memory: 3Gi
          limits:
            cpu: 2
            memory: 6Gi
        extraEnv: []
        extraEnvFrom: []
        redis:
          backend: "" # Empty ⇒ "redis"
          # Empty inherits global.redis.host/port, then the in-cluster Service.
          host: ""
          port: ""
          db: "0"
          password: ""
          username: ""
          tls: ""
          # data-plane-api reads a whole DSN rather than a password, so unlike the
          # other services this hook supplies the assembled REDIS_URL. Naming a
          # Secret here keeps the credential out of values: the chart stops
          # composing the URL into `data-plane-jwt-secret` and the pod reads yours.
          existingSecret:
            name: "" # Empty ⇒ the chart composes the URL from the settings above
            key: "" # Empty ⇒ "REDIS_URL"
          iamAuth: false
          iamUser: ""
          iamCacheName: ""
          iamRegion: ""
          iamServerless: false
          maxConnections: 100
          mgetChunkSize: 200
          connectTimeoutSeconds: ""
          socketTimeoutSeconds: ""
          healthCheckIntervalSeconds: ""
        k8sJobs:
          enabled: false
          namespace: ""
          rbac:
            create: true
          jobImage:
            repository: ""
            tag: ""
            pullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          ttlSecondsAfterFinished: 3600
          backoffLimit: 0
          maxConcurrentJobs: 10
          waitTimeoutSeconds: 1800
# =============================================================================
# Firewall: part of TrustGuard. In hybrid, global.products.trustguard gates
# workloads and TrustGuard client wiring; external always includes Firewall.
# =============================================================================
firewall:
  securityHardening: true
  firewall:
    imagePullSecrets: "gcr-secret"
    gateway:
      replicas: 2
      image:
        repository: europe-west1-docker.pkg.dev/neuraltrust-app-prod/nt-docker/firewall-cpu
        tag: "v2.28.1"
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: "250m"
          memory: 512Mi
        limits:
          cpu: "500m"
          memory: 1Gi
      startupProbe:
        failureThreshold: 12
      autoscaling:
        enabled: false
        minReplicas: 1
        maxReplicas: 4
        targetCPUUtilizationPercentage: 80
        targetMemoryUtilizationPercentage: 90
      podDisruptionBudget:
        enabled: false
        maxUnavailable: 1
      extraEnv: []
      extraEnvFrom: []
    workerDefaults:
      deploymentStrategy: Recreate
      image:
        repository: europe-west1-docker.pkg.dev/neuraltrust-app-prod/nt-docker/firewall-cpu
        # Keep in lockstep with gateway.image.tag.
        tag: "v2.28.1"
        pullPolicy: IfNotPresent
      replicas: 1
      resources:
        requests:
          cpu: "1000m"
          memory: 3Gi
        limits:
          cpu: "2000m"
          memory: 4Gi
      nodeSelector: {}
      tolerations: []
      hostIPC: false
      startupProbe:
        failureThreshold: 36
      autoscaling:
        enabled: false
        minReplicas: 1
        # Cap at 2: customer GPU pools are smaller than SaaS; memory metric
        # omitted because ML model RSS is constant per pod (wave-2 rule 1).
        maxReplicas: 2
        targetCPUUtilizationPercentage: 80
      podDisruptionBudget:
        enabled: false
        maxUnavailable: 1
    workers:
      toxicity:
        enabled: true
        module: src.workers.toxicity.app:app
        extraEnv: []
        extraEnvFrom: []
      # Gateway /v1/toolguard forwards here (deprecated path).
      indirect-prompt-injections:
        enabled: true
        module: src.workers.indirect_prompt_injections.app:app
        extraEnv: []
        extraEnvFrom: []
      prompt-jailbreak:
        enabled: true
        module: src.workers.prompt_jailbreak.app:app
        extraEnv: []
        extraEnvFrom: []
      prompt-moderation:
        enabled: true
        module: src.workers.prompt_moderation.app:app
        resources:
          requests:
            cpu: "1"
            memory: 4Gi
          limits:
            cpu: "2"
            memory: 6Gi
        extraEnv: []
        extraEnvFrom: []
      response-jailbreak:
        enabled: true
        module: src.workers.response_jailbreak.app:app
        extraEnv: []
        extraEnvFrom: []
    config:
      pythonUnbuffered: "1"
      pythonDontWriteBytecode: "1"
      pythonPath: "/app"
      hfHome: "/root/.cache/huggingface"
      otelEnabled: "false"
    secrets:
      jwtSecret: ""
      huggingFaceToken: ""
    serviceAccount:
      create: true
      name: firewall
      annotations: {}
    podSecurityContext:
      fsGroup: 2000
    securityContext:
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: false
      allowPrivilegeEscalation: false
      runAsNonRoot: false
      runAsUser: 0
    healthCheckPolicy:
      enabled: false
# =============================================================================
# Watchdog (optional): self-monitoring + self-healing.
# =============================================================================
watchdog:
  enabled: false
  # The umbrella renders this ConfigMap with full product/DataAgent context so
  # topology checks use the exact same instance gates as the workloads.
  configMap:
    create: false
    umbrellaTopologyChecks: true
